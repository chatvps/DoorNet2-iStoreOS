name: DoorNet2 iStoreOS Final Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_openwrt:
    name: Build DoorNet2 RK3399 Final Firmware
    # Proven host image used by the bootable R4 DoorNet2 build.
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:

      # ============================================================
      # 1. Build environment
      # ============================================================

      - name: Space cleanup and Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -e

          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            2>/dev/null || true

          docker system prune -af 2>/dev/null || true

          echo "===== RUNNER ====="
          echo "Runner: ubuntu-22.04 (proven R4 baseline)"
          uname -a
          cat /etc/os-release || true

          sudo apt-get update

          sudo apt-get install -y --no-install-recommends \
            ack \
            antlr3 \
            asciidoc \
            autoconf \
            automake \
            autopoint \
            binutils \
            bison \
            build-essential \
            bzip2 \
            ccache \
            clang \
            cmake \
            cpio \
            curl \
            device-tree-compiler \
            flex \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            genisoimage \
            git \
            gperf \
            haveged \
            help2man \
            intltool \
            libc6-dev-i386 \
            libelf-dev \
            libfuse-dev \
            libglib2.0-dev \
            libgmp3-dev \
            libltdl-dev \
            libmpc-dev \
            libmpfr-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libpython3-dev \
            libreadline-dev \
            libssl-dev \
            libtool \
            llvm \
            lrzsz \
            msmtp \
            ninja-build \
            p7zip \
            p7zip-full \
            patch \
            pkgconf \
            python3 \
            python3-pyelftools \
            python3-setuptools \
            qemu-utils \
            rsync \
            scons \
            squashfs-tools \
            subversion \
            swig \
            texinfo \
            uglifyjs \
            upx-ucl \
            unzip \
            vim \
            wget \
            xmlto \
            xxd \
            zlib1g-dev

          # Ubuntu 24.04 ships a newer default GCC than the old DoorNet2/LEDE
          # buildroot was originally tested with.  Prefer GCC 12 when the
          # package is available, while keeping Ubuntu 22.04 compatible.
          if apt-cache show gcc-12 >/dev/null 2>&1 && \
             apt-cache show g++-12 >/dev/null 2>&1; then
              sudo apt-get install -y --no-install-recommends gcc-12 g++-12
              sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-12 120
              sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-12 120
          fi

          echo "===== HOST TOOLCHAIN ====="
          gcc --version | head -1
          g++ --version | head -1
          python3 --version

          sudo apt-get clean
          sudo timedatectl set-timezone "Asia/Shanghai" || true

          df -h


      # ============================================================
      # 2. Checkout
      # ============================================================

      - name: Checkout workflow repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify canonical DoorNet2 repository
        run: |
          set -e

          EXPECTED_REPO="bwgone/DoorNet2-iStoreOS"

          echo "Current repository:  ${GITHUB_REPOSITORY}"
          echo "Expected repository: ${EXPECTED_REPO}"

          if [ "${GITHUB_REPOSITORY}" != "${EXPECTED_REPO}" ]; then
              echo "ERROR: This Final workflow must run in ${EXPECTED_REPO}."
              echo "Running it in another fork would bake the wrong OPKG/release URLs into the firmware."
              exit 1
          fi

          echo "OK: canonical DoorNet2 repository verified."

      - name: Checkout proven R4 source baseline
        shell: bash
        run: |
          set -euo pipefail

          # This is the exact source commit reported by the user's known-good
          # DoorNet2 R4 firmware (R24.12.12-D / kernel 6.6.66).  The workflow
          # itself lives in bwgone/DoorNet2-iStoreOS, but firmware compilation
          # must use this proven source tree instead of the moving main branch.
          STABLE_SOURCE_COMMIT="9d1be44f0c1eaf3100ba122a966ff86b66354792"
          STABLE_SOURCE_REPO="Taipeione/DoorNet2-iStoreOS"

          echo "Workflow repository : ${GITHUB_REPOSITORY}@${GITHUB_SHA}"
          echo "Firmware source     : ${STABLE_SOURCE_REPO}@${STABLE_SOURCE_COMMIT}"

          if ! git cat-file -e "${STABLE_SOURCE_COMMIT}^{commit}" 2>/dev/null; then
              git remote remove doornet2-stable >/dev/null 2>&1 || true
              git remote add doornet2-stable \
                "https://github.com/${STABLE_SOURCE_REPO}.git"
              git fetch --no-tags --depth 1 doornet2-stable "${STABLE_SOURCE_COMMIT}"
          fi

          git checkout --detach "${STABLE_SOURCE_COMMIT}"

          ACTUAL_SOURCE_COMMIT="$(git rev-parse HEAD)"
          test "${ACTUAL_SOURCE_COMMIT}" = "${STABLE_SOURCE_COMMIT}"

          echo "DOORNET2_SOURCE_BASELINE=${STABLE_SOURCE_COMMIT}" >> "$GITHUB_ENV"
          echo "DOORNET2_SOURCE_REPO=${STABLE_SOURCE_REPO}" >> "$GITHUB_ENV"

          echo "===== PROVEN SOURCE BASELINE ====="
          git log -1 --oneline
          test -f target/linux/rockchip/image/armv8.mk
          grep -q 'define Device/embedfire_doornet2' target/linux/rockchip/image/armv8.mk


      # ============================================================
      # 3. Version
      # ============================================================

      - name: Fix executable permissions
        run: |
          set -e
          chmod -R +x scripts || true
          find . -type f             \( -name "*.sh" -o -name "*.pl" -o -name "config.guess" -o -name "command_all.sh" \)             -exec chmod +x {} \; || true
          chmod +x ./scripts/feeds

      - name: Generate build version
        run: |
          set -e

          BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          BUILD_DAY="$(date -u +'%Y.%m.%d')"
          SHORT_SHA="${GITHUB_SHA:0:7}"

          VERSION="${BUILD_DAY}-r${GITHUB_RUN_NUMBER}-${SHORT_SHA}"
          TAG="doornet2-${VERSION}"

          echo "DOORNET2_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "DOORNET2_TAG=${TAG}" >> "$GITHUB_ENV"
          echo "DOORNET2_BUILD_DATE=${BUILD_DATE}" >> "$GITHUB_ENV"

          echo "========================================"
          echo "VERSION=${VERSION}"
          echo "TAG=${TAG}"
          echo "========================================"


      # ============================================================
      # 4. iStore + DoorNet2 iStoreOS-style visual UI
      # ============================================================

      - name: Add iStore feed
        run: |
          set -e

          grep -q '^src-git istore ' feeds.conf.default || \
            echo 'src-git istore https://github.com/linkease/istore;main' \
            >> feeds.conf.default

          cat feeds.conf.default


      - name: Add PassWall and PassWall2 feeds
        run: |
          set -e

          echo "===== ADD OFFICIAL PASSWALL / PASSWALL2 FEEDS ====="

          sed -i             -e '/^src-git passwall_packages /d'             -e '/^src-git passwall_luci /d'             -e '/^src-git passwall2_luci /d'             feeds.conf.default

          {
            echo 'src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main'
            echo 'src-git passwall_luci https://github.com/Openwrt-Passwall/openwrt-passwall.git;main'
            echo 'src-git passwall2_luci https://github.com/Openwrt-Passwall/openwrt-passwall2.git;main'
            cat feeds.conf.default
          } > feeds.conf.default.new

          mv feeds.conf.default.new feeds.conf.default

          echo "===== PASSWALL FEEDS ====="
          head -n 10 feeds.conf.default

      - name: Update base feeds
        run: |
          set -e

          chmod +x ./scripts/feeds
          ./scripts/feeds update -a
          ./scripts/feeds install -a -f

          ./scripts/feeds install             -d y             -p istore             luci-app-store

          echo "===== VERIFY PASSWALL FEEDS ====="
          test -f feeds/passwall_luci/luci-app-passwall/Makefile
          test -f feeds/passwall2_luci/luci-app-passwall2/Makefile
          test -d feeds/passwall_packages

          ./scripts/feeds install             -d y             -p passwall_luci             luci-app-passwall

          ./scripts/feeds install             -d y             -p passwall2_luci             luci-app-passwall2

          grep -nE             'PKG_NAME:=luci-app-passwall|PKG_VERSION|LUCI_DEPENDS'             feeds/passwall_luci/luci-app-passwall/Makefile             | head -20

          grep -nE             'PKG_NAME:=luci-app-passwall2|PKG_VERSION|LUCI_DEPENDS|Basic_Core'             feeds/passwall2_luci/luci-app-passwall2/Makefile             | head -30

      - name: Fix Rust 1.80 LLVM bootstrap
        run: |
          set -e

          RUST_MK="feeds/packages/lang/rust/Makefile"
          test -f "$RUST_MK"

          sed -i             's/--set=llvm\.download-ci-llvm=true/--set=llvm.download-ci-llvm=false/g'             "$RUST_MK"

          if ! grep -q -- '--set=llvm.download-ci-llvm=false' "$RUST_MK"; then
              echo "ERROR: Rust Makefile was not patched to disable CI LLVM downloads."
              grep -n 'download-ci-llvm' "$RUST_MK" || true
              exit 1
          fi

          echo "Rust LLVM bootstrap setting:"
          grep -n 'download-ci-llvm' "$RUST_MK"

      - name: Patch PassWall2 geoview hard dependency
        run: |
          set -e

          PW2_MK="feeds/passwall2_luci/luci-app-passwall2/Makefile"
          test -f "$PW2_MK"

          echo "===== BEFORE PATCH ====="
          grep -n 'geoview' "$PW2_MK" || true

          # PassWall2 currently hard-depends on geoview.  DoorNet2's legacy
          # Go toolchain cannot build the current geoview release, while the
          # PassWall2 core itself can run without the optional Geo View page.
          sed -i -E             's/(^|[[:space:]])\+geoview([[:space:]]|$)/\1\2/g'             "$PW2_MK"

          if grep -Eq '(^|[[:space:]])\+geoview([[:space:]]|$)' "$PW2_MK"; then
              echo "ERROR: PassWall2 still has a hard +geoview dependency."
              grep -n 'geoview' "$PW2_MK" || true
              exit 1
          fi

          echo "===== AFTER PATCH ====="
          grep -n 'geoview' "$PW2_MK" || true

      - name: Patch PassWall legacy iptables dependencies
        shell: bash
        run: |
          set -euo pipefail

          # The proven R4 DoorNet2 tree is firewall3 + legacy iptables.  It does
          # not provide the newer compatibility package names
          # iptables-zz-legacy / iptables-nft used by current PassWall feeds.
          # The actual legacy iptables binaries are supplied by CONFIG_PACKAGE_iptables.
          for mk in \
            feeds/passwall_luci/luci-app-passwall/Makefile \
            feeds/passwall2_luci/luci-app-passwall2/Makefile; do
              test -f "$mk"
              sed -i \
                -e '/^[[:space:]]*select PACKAGE_iptables-zz-legacy[[:space:]]*$/d' \
                -e '/^[[:space:]]*select PACKAGE_iptables-nft[[:space:]]*$/d' \
                "$mk"
          done

          if grep -RniE '^[[:space:]]*select PACKAGE_(iptables-zz-legacy|iptables-nft)[[:space:]]*$' \
              feeds/passwall_luci/luci-app-passwall/Makefile \
              feeds/passwall2_luci/luci-app-passwall2/Makefile; then
              echo "ERROR: incompatible iptables compatibility package selector remains."
              exit 1
          fi

          echo "OK: PassWall and PassWall2 are adapted to the proven firewall3/legacy-iptables base."

      - name: Pin PassWall Go cores for DoorNet2 Go 1.23
        run: |
          set -e

          echo "===== DOORNET2 GO 1.23 PASSWALL COMPATIBILITY ====="

          # This legacy/stable LEDE tree provides Go 1.23.1.
          # Current PassWall packages track newer Go applications:
          #   sing-box 1.14.0      -> Go >= 1.25.5
          #   v2ray-plugin 5.49.0 -> Go >= 1.25.5
          #   current Xray        -> newer Go toolchain
          #
          # R32 therefore keeps Xray as the built-in PassWall core, pins it to
          # Xray 25.1.30 (go.mod: go 1.23), and disables Sing-box/v2ray-plugin
          # in the firmware configuration below. Do not replace the whole Go
          # toolchain: TF-first/eMMC fallback and the R23 stable buildroot stay
          # untouched.

          XRAY_MK="feeds/passwall_packages/xray-core/Makefile"
          test -f "$XRAY_MK"

          sed -i \
            's/^PKG_VERSION:=.*/PKG_VERSION:=25.1.30/' \
            "$XRAY_MK"

          sed -i \
            's/^PKG_HASH:=.*/PKG_HASH:=983ee395f085ed1b7fbe0152cb56a5b605a6f70a5645d427c7186c476f14894e/' \
            "$XRAY_MK"

          # PassWall's current Xray Makefile injects core.version, which exists
          # in newer Xray but not in v25.1.30. Keep only core.build for the
          # pinned release.
          export XRAY_MK
          python3 <<'PY_XRAY'
          import os
          from pathlib import Path

          p = Path(os.environ["XRAY_MK"])
          lines = p.read_text().splitlines()
          out = []

          found_build = False
          found_version = False

          for line in lines:
              if "$(GO_PKG)/core.build=OpenWrt" in line:
                  out.append("\t$(GO_PKG)/core.build=OpenWrt")
                  found_build = True
                  continue

              if "$(GO_PKG)/core.version=$(PKG_VERSION)" in line:
                  found_version = True
                  continue

              out.append(line)

          if not found_build:
              raise SystemExit("ERROR: xray core.build ldflag line not found")

          if not found_version:
              raise SystemExit("ERROR: xray core.version ldflag line not found")

          p.write_text("\n".join(out) + "\n")
          PY_XRAY

          grep -q '^PKG_VERSION:=25\.1\.30$' "$XRAY_MK"
          grep -q '^PKG_HASH:=983ee395f085ed1b7fbe0152cb56a5b605a6f70a5645d427c7186c476f14894e$' "$XRAY_MK"
          grep -q '\$(GO_PKG)/core.build=OpenWrt' "$XRAY_MK"

          if grep -q 'core.version=\$(PKG_VERSION)' "$XRAY_MK"; then
              echo "ERROR: incompatible Xray core.version ldflag still present"
              exit 1
          fi

          echo "Pinned Xray:"
          grep -nE '^PKG_(VERSION|HASH):=|GO_PKG_LDFLAGS_X|core\.build|core\.version' "$XRAY_MK"


      - name: Add SmartDNS and AdGuard Home packages and remove UU
        run: |
          set -e

          echo "===== SMARTDNS / ADGUARD FROM NORMAL FEEDS ====="

          ./scripts/feeds install             -d y             -f             -p packages             smartdns             adguardhome

          ./scripts/feeds install             -d y             -f             -p luci             luci-app-smartdns

          echo "===== REMOVE UU ACCELERATOR FROM ACTIVE PACKAGE TREE ====="

          rm -rf             package/feeds/packages/uugamebooster             package/feeds/luci/luci-app-uugamebooster             package/feeds/istore_packages/uugamebooster             package/feeds/istore_packages/luci-app-uugamebooster             package/lean/uugamebooster             package/lean/luci-app-uugamebooster             package/doornet2/luci-app-uugamebooster             package/doornet2/uuplugin             package/doornet2/luci-app-uuplugin

          echo "===== VERIFY NETWORK APP SOURCES ====="
          test -n "$(find feeds/packages -type f -name Makefile -path '*/smartdns/Makefile' -print -quit)"
          test -n "$(find feeds/luci -type f -name Makefile -path '*/luci-app-smartdns/Makefile' -print -quit)"
          test -n "$(find feeds/packages -type f -name Makefile -path '*/adguardhome/Makefile' -print -quit)"

          if find package -maxdepth 6               \( -iname '*uugamebooster*' -o -iname '*uuplugin*' \)               -print 2>/dev/null | grep -q .; then
              echo "ERROR: UU accelerator package source is still active."
              find package -maxdepth 6                 \( -iname '*uugamebooster*' -o -iname '*uuplugin*' \)                 -print 2>/dev/null || true
              exit 1
          fi

      - name: Add QuickStart and DoorNet2 UI themes
        run: |
          set -e

          echo "===== ADD QUICKSTART FEEDS ====="

          grep -q '^src-git nas ' feeds.conf.default || \
            echo 'src-git nas https://github.com/linkease/nas-packages.git;master' \
            >> feeds.conf.default

          grep -q '^src-git nas_luci ' feeds.conf.default || \
            echo 'src-git nas_luci https://github.com/linkease/nas-packages-luci.git;main' \
            >> feeds.conf.default

          ./scripts/feeds update nas nas_luci

          ./scripts/feeds install \
            -d y \
            -p nas \
            quickstart

          ./scripts/feeds install \
            -d y \
            -p nas_luci \
            luci-app-quickstart

          echo "===== ADD DESIGN THEME (DEFAULT) ====="

          mkdir -p package/lean

          rm -rf \
            package/lean/luci-theme-design \
            package/lean/luci-theme-argon \
            package/lean/luci-app-argon-config

          # Design main is the Lua/LEDE branch and matches this DoorNet2 tree.
          git clone \
            --depth 1 \
            --branch main \
            https://github.com/0x676e67/luci-theme-design.git \
            package/lean/luci-theme-design

          # Keep Argon as a recovery/fallback theme only.
          git clone \
            --depth 1 \
            https://github.com/jerrykuku/luci-theme-argon.git \
            package/lean/luci-theme-argon

          git clone \
            --depth 1 \
            https://github.com/jerrykuku/luci-app-argon-config.git \
            package/lean/luci-app-argon-config

          echo "===== VERIFY QUICKSTART / DESIGN / RECOVERY THEMES ====="

          test -f feeds/nas/network/services/quickstart/Makefile
          test -f feeds/nas_luci/luci/luci-app-quickstart/Makefile

          test -f package/lean/luci-theme-design/Makefile
          test -f package/lean/luci-theme-design/luasrc/view/themes/design/header.htm
          test -f package/lean/luci-theme-design/htdocs/luci-static/design/css/style.css

          test -f package/lean/luci-theme-argon/Makefile
          test -f package/lean/luci-app-argon-config/Makefile

          grep -nE \
            'PKG_NAME:=quickstart|PKG_VERSION|DEPENDS' \
            feeds/nas/network/services/quickstart/Makefile \
            | head -20

          grep -nE \
            'LUCI_TITLE|LUCI_DEPENDS|PKG_VERSION' \
            feeds/nas_luci/luci/luci-app-quickstart/Makefile

          echo "===== PATCH DESIGN HOME SHORTCUT TO QUICKSTART ====="

          DESIGN_HEADER="package/lean/luci-theme-design/luasrc/view/themes/design/header.htm"

          sed -i \
            's#/cgi-bin/luci/admin/status/overview#/cgi-bin/luci/admin/quickstart/#g' \
            "$DESIGN_HEADER"

          grep -n '/cgi-bin/luci/admin/quickstart/' "$DESIGN_HEADER"


      - name: Configure DoorNet2 UI defaults
        run: |
          set -e

          mkdir -p \
            files/etc/uci-defaults \
            files/etc/config

          cat > files/etc/uci-defaults/95-doornet2-ui <<'EOF'
          #!/bin/sh

          # DoorNet2 R34 UI policy:
          # Design default + QuickStart home, with Argon/Bootstrap recovery.

          uci -q set luci.themes.Design='/luci-static/design'
          uci -q set luci.themes.Argon='/luci-static/argon'
          uci -q set luci.main.mediaurlbase='/luci-static/design'
          uci -q set luci.main.lang='zh_cn'
          uci -q commit luci

          if [ "$(uci -q get system.@system[0].hostname)" = "OpenWrt" ]; then
              uci -q set system.@system[0].hostname='DoorNet2'
              uci -q commit system
          fi

          rm -rf \
            /tmp/luci-indexcache \
            /tmp/luci-modulecache \
            /tmp/luci-templatecache

          exit 0
          EOF

          chmod 755 files/etc/uci-defaults/95-doornet2-ui
          sh -n files/etc/uci-defaults/95-doornet2-ui

          cat > files/etc/config/design <<'EOF'
          config global
                  option mode 'dark'
                  option navbar 'display'
                  option navbar_proxy 'passwall'
          EOF

          echo "===== FINAL UI DEFAULTS ====="
          cat files/etc/uci-defaults/95-doornet2-ui
          cat files/etc/config/design


      - name: Configure clean user-managed network defaults
        run: |
          set -e

          echo "===== REMOVE OLD BAKED-IN NETWORK APP CONFIGURATION ====="

          # The repository may contain settings from an older DoorNet2 image.
          # Do not bake those settings into a new clean image.  Let each package
          # install its own stock configuration, then apply only a one-time
          # disabled-by-default policy below.
          rm -f \
            files/etc/config/passwall \
            files/etc/config/passwall2 \
            files/etc/config/passwall_server \
            files/etc/config/passwall2_server \
            files/etc/config/smartdns \
            files/etc/config/adguardhome \
            files/etc/config/dhcp \
            files/etc/adguardhome.yaml

          rm -rf \
            files/etc/passwall \
            files/etc/passwall2 \
            files/etc/smartdns

          # The historical DoorNet2 source tree may already contain a modified
          # dnsmasq template that forces 127.0.0.1:3053 + noresolv=1.  The Final
          # user-managed image must not ship that chain because AdGuard/SmartDNS
          # are intentionally OFF on a clean install.  Scrub only files which
          # actually contain that exact old loopback target.
          echo "===== SCRUB LEGACY FORCED DNSMASQ CHAIN ====="
          while IFS= read -r dns_file; do
              [ -f "$dns_file" ] || continue
              echo "Sanitizing: $dns_file"
              sed -i \
                -e '/127\.0\.0\.1#3053/d' \
                -e "/option[[:space:]]\+noresolv[[:space:]]\+['\"]\?1['\"]\?/d" \
                "$dns_file"
          done < <(
              grep -RIl --exclude-dir=.git '127.0.0.1#3053' \
                package feeds target config 2>/dev/null || true
          )

          # Remove old DoorNet2 automation which could silently rewrite a user's
          # DNS/proxy choices on later boots.
          rm -f \
            files/etc/init.d/doornet2-dns-chain \
            files/etc/init.d/passwall-delay \
            files/etc/init.d/passwall2-delay \
            files/etc/uci-defaults/96-doornet2-passwall-shunt \
            files/etc/uci-defaults/zzza-doornet2-shunt-presets \
            files/etc/uci-defaults/zzzb-doornet2-network-apps

          mkdir -p \
            files/etc/uci-defaults \
            files/lib/upgrade/keep.d

          cat > files/etc/uci-defaults/zzzb-doornet2-network-apps <<'EOF'
          #!/bin/sh

          # This script is intentionally a FIRST-BOOT-ONLY default initializer.
          # OpenWrt removes successful /etc/uci-defaults scripts after they run.
          # It must never overwrite the user's settings on ordinary reboots.
          #
          # A persistent marker is preserved by sysupgrade.  Therefore a retained
          # online upgrade will NOT re-apply the clean-install OFF defaults.
          MARKER="/etc/doornet2-user-network-initialized"
          UPGRADE_STATE="/etc/doornet2-upgrade-service-state"

          if [ -e "$MARKER" ]; then
              # Online upgrade records AdGuard Home's enable/disable state because
              # its package primarily uses /etc/rc.d symlinks rather than a UCI
              # enabled flag.  Restore that state after the new image boots.
              if [ -f "$UPGRADE_STATE" ] && [ -x /etc/init.d/adguardhome ]; then
                  if grep -qx 'adguardhome_enabled=1' "$UPGRADE_STATE"; then
                      /etc/init.d/adguardhome enable >/dev/null 2>&1 || true
                  else
                      /etc/init.d/adguardhome disable >/dev/null 2>&1 || true
                      /etc/init.d/adguardhome stop >/dev/null 2>&1 || true
                  fi
                  rm -f "$UPGRADE_STATE"
              fi
              exit 0
          fi

          # PassWall / PassWall2: keep the normal init hooks installed so that
          # once the user enables the plugin in LuCI, it can still auto-start on
          # future reboots.  Only the package's UCI switch is set off initially.
          if uci -q get passwall.@global[0] >/dev/null 2>&1; then
              uci -q set passwall.@global[0].enabled='0'
              uci -q set passwall.@global[0].socks_enabled='0'
              uci -q commit passwall
          fi

          if uci -q get passwall2.@global[0] >/dev/null 2>&1; then
              uci -q set passwall2.@global[0].enabled='0'
              uci -q set passwall2.@global[0].socks_enabled='0'
              uci -q commit passwall2
          fi

          # SmartDNS: installed but off by default.  Its init hook remains in
          # place so enabling it later in LuCI persists across reboots.
          if uci -q get smartdns.@smartdns[0] >/dev/null 2>&1; then
              uci -q set smartdns.@smartdns[0].enabled='0'
              uci -q commit smartdns
          fi

          # Stop the optional services on the clean first boot.
          for svc in passwall passwall2 smartdns; do
              if [ -x "/etc/init.d/$svc" ]; then
                  "/etc/init.d/$svc" stop >/dev/null 2>&1 || true
              fi
          done

          # AdGuard Home has no equivalent stock UCI enable flag in this package.
          # Keep it installed but remove its boot symlink on the clean first boot.
          # After the user finishes configuring AdGuard Home, enabling its service
          # once (LuCI/iStore or /etc/init.d/adguardhome enable) makes that choice
          # persist normally across later reboots.
          if [ -x /etc/init.d/adguardhome ]; then
              /etc/init.d/adguardhome stop >/dev/null 2>&1 || true
              /etc/init.d/adguardhome disable >/dev/null 2>&1 || true
          fi

          # dnsmasq-full is deliberately NOT disabled.  It is the router's base
          # DHCP/DNS service.  A clean image uses its normal WAN resolv.conf
          # upstreams.  As a first-boot safety net, explicitly remove any stale
          # forced localhost DNS chain inherited from an old source template.
          if uci -q get dhcp.@dnsmasq[0] >/dev/null 2>&1; then
              uci -q delete dhcp.@dnsmasq[0].noresolv
              uci -q delete dhcp.@dnsmasq[0].server
              uci -q set dhcp.@dnsmasq[0].resolvfile='/tmp/resolv.conf.d/resolv.conf.auto'
              uci -q commit dhcp
          fi

          # Mark the clean-install initialization as completed.  This marker is
          # explicitly retained during later sysupgrades so user settings are not
          # reset to OFF after an online firmware update.
          touch "$MARKER"

          exit 0
          EOF

          chmod 755 files/etc/uci-defaults/zzzb-doornet2-network-apps
          sh -n files/etc/uci-defaults/zzzb-doornet2-network-apps

          cat > files/lib/upgrade/keep.d/doornet2-user-network-config <<'EOF'
          # DoorNet2 user-managed network application settings.
          # /etc/config is preserved by normal sysupgrade already; these explicit
          # entries also cover non-UCI files used by the applications.
          /etc/config/dhcp
          /etc/config/passwall
          /etc/config/passwall2
          /etc/config/passwall_server
          /etc/config/passwall2_server
          /etc/config/smartdns
          /etc/config/adguardhome
          /etc/passwall/
          /etc/passwall2/
          /etc/smartdns/
          /etc/adguardhome.yaml
          /etc/doornet2-user-network-initialized
          /etc/doornet2-upgrade-service-state
          EOF

          echo "===== CLEAN DEFAULT POLICY ====="
          echo "PassWall:    installed, default OFF"
          echo "PassWall2:   installed, default OFF"
          echo "SmartDNS:    installed, default OFF"
          echo "AdGuardHome: installed, default OFF"
          echo "dnsmasq-full: installed, normal base service ON, no forced DNS chain"
          echo "User settings are not rewritten on normal reboots."

      - name: Seed PassWall and PassWall2 shunt presets
        run: |
          set -e

          mkdir -p \
            files/etc/uci-defaults \
            files/lib/upgrade/keep.d

          cat > files/etc/uci-defaults/zzza-doornet2-shunt-presets <<'EOF'
          #!/bin/sh

          # DoorNet2 preset rules are seeded once.  The marker is preserved by
          # sysupgrade so later firmware upgrades do not overwrite user-selected
          # nodes, edited rules, or the user's PassWall/PassWall2 configuration.
          PRESET_MARKER="/etc/doornet2-shunt-presets-v1"
          NETWORK_MARKER="/etc/doornet2-user-network-initialized"

          [ -e "$PRESET_MARKER" ] && exit 0

          RETAINED=0
          [ -e "$NETWORK_MARKER" ] && RETAINED=1

          add_rule()
          {
              cfg="$1"
              id="$2"
              remarks="$3"
              domains="$4"
              ips="$5"

              # During a retained upgrade, never overwrite an existing rule
              # with the same ID.  On a clean install, create the known preset
              # deterministically from scratch.
              if [ "$RETAINED" = "1" ] && uci -q get "$cfg.$id" >/dev/null 2>&1; then
                  return 0
              fi

              uci -q delete "$cfg.$id"
              uci -q set "$cfg.$id=shunt_rules"
              uci -q set "$cfg.$id.remarks=$remarks"
              uci -q set "$cfg.$id.network=tcp,udp"

              if [ -n "$domains" ]; then
                  domain_list="$(
                      printf '%s' "$domains" \
                        | tr ',' '\n' \
                        | sed '/^$/d;s/^/domain:/'
                  )"
                  uci -q set "$cfg.$id.domain_list=$domain_list"
              fi

              if [ -n "$ips" ]; then
                  ip_list="$(
                      printf '%s' "$ips" \
                        | tr ',' '\n' \
                        | sed '/^$/d'
                  )"
                  uci -q set "$cfg.$id.ip_list=$ip_list"
              fi
          }

          seed_config()
          {
              cfg="$1"
              [ -f "/etc/config/$cfg" ] || return 0

              # On a clean PassWall install, remove only its untouched stock
              # myshunt entry so LuCI does not show two nodes named 分流总节点.
              # Retained upgrades never delete an existing user section.
              if [ "$cfg" = "passwall" ] && [ "$RETAINED" = "0" ]; then
                  if [ "$(uci -q get passwall.myshunt.remarks)" = "分流总节点" ] && \
                     [ "$(uci -q get passwall.myshunt.protocol)" = "_shunt" ]; then
                      uci -q delete passwall.myshunt
                  fi
              fi

              # PassWall2 ships an example SOCKS node plus an example shunt node.
              # Remove only those untouched stock examples on a clean install so
              # LuCI exposes one clean user-facing node named “分流总节点”.
              if [ "$cfg" = "passwall2" ] && [ "$RETAINED" = "0" ]; then
                  if [ "$(uci -q get passwall2.rulenode.remarks)" = "rulenode" ] && \
                     [ "$(uci -q get passwall2.rulenode.protocol)" = "_shunt" ]; then
                      uci -q delete passwall2.rulenode
                  fi
                  if [ "$(uci -q get passwall2.examplenode.remarks)" = "Example" ] && \
                     [ "$(uci -q get passwall2.examplenode.address)" = "passwall2.github" ]; then
                      uci -q delete passwall2.examplenode
                  fi
              fi

              # Priority / safety rules.
              add_rule "$cfg" DN_ForcedDirect "DoorNet2 强制直连" \
                "api.example.com,speedtest.net" ""

              add_rule "$cfg" DN_TencentDirect "微信 / QQ / 腾讯媒体强制直连" \
                "wechat.com,weixin.qq.com,wx.qq.com,wechatapp.com,qpic.cn,qq.com,qzone.qq.com,gtimg.com,idqqimg.com,qlogo.cn,weixinbridge.com" ""

              add_rule "$cfg" DN_ChatGPT_Login "ChatGPT 登录完整链路" \
                "auth.openai.com,chatgpt.com,ct.sendgrid.net,intercom.io,intercomcdn.com,oaistatic.com,oaiusercontent.com,openai.com,oaistatsig.com,auth0.openai.com,cdn.openaimerge.com,cdn.workos.com,challenges.cloudflare.com,forwarder.workos.com,humb.apple.com,images.workoscdn.com,js.intercomcdn.com,js.stripe.com,o207216.ingest.sentry.io,o33249.ingest.sentry.io,rum.browser-intake-datadoghq.com,setup.auth.openai.com,setup.workos.com,workos.imgix.net" ""

              # Mainland communication.
              add_rule "$cfg" DN_WeChat "WeChat / 微信" \
                "wechat.com,weixin.qq.com,wx.qq.com,wechatapp.com,qpic.cn,weixinbridge.com" ""
              add_rule "$cfg" DN_QQ "QQ / 腾讯" \
                "qq.com,qzone.qq.com,gtimg.com,idqqimg.com,qlogo.cn" ""

              # Overseas communication.
              add_rule "$cfg" DN_LINE "LINE" \
                "line.me,line-apps.com,line-scdn.net,lin.ee,line.naver.jp" ""
              add_rule "$cfg" DN_WhatsApp "WhatsApp" \
                "whatsapp.com,whatsapp.net" ""
              add_rule "$cfg" DN_Signal "Signal" \
                "signal.org,signal.art,whispersystems.org" ""
              add_rule "$cfg" DN_Telegram "Telegram" \
                "telegram.org,t.me,telegram.me,telegra.ph" \
                "149.154.160.0/20,91.108.4.0/22,91.108.8.0/22,91.108.56.0/22"
              add_rule "$cfg" DN_Discord "Discord" \
                "discord.com,discord.gg,discordapp.com,discordapp.net,discordcdn.com" ""

              # Social.
              add_rule "$cfg" DN_Facebook "Facebook / Messenger" \
                "facebook.com,fbcdn.net,fb.me,fbsbx.com,messenger.com" ""
              add_rule "$cfg" DN_Instagram "Instagram" \
                "instagram.com,cdninstagram.com" ""
              add_rule "$cfg" DN_XTwitter "X / Twitter" \
                "x.com,twitter.com,twimg.com,t.co" ""
              add_rule "$cfg" DN_Reddit "Reddit" \
                "reddit.com,redditmedia.com,redditstatic.com,redd.it" ""

              # Google.
              add_rule "$cfg" DN_YouTube "YouTube" \
                "youtube.com,youtu.be,ytimg.com,googlevideo.com,youtube-nocookie.com" ""
              add_rule "$cfg" DN_GoogleAI "Google AI / Gemini" \
                "gemini.google.com,ai.google.dev,generativelanguage.googleapis.com,aistudio.google.com,deepmind.google" ""
              add_rule "$cfg" DN_GmailDrive "Gmail / Google Drive" \
                "gmail.com,mail.google.com,drive.google.com,docs.google.com" ""
              add_rule "$cfg" DN_Google "Google" \
                "google.com,gstatic.com,googleapis.com,googleusercontent.com,ggpht.com" ""

              # AI.
              add_rule "$cfg" DN_OpenAI "OpenAI / ChatGPT" \
                "openai.com,chatgpt.com,auth.openai.com,oaistatic.com,oaiusercontent.com,oaistatsig.com" ""
              add_rule "$cfg" DN_Claude "Claude / Anthropic" \
                "claude.ai,anthropic.com" ""
              add_rule "$cfg" DN_Perplexity "Perplexity" "perplexity.ai" ""
              add_rule "$cfg" DN_Copilot "Microsoft Copilot" \
                "copilot.microsoft.com,copilot.cloud.microsoft" ""
              add_rule "$cfg" DN_Grok "Grok / xAI" "grok.com,x.ai" ""

              # Streaming.
              add_rule "$cfg" DN_Netflix "Netflix" \
                "netflix.com,nflxvideo.net,nflximg.net,nflxext.com,nflxso.net" ""
              add_rule "$cfg" DN_DisneyPlus "Disney+" \
                "disneyplus.com,dssott.com,bamgrid.com,disney-plus.net" ""
              add_rule "$cfg" DN_MaxHBO "Max / HBO" \
                "max.com,hbomax.com,hbo.com,hbogo.com" ""
              add_rule "$cfg" DN_PrimeVideo "Amazon Prime Video" \
                "primevideo.com,amazonvideo.com,aiv-cdn.net" ""
              add_rule "$cfg" DN_Spotify "Spotify" \
                "spotify.com,scdn.co,spotifycdn.com" ""
              add_rule "$cfg" DN_TikTok "TikTok" \
                "tiktok.com,tiktokcdn.com,tiktokv.com,byteoversea.com,ibytedtos.com,muscdn.com" ""

              # Platform / cloud / work.
              add_rule "$cfg" DN_Apple "Apple / iCloud / App Store" \
                "apple.com,icloud.com,apple-cloudkit.com,mzstatic.com" ""
              add_rule "$cfg" DN_Microsoft "Microsoft / Office / OneDrive" \
                "microsoft.com,live.com,office.com,office365.com,onedrive.com" ""
              add_rule "$cfg" DN_GitHub "GitHub" \
                "github.com,githubusercontent.com,githubassets.com,github.io" ""
              add_rule "$cfg" DN_Slack "Slack" "slack.com,slack-edge.com" ""
              add_rule "$cfg" DN_Zoom "Zoom" "zoom.us,zoom.com" ""
              add_rule "$cfg" DN_Notion "Notion" \
                "notion.so,notion.site,notionusercontent.com" ""
              add_rule "$cfg" DN_Dropbox "Dropbox" \
                "dropbox.com,dropboxapi.com,dropboxusercontent.com" ""

              # Games / local media / umbrella rows.
              add_rule "$cfg" DN_PlayStation "PlayStation" \
                "playstation.com,playstation.net,sonyentertainmentnetwork.com" ""
              add_rule "$cfg" DN_Nintendo "Nintendo" \
                "nintendo.com,nintendo.net,nintendo.co.jp" ""
              add_rule "$cfg" DN_Xbox "Xbox" \
                "xbox.com,xboxlive.com,xboxservices.com" ""
              add_rule "$cfg" DN_LocalMedia "Emby / Jellyfin / Plex" \
                "emby.media,jellyfin.org,plex.tv" ""
              add_rule "$cfg" DN_AIGC "AIGC（汇总备用）" "" ""
              add_rule "$cfg" DN_Streaming "Streaming（汇总备用）" "" ""
              add_rule "$cfg" DN_ProxyGame "ProxyGame（汇总备用）" "" ""
              add_rule "$cfg" DN_DirectGame "DirectGame" "" ""

              # Migrate the old DoorNet2 R4Shunt node in place when present so
              # retained node selections survive.  New installs use DN_Shunt and
              # expose only the user-facing name “分流总节点”.
              if uci -q get "$cfg.DN_Shunt" >/dev/null 2>&1; then
                  SHUNT_ID="DN_Shunt"
              elif uci -q get "$cfg.R4Shunt" >/dev/null 2>&1; then
                  SHUNT_ID="R4Shunt"
                  old_remarks="$(uci -q get "$cfg.$SHUNT_ID.remarks")"
                  if [ -z "$old_remarks" ] || [ "$old_remarks" = "R4 分流总节点" ]; then
                      uci -q set "$cfg.$SHUNT_ID.remarks=分流总节点"
                  fi
              else
                  SHUNT_ID="DN_Shunt"
                  uci -q set "$cfg.$SHUNT_ID=nodes"
                  uci -q set "$cfg.$SHUNT_ID.remarks=分流总节点"
                  uci -q set "$cfg.$SHUNT_ID.type=Xray"
                  uci -q set "$cfg.$SHUNT_ID.protocol=_shunt"
                  uci -q set "$cfg.$SHUNT_ID.domainStrategy=IPOnDemand"
                  uci -q set "$cfg.$SHUNT_ID.default_node=_direct"
              fi

              # On a clean install, make the preloaded shunt node the selected
              # main node while keeping the plugin itself disabled.  With its
              # default_node set to direct and ordinary preset rows unbound,
              # enabling the plugin before choosing proxy nodes remains safe.
              if [ "$RETAINED" = "0" ]; then
                  if [ "$cfg" = "passwall" ]; then
                      uci -q set passwall.@global[0].node="$SHUNT_ID"
                  elif [ "$cfg" = "passwall2" ]; then
                      uci -q set passwall2.@global[0].node="$SHUNT_ID"
                      uci -q set "$cfg.$SHUNT_ID.domainMatcher=hybrid"
                      uci -q set "$cfg.$SHUNT_ID.write_ipset_direct=1"
                      uci -q set "$cfg.$SHUNT_ID.enable_geoview_ip=0"
                  fi
              fi

              # Required direct rules are attached by default.  During retained
              # upgrades, preserve any explicit user choice already present.
              for pair in \
                  DN_ForcedDirect:_direct \
                  DN_TencentDirect:_direct \
                  DN_WeChat:_direct \
                  DN_QQ:_direct; do
                  opt="${pair%%:*}"
                  val="${pair#*:}"
                  if [ "$RETAINED" = "0" ] || [ -z "$(uci -q get "$cfg.$SHUNT_ID.$opt")" ]; then
                      uci -q set "$cfg.$SHUNT_ID.$opt=$val"
                  fi
              done

              # Put system safety rules first.  Reordering the rule sections does
              # not alter user-selected node mappings in the shunt node.
              uci -q reorder "$cfg.DN_ForcedDirect=0" >/dev/null 2>&1 || true
              uci -q reorder "$cfg.DN_TencentDirect=1" >/dev/null 2>&1 || true
              uci -q reorder "$cfg.DN_ChatGPT_Login=2" >/dev/null 2>&1 || true

              uci -q commit "$cfg"
          }

          seed_config passwall
          seed_config passwall2

          touch "$PRESET_MARKER"
          exit 0
          EOF

          chmod 755 files/etc/uci-defaults/zzza-doornet2-shunt-presets
          sh -n files/etc/uci-defaults/zzza-doornet2-shunt-presets

          # Preserve the one-time seed marker so online upgrades never replay
          # the preset initializer over a user's later edits/selections.
          if ! grep -qx '/etc/doornet2-shunt-presets-v1' \
              files/lib/upgrade/keep.d/doornet2-user-network-config; then
              echo '/etc/doornet2-shunt-presets-v1' \
                >> files/lib/upgrade/keep.d/doornet2-user-network-config
          fi

          echo "===== SHUNT PRESET POLICY ====="
          echo "PassWall:  preloaded 分流总节点, plugin still default OFF"
          echo "PassWall2: preloaded 分流总节点, plugin still default OFF"
          echo "First-boot order: PassWall package defaults -> shunt presets -> OFF-state initializer"
          echo "Proxy service rules have no baked-in personal node IDs."
          echo "WeChat / QQ / Tencent + forced-direct rules default to direct."
          echo "UU-specific domains are not present."

      - name: Verify DoorNet2 Design UI source
        run: |
          set -e

          echo "===== VERIFY FINAL DESIGN UI SOURCE ====="

          test -f package/lean/luci-theme-design/Makefile
          test -f package/lean/luci-theme-design/luasrc/view/themes/design/header.htm
          test -f package/lean/luci-theme-design/htdocs/luci-static/design/css/style.css

          grep -q \
            '/cgi-bin/luci/admin/quickstart/' \
            package/lean/luci-theme-design/luasrc/view/themes/design/header.htm

          test -f files/etc/config/design
          grep -q "option mode 'dark'" files/etc/config/design
          grep -q "option navbar_proxy 'passwall'" files/etc/config/design

          test -x files/etc/uci-defaults/95-doornet2-ui
          grep -q "mediaurlbase='/luci-static/design'" \
            files/etc/uci-defaults/95-doornet2-ui


      # ============================================================
      # 4A. R33 runtime monitor
      #
      # Adds a lightweight top-right status badge to LuCI:
      #   - RK3399 CPU/SoC temperature
      #   - Current device date/time
      #   - NTP enabled, Asia/Shanghai timezone by default
      #
      # This is userspace-only and does not touch boot/storage logic.
      # ============================================================

      - name: Add DoorNet2 temperature and date time monitor
        run: |
          set -e

          echo "===== ADD DOORNET2 R34 THEME-INDEPENDENT RUNTIME MONITOR ====="

          mkdir -p \
            files/usr/bin \
            files/usr/lib/lua/luci/controller \
            files/www/luci-static/doornet2 \
            files/etc/uci-defaults

          cat > files/usr/bin/doornet2-runtime-status <<'EOF'
          #!/bin/sh

          export PATH=/usr/sbin:/usr/bin:/sbin:/bin

          json_escape()
          {
              printf '%s' "$1" \
                | sed \
                    -e 's/\\/\\\\/g' \
                    -e 's/"/\\"/g' \
                    -e ':a;N;$!ba;s/\n/\\n/g'
          }

          format_temp()
          {
              local raw whole decimal
              raw="$1"

              case "$raw" in
                  ''|*[!0-9-]*)
                      return 1
                      ;;
              esac

              if [ "$raw" -gt 1000 ] 2>/dev/null; then
                  whole=$((raw / 1000))
                  decimal=$(((raw % 1000) / 100))
                  printf '%s.%s' "$whole" "$decimal"
              else
                  printf '%s.0' "$raw"
              fi
          }

          cpu_temp=''
          cpu_type=''
          fallback_temp=''
          fallback_type=''

          for zone in /sys/class/thermal/thermal_zone*; do
              [ -d "$zone" ] || continue
              [ -r "$zone/temp" ] || continue

              raw="$(cat "$zone/temp" 2>/dev/null || true)"
              value="$(format_temp "$raw" 2>/dev/null || true)"
              [ -n "$value" ] || continue

              type="$(cat "$zone/type" 2>/dev/null || echo thermal)"

              if [ -z "$fallback_temp" ]; then
                  fallback_temp="$value"
                  fallback_type="$type"
              fi

              case "$(printf '%s' "$type" | tr '[:upper:]' '[:lower:]')" in
                  *cpu*|*soc*|*package*)
                      if [ -z "$cpu_temp" ]; then
                          cpu_temp="$value"
                          cpu_type="$type"
                      fi
                      ;;
              esac
          done

          if [ -z "$cpu_temp" ]; then
              cpu_temp="$fallback_temp"
              cpu_type="$fallback_type"
          fi

          now="$(date '+%Y-%m-%d %H:%M:%S' 2>/dev/null || true)"
          timezone="$(date '+%Z' 2>/dev/null || true)"

          if [ -z "$cpu_temp" ]; then
              cpu_temp='--'
              cpu_type='unavailable'
          fi

          printf '{'
          printf '"ok":true,'
          printf '"temperature":"%s",' "$(json_escape "$cpu_temp")"
          printf '"thermal_type":"%s",' "$(json_escape "$cpu_type")"
          printf '"datetime":"%s",' "$(json_escape "$now")"
          printf '"timezone":"%s"' "$(json_escape "$timezone")"
          printf '}\n'
          EOF

          chmod 755 files/usr/bin/doornet2-runtime-status
          sh -n files/usr/bin/doornet2-runtime-status

          cat > files/usr/lib/lua/luci/controller/doornet2_runtime.lua <<'EOF'
          module("luci.controller.doornet2_runtime", package.seeall)

          function index()
              local page = entry(
                  {"admin", "status", "doornet2_runtime"},
                  call("action_status")
              )
              page.leaf = true
          end

          function action_status()
              local http = require "luci.http"
              local sys = require "luci.sys"

              http.prepare_content("application/json")
              http.header("Cache-Control", "no-store")
              http.write(sys.exec("/usr/bin/doornet2-runtime-status 2>/dev/null"))
          end
          EOF

          cat > files/www/luci-static/doornet2/runtime-monitor.js <<'EOF'
          (function() {
            'use strict';

            if (window.location.pathname.indexOf('/admin/') < 0)
              return;

            function makeMonitor() {
              var old = document.getElementById('dn-runtime-monitor');
              if (old) return old;

              var box = document.createElement('div');
              box.id = 'dn-runtime-monitor';
              box.setAttribute('title', 'DoorNet2 RK3399 运行状态');
              box.innerHTML =
                '<span class="dn-runtime-dot"></span>' +
                '<span class="dn-runtime-temp">CPU --°C</span>' +
                '<span class="dn-runtime-sep">·</span>' +
                '<span class="dn-runtime-time">---- -- -- --:--:--</span>';

              document.body.appendChild(box);
              return box;
            }

            function setLevel(box, value) {
              box.classList.remove('dn-temp-normal', 'dn-temp-warm', 'dn-temp-hot');
              var n = parseFloat(value);
              if (isNaN(n)) return;
              if (n >= 80) box.classList.add('dn-temp-hot');
              else if (n >= 70) box.classList.add('dn-temp-warm');
              else box.classList.add('dn-temp-normal');
            }

            function update() {
              var box = makeMonitor();

              fetch('/cgi-bin/luci/admin/status/doornet2_runtime', {
                method: 'GET',
                credentials: 'same-origin',
                cache: 'no-store'
              })
              .then(function(r) {
                if (!r.ok) throw new Error('HTTP ' + r.status);
                return r.json();
              })
              .then(function(data) {
                if (!data || !data.ok) throw new Error('invalid status');

                var temp = data.temperature || '--';
                var time = data.datetime || '---- -- -- --:--:--';
                var tz = data.timezone || '';

                box.querySelector('.dn-runtime-temp').textContent = 'CPU ' + temp + '°C';
                box.querySelector('.dn-runtime-time').textContent = time + (tz ? ' ' + tz : '');
                setLevel(box, temp);
                box.classList.remove('dn-runtime-offline');
              })
              .catch(function() {
                box.classList.add('dn-runtime-offline');
              });
            }

            function start() {
              makeMonitor();
              update();
              window.setInterval(update, 5000);
            }

            if (document.readyState === 'loading')
              document.addEventListener('DOMContentLoaded', start);
            else
              start();
          })();
          EOF

          cat > files/www/luci-static/doornet2/runtime-monitor.css <<'EOF'
          #dn-runtime-monitor {
            position: fixed;
            top: 10px;
