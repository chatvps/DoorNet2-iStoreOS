name: DoorNet2 iStoreOS Final Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_openwrt:
    name: Build DoorNet2 RK3399 OpenWrt
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             build-essential clang flex bison gawk gettext             git libncurses-dev libssl-dev             python3 python3-pip rsync unzip wget zstd
          pip3 install pyelftools

      - name: Fix permissions
        run: |
          chmod +x ./scripts/* || true
          find . -type f \( -name "*.sh" -o -name "*.pl" -o -name "*.py" \) -exec chmod +x {} \; || true

      - name: Add feeds
        run: |
          grep -q '^src-git istore ' feeds.conf.default || echo 'src-git istore https://github.com/linkease/istore;main' >> feeds.conf.default
          grep -q '^src-git passwall_packages ' feeds.conf.default || echo 'src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main' >> feeds.conf.default
          grep -q '^src-git passwall_luci ' feeds.conf.default || echo 'src-git passwall_luci https://github.com/Openwrt-Passwall/openwrt-passwall.git;main' >> feeds.conf.default

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a -f

      - name: Remove incompatible packages
        run: |
          ./scripts/feeds uninstall geoview || true
          rm -rf feeds/passwall_packages/geoview || true

          ./scripts/feeds uninstall rust || true
          rm -rf feeds/packages/lang/rust || true

          ./scripts/feeds uninstall shadowsocks-rust || true
          rm -rf feeds/passwall_packages/shadowsocks-rust || true

          ./scripts/feeds uninstall shadowsocksr-libev || true
          rm -rf feeds/passwall_packages/shadowsocksr-libev || true


      - name: Remove unsupported passwall components
        run: |
          ./scripts/feeds uninstall v2ray-plugin || true
          rm -rf feeds/passwall_packages/v2ray-plugin || true

      - name: Final PassWall compatibility cleanup
        run: |
          ./scripts/feeds uninstall geoview || true
          ./scripts/feeds uninstall rust || true
          ./scripts/feeds uninstall shadowsocks-rust || true
          ./scripts/feeds uninstall shadowsocksr-libev || true
          ./scripts/feeds uninstall v2ray-plugin || true

          rm -rf feeds/passwall_packages/geoview || true
          rm -rf feeds/packages/lang/rust || true
          rm -rf feeds/passwall_packages/shadowsocks-rust || true
          rm -rf feeds/passwall_packages/shadowsocksr-libev || true
          rm -rf feeds/passwall_packages/v2ray-plugin || true

      - name: Load DoorNet2 config
        run: |
          if [ -f config/doorNet2.config ]; then
            cp config/doorNet2.config .config
          elif [ -f config/doornet2.config ]; then
            cp config/doornet2.config .config
          else
            echo "DoorNet2 config not found"
            exit 1
          fi
          make defconfig

      - name: Build firmware
        run: |
          make -j$(nproc) || make -j1 V=s

      - name: Collect firmware
        run: |
          mkdir -p release
          find bin/targets -type f \( -name '*.img*' -o -name '*.bin' -o -name '*.gz' \) -exec cp {} release/ \; || true

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: DoorNet2-iStoreOS-firmware
          path: release/
