      # ============================================================
      # 12A. PassWall safe online updater
      #
      # PassWall itself and its userspace cores are published into the same
      # DoorNet2 GitHub OPKG feed as the firmware build. This means they can
      # be updated without flashing the whole firmware, while avoiding
      # third-party kernel-module ABI mismatches.
      # ============================================================

      - name: Add PassWall online updater
        run: |
          set -e

          mkdir -p \
            files/usr/bin \
            files/usr/lib/lua/luci/controller \
            files/usr/lib/lua/luci/view/doornet2

          cat > files/usr/bin/doornet2-passwall-updater <<'EOF'
          #!/bin/sh

          export PATH=/usr/sbin:/usr/bin:/sbin:/bin

          FILTER='^(luci-app-passwall|luci-i18n-passwall-|chinadns-ng|dns2socks|haproxy|hysteria|ipt2socks|microsocks|naiveproxy|shadow-tls|simple-obfs|tcping|v2ray-geoip|v2ray-geosite|xray-core|xray-plugin)$'

          json_escape()
          {
              printf '%s' "$1" \
                | sed \
                    -e 's/\\/\\\\/g' \
                    -e 's/"/\\"/g' \
                    -e ':a;N;$!ba;s/\n/\\n/g'
          }

          installed_version()
          {
              opkg status luci-app-passwall 2>/dev/null \
                | awk -F': ' '$1 == "Version" { print $2; exit }'
          }

          available_version()
          {
              opkg list luci-app-passwall 2>/dev/null \
                | awk '$1 == "luci-app-passwall" { print $3; exit }'
          }

          upgradable_packages()
          {
              opkg list-upgradable 2>/dev/null \
                | awk '{ print $1 }' \
                | grep -E "$FILTER" \
                || true
          }

          status_json()
          {
              local installed available packages count

              installed="$(installed_version)"
              available="$(available_version)"
              packages="$(upgradable_packages)"
              count="$(printf '%s\n' "$packages" | sed '/^$/d' | wc -l)"

              printf '{'
              printf '"installed":"%s",' "$(json_escape "${installed:-not-installed}")"
              printf '"available":"%s",' "$(json_escape "${available:-unknown}")"
              printf '"count":%s,' "${count:-0}"
              printf '"packages":"%s"' "$(json_escape "$packages")"
              printf '}\n'
          }

          do_check()
          {
              opkg update >/tmp/passwall-opkg-update.log 2>&1 || {
                  printf '{"ok":false,"message":"OPKG 更新失败，请查看 /tmp/passwall-opkg-update.log"}\n'
                  return 1
              }

              printf '{"ok":true,"status":'
              status_json | tr -d '\n'
              printf '}\n'
          }

          do_upgrade()
          {
              local packages

              opkg update >/tmp/passwall-opkg-update.log 2>&1 || {
                  printf '{"ok":false,"message":"OPKG 更新失败"}\n'
                  return 1
              }

              packages="$(upgradable_packages)"

              if [ -z "$packages" ]; then
                  printf '{"ok":true,"message":"PassWall 已经是最新版本，没有需要更新的组件。"}\n'
                  return 0
              fi

              echo "$packages" > /tmp/passwall-upgrade-packages.txt

              # shellcheck disable=SC2086
              if opkg upgrade $packages >/tmp/passwall-upgrade.log 2>&1; then
                  rm -rf /tmp/luci-indexcache /tmp/luci-modulecache
                  /etc/init.d/uhttpd restart >/dev/null 2>&1 || true
                  printf '{"ok":true,"message":"PassWall 在线更新完成。建议刷新浏览器；如核心正在运行，可重启 PassWall 服务。"}\n'
              else
                  printf '{"ok":false,"message":"PassWall 更新失败，请查看 /tmp/passwall-upgrade.log"}\n'
                  return 1
              fi
          }

          case "$1" in
              status)
                  status_json
                  ;;
              check)
                  do_check
                  ;;
              upgrade)
                  do_upgrade
                  ;;
              *)
                  echo "Usage: doornet2-passwall-updater {status|check|upgrade}" >&2
                  exit 1
                  ;;
          esac
          EOF

          chmod 755 files/usr/bin/doornet2-passwall-updater
          sh -n files/usr/bin/doornet2-passwall-updater

          cat > files/usr/lib/lua/luci/controller/doornet2_passwall_update.lua <<'EOF'
          module("luci.controller.doornet2_passwall_update", package.seeall)

          function index()
              if not nixio.fs.access("/usr/bin/doornet2-passwall-updater") then
                  return
              end

              local page = entry(
                  {"admin", "services", "doornet2_passwall_update"},
                  template("doornet2/passwall_update"),
                  _("PassWall 在线升级"),
                  99
              )
              page.dependent = false

              entry(
                  {"admin", "services", "doornet2_passwall_update", "status"},
                  call("action_status")
              ).leaf = true

              entry(
                  {"admin", "services", "doornet2_passwall_update", "check"},
                  call("action_check")
              ).leaf = true

              entry(
                  {"admin", "services", "doornet2_passwall_update", "upgrade"},
                  call("action_upgrade")
              ).leaf = true
          end

          local function output(command)
              local http = require "luci.http"
              local sys = require "luci.sys"
              http.prepare_content("application/json")
              http.write(sys.exec("/usr/bin/doornet2-passwall-updater " .. command .. " 2>/dev/null"))
          end

          function action_status()
              output("status")
          end

          function action_check()
              output("check")
          end

          function action_upgrade()
              output("upgrade")
          end
          EOF

          cat > files/usr/lib/lua/luci/view/doornet2/passwall_update.htm <<'EOF'
          <%+header%>

          <h2><%:PassWall 在线升级%></h2>

          <div class="cbi-map-descr">
            <%:只更新 PassWall、中文包以及 PassWall 使用的用户态核心组件。不会更新内核、kmod，也不会刷写 DoorNet2 固件。更新包来自 DoorNet2 自己的 GitHub OPKG feed，与当前固件使用同一套源码和编译环境。%>
          </div>

          <div class="cbi-section">
            <div class="cbi-section-node">
              <p><strong><%:已安装版本%>：</strong><span id="pw-installed">读取中...</span></p>
              <p><strong><%:Feed 版本%>：</strong><span id="pw-available">读取中...</span></p>
              <p><strong><%:可更新组件%>：</strong><span id="pw-count">-</span></p>
              <pre id="pw-packages" style="white-space:pre-wrap;min-height:40px"></pre>

              <p>
                <button class="cbi-button cbi-button-action" type="button" onclick="pwCheck()"><%:检查更新%></button>
                <button class="cbi-button cbi-button-apply" type="button" onclick="pwUpgrade()"><%:立即更新%></button>
              </p>

              <div id="pw-message"></div>
            </div>
          </div>

          <script type="text/javascript">
          function setMsg(s) {
              document.getElementById('pw-message').innerHTML = s || '';
          }

          function renderStatus(s) {
              if (!s) return;
              document.getElementById('pw-installed').textContent = s.installed || 'unknown';
              document.getElementById('pw-available').textContent = s.available || 'unknown';
              document.getElementById('pw-count').textContent = s.count || 0;
              document.getElementById('pw-packages').textContent = s.packages || '没有可更新组件';
          }

          function req(path, cb) {
              XHR.get('<%=luci.dispatcher.build_url("admin/services/doornet2_passwall_update")%>/' + path, null, function(x, data) {
                  cb(data || {});
              });
          }

          function pwStatus() {
              req('status', function(data) { renderStatus(data); });
          }

          function pwCheck() {
              setMsg('正在更新软件列表并检查 PassWall...');
              req('check', function(data) {
                  if (data.ok && data.status) {
                      renderStatus(data.status);
                      setMsg('<strong>检查完成。</strong>');
                  } else {
                      setMsg('<strong>检查失败：</strong>' + (data.message || 'unknown'));
                  }
              });
          }

          function pwUpgrade() {
              if (!confirm('确认在线更新 PassWall 及其用户态核心组件？')) return;
              setMsg('正在更新，请不要关闭页面或断电...');
              req('upgrade', function(data) {
                  setMsg('<strong>' + (data.message || (data.ok ? '完成' : '失败')) + '</strong>');
                  setTimeout(pwStatus, 2500);
              });
          }

          window.onload = pwStatus;
          </script>

          <%+footer%>
          EOF

          echo "===== PASSWALL ONLINE UPDATER ====="
          sh -n files/usr/bin/doornet2-passwall-updater
          grep -nE \
            'PassWall 在线升级|doornet2-passwall-updater' \
            files/usr/lib/lua/luci/controller/doornet2_passwall_update.lua


      # ============================================================
      # 12B. DoorNet2 network application online updater
      #
      # Online-updatable userspace components:
      #   - PassWall proxy routing
      #   - SmartDNS DNS acceleration
      #   - PassWall2 proxy routing
      #   - AdGuard Home DNS/ad blocking
      #
      # No kmod/kernel package is ever selected by this updater.
      # Packages come from DoorNet2's own GitHub OPKG feed built by the
      # same workflow as the firmware.
      # ============================================================

      - name: Add network apps online updater
        run: |
          set -e

          mkdir -p \
            files/usr/bin \
            files/usr/lib/lua/luci/controller \
            files/usr/lib/lua/luci/view/doornet2

          cat > files/usr/bin/doornet2-app-updater <<'EOF'
          #!/bin/sh

          export PATH=/usr/sbin:/usr/bin:/sbin:/bin

          json_escape()
          {
              printf '%s' "$1" \
                | sed \
                    -e 's/\\/\\\\/g' \
                    -e 's/"/\\"/g' \
                    -e ':a;N;$!ba;s/\n/\\n/g'
          }

          component_meta()
          {
              case "$1" in
                  passwall)
                      LABEL='PassWall 代理分流'
                      MAIN='luci-app-passwall'
                      SERVICE='passwall'
                      FILTER='^(luci-app-passwall|luci-i18n-passwall-|chinadns-ng|dns2socks|haproxy|hysteria|ipt2socks|microsocks|naiveproxy|shadow-tls|simple-obfs|tcping|v2ray-geoip|v2ray-geosite|xray-core|xray-plugin)$'
                      ;;
                  smartdns)
                      LABEL='SmartDNS DNS 加速'
                      MAIN='smartdns'
                      SERVICE='smartdns'
                      FILTER='^(smartdns|smartdns-ui|luci-app-smartdns|luci-i18n-smartdns-.*)$'
                      ;;
                  passwall2)
                      LABEL='PassWall2 代理分流'
                      MAIN='luci-app-passwall2'
                      SERVICE='passwall2'
                      FILTER='^(luci-app-passwall2|luci-i18n-passwall2-.*|chinadns-ng|dnsmasq-full|haproxy|simple-obfs|tcping|v2ray-geoip|v2ray-geosite|xray-core)$'
                      ;;
                  adguard)
                      LABEL='AdGuard Home'
                      MAIN='adguardhome'
                      SERVICE='adguardhome'
                      FILTER='^(adguardhome|luci-app-adguardhome|luci-i18n-adguardhome-.*)$'
                      ;;
                  *)
                      return 1
                      ;;
              esac

              return 0
          }

          installed_version()
          {
              opkg status "$MAIN" 2>/dev/null \
                | awk -F': ' '$1 == "Version" { print $2; exit }'
          }

          available_version()
          {
              opkg list "$MAIN" 2>/dev/null \
                | awk -v p="$MAIN" '$1 == p { print $3; exit }'
          }

          upgradable_packages()
          {
              opkg list-upgradable 2>/dev/null \
                | awk '{ print $1 }' \
                | grep -E "$FILTER" \
                || true
          }

          status_json()
          {
              local component installed available packages count

              component="$1"

              component_meta "$component" || {
                  printf '{"ok":false,"message":"unknown component"}\n'
                  return 1
              }

              installed="$(installed_version)"
              available="$(available_version)"
              packages="$(upgradable_packages)"
              count="$(printf '%s\n' "$packages" | sed '/^$/d' | wc -l)"

              printf '{'
              printf '"ok":true,'
              printf '"component":"%s",' "$(json_escape "$component")"
              printf '"label":"%s",' "$(json_escape "$LABEL")"
              printf '"installed":"%s",' "$(json_escape "${installed:-not-installed}")"
              printf '"available":"%s",' "$(json_escape "${available:-unknown}")"
              printf '"count":%s,' "${count:-0}"
              printf '"packages":"%s"' "$(json_escape "$packages")"
              printf '}\n'
          }

          do_refresh()
          {
              if opkg update >/tmp/doornet2-app-opkg-update.log 2>&1; then
                  printf '{"ok":true,"message":"软件列表更新完成"}\n'
              else
                  printf '{"ok":false,"message":"OPKG 更新失败，请查看 /tmp/doornet2-app-opkg-update.log"}\n'
                  return 1
              fi
          }

          do_upgrade()
          {
              local component packages was_enabled

              component="$1"

              component_meta "$component" || {
                  printf '{"ok":false,"message":"unknown component"}\n'
                  return 1
              }

              opkg update >/tmp/doornet2-app-opkg-update.log 2>&1 || {
                  printf '{"ok":false,"message":"OPKG 更新失败"}\n'
                  return 1
              }

              packages="$(upgradable_packages)"

              if [ -z "$packages" ]; then
                  printf '{"ok":true,"message":"%s 已经是最新版本，没有需要更新的组件。"}\n' \
                    "$(json_escape "$LABEL")"
                  return 0
              fi

              # The filters above intentionally exclude all kmod/kernel packages.
              echo "$packages" > "/tmp/doornet2-${component}-upgrade-packages.txt"

              was_enabled=0
              if [ -n "$SERVICE" ] && [ -x "/etc/init.d/$SERVICE" ]; then
                  "/etc/init.d/$SERVICE" enabled >/dev/null 2>&1 && was_enabled=1 || true
              fi

              # shellcheck disable=SC2086
              if opkg upgrade $packages >"/tmp/doornet2-${component}-upgrade.log" 2>&1; then
                  rm -rf /tmp/luci-indexcache /tmp/luci-modulecache

                  if [ "$was_enabled" = "1" ] && [ -x "/etc/init.d/$SERVICE" ]; then
                      "/etc/init.d/$SERVICE" restart >/dev/null 2>&1 || true
                  fi

                  /etc/init.d/uhttpd restart >/dev/null 2>&1 || true

                  printf '{"ok":true,"message":"%s 在线更新完成。"}\n' \
                    "$(json_escape "$LABEL")"
              else
                  printf '{"ok":false,"message":"%s 更新失败，请查看 %s"}\n' \
                    "$(json_escape "$LABEL")" \
                    "$(json_escape "/tmp/doornet2-${component}-upgrade.log")"
                  return 1
              fi
          }

          case "$1" in
              refresh)
                  do_refresh
                  ;;
              status)
                  status_json "$2"
                  ;;
              upgrade)
                  do_upgrade "$2"
                  ;;
              *)
                  echo "Usage: doornet2-app-updater {refresh|status COMPONENT|upgrade COMPONENT}" >&2
                  exit 1
                  ;;
          esac
          EOF

          chmod 755 files/usr/bin/doornet2-app-updater
          sh -n files/usr/bin/doornet2-app-updater

          cat > files/usr/lib/lua/luci/controller/doornet2_app_update.lua <<'EOF'
          module("luci.controller.doornet2_app_update", package.seeall)

          local allowed = {
              passwall = true,
              smartdns = true,
              passwall2 = true,
              adguard = true
          }

          function index()
              if not nixio.fs.access("/usr/bin/doornet2-app-updater") then
                  return
              end

              local page = entry(
                  {"admin", "services", "doornet2_app_update"},
                  template("doornet2/app_update"),
                  _("DoorNet2 组件在线升级"),
                  98
              )
              page.dependent = false

              entry(
                  {"admin", "services", "doornet2_app_update", "refresh"},
                  call("action_refresh")
              ).leaf = true

              entry(
                  {"admin", "services", "doornet2_app_update", "status"},
                  call("action_status")
              ).leaf = true

              entry(
                  {"admin", "services", "doornet2_app_update", "upgrade"},
                  call("action_upgrade")
              ).leaf = true
          end

          local function output(command, component)
              local http = require "luci.http"
              local sys = require "luci.sys"

              http.prepare_content("application/json")

              if component and not allowed[component] then
                  http.write('{"ok":false,"message":"invalid component"}')
                  return
              end

              local cmd = "/usr/bin/doornet2-app-updater " .. command

              if component then
                  cmd = cmd .. " " .. component
              end

              http.write(sys.exec(cmd .. " 2>/dev/null"))
          end

          function action_refresh()
              output("refresh", nil)
          end

          function action_status()
              local http = require "luci.http"
              output("status", http.formvalue("component"))
          end

          function action_upgrade()
              local http = require "luci.http"
              output("upgrade", http.formvalue("component"))
          end
          EOF

          cat > files/usr/lib/lua/luci/view/doornet2/app_update.htm <<'EOF'
          <%+header%>

          <h2><%:DoorNet2 组件在线升级%></h2>

          <div class="cbi-map-descr">
            <%:这里仅更新用户态应用包，不更新内核/kmod，也不会刷写固件。软件包来自 DoorNet2 自己的 GitHub OPKG feed，与当前固件使用同一套编译环境。SmartDNS 与 AdGuard Home 都可能提供 DNS 服务，请先规划端口后再启用，避免同时占用 53 端口。%>
          </div>

          <p>
            <button class="cbi-button cbi-button-action" type="button" onclick="refreshAll()"><%:更新软件列表并检查全部%></button>
          </p>

          <div id="dn-app-message"></div>

          <div class="cbi-section">
            <div class="cbi-section-node">
              <table class="table">
                <tr class="tr table-titles">
                  <th class="th"><%:组件%></th>
                  <th class="th"><%:当前版本%></th>
                  <th class="th"><%:Feed版本%></th>
                  <th class="th"><%:可更新包%></th>
                  <th class="th"><%:操作%></th>
                </tr>
                <tbody id="dn-app-body"></tbody>
              </table>
            </div>
          </div>

          <script type="text/javascript">
          var components = [
              ['passwall', 'PassWall 代理分流'],
              ['smartdns', 'SmartDNS DNS 加速'],
              ['passwall2', 'PassWall2 代理分流'],
              ['adguard', 'AdGuard Home']
          ];

          function esc(s) {
              return String(s == null ? '' : s)
                  .replace(/&/g, '&amp;')
                  .replace(/</g, '&lt;')
                  .replace(/>/g, '&gt;')
                  .replace(/"/g, '&quot;');
          }

          function rowHtml(c, label) {
              return '<tr class="tr" id="row-' + c + '">' +
                  '<td class="td"><strong>' + esc(label) + '</strong></td>' +
                  '<td class="td" id="installed-' + c + '">读取中...</td>' +
                  '<td class="td" id="available-' + c + '">读取中...</td>' +
                  '<td class="td"><span id="count-' + c + '">-</span><pre id="packages-' + c + '" style="white-space:pre-wrap;margin:6px 0 0"></pre></td>' +
                  '<td class="td"><button class="cbi-button cbi-button-apply" type="button" onclick="upgradeOne(\'' + c + '\',\'' + esc(label) + '\')">在线更新</button></td>' +
                  '</tr>';
          }

          function initRows() {
              var html = '';
              for (var i = 0; i < components.length; i++) {
                  html += rowHtml(components[i][0], components[i][1]);
              }
              document.getElementById('dn-app-body').innerHTML = html;
          }

          function setMsg(s) {
              document.getElementById('dn-app-message').innerHTML = s || '';
          }

          function statusOne(c) {
              XHR.get(
                  '<%=luci.dispatcher.build_url("admin/services/doornet2_app_update/status")%>',
                  { component: c },
                  function(x, data) {
                      data = data || {};
                      document.getElementById('installed-' + c).textContent = data.installed || 'unknown';
                      document.getElementById('available-' + c).textContent = data.available || 'unknown';
                      document.getElementById('count-' + c).textContent = data.count || 0;
                      document.getElementById('packages-' + c).textContent = data.packages || '';
                  }
              );
          }

          function statusAll() {
              for (var i = 0; i < components.length; i++) {
                  statusOne(components[i][0]);
              }
          }

          function refreshAll() {
              setMsg('<strong>正在更新软件列表...</strong>');
              XHR.get(
                  '<%=luci.dispatcher.build_url("admin/services/doornet2_app_update/refresh")%>',
                  null,
                  function(x, data) {
                      data = data || {};
                      setMsg('<strong>' + esc(data.message || (data.ok ? '检查完成' : '检查失败')) + '</strong>');
                      statusAll();
                  }
              );
          }

          function upgradeOne(c, label) {
              if (!confirm('确认在线更新 ' + label + '？')) return;

              setMsg('<strong>正在更新 ' + esc(label) + '，请不要断电...</strong>');

              XHR.get(
                  '<%=luci.dispatcher.build_url("admin/services/doornet2_app_update/upgrade")%>',
                  { component: c },
                  function(x, data) {
                      data = data || {};
                      setMsg('<strong>' + esc(data.message || (data.ok ? '完成' : '失败')) + '</strong>');
                      setTimeout(function() { statusOne(c); }, 2500);
                  }
              );
          }

          initRows();
          statusAll();
          </script>

          <%+footer%>
          EOF

          echo "===== NETWORK APPS ONLINE UPDATER ====="
          sh -n files/usr/bin/doornet2-app-updater
          grep -nE \
            'DoorNet2 组件在线升级|doornet2-app-updater' \
            files/usr/lib/lua/luci/controller/doornet2_app_update.lua


      # ============================================================
      # 13. Packages
      # ============================================================

      - name: Configure DoorNet2 and packages
        run: |
          set -e

          cat >> .config <<'EOF'

          CONFIG_TARGET_rockchip=y
          CONFIG_TARGET_rockchip_armv8=y
          CONFIG_TARGET_MULTI_PROFILE=y
          CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_embedfire_doornet2=y

          CONFIG_TARGET_KERNEL_PARTSIZE=64
          CONFIG_TARGET_ROOTFS_PARTSIZE=7168

          CONFIG_TARGET_ROOTFS_TARGZ=y
          CONFIG_TARGET_ROOTFS_EXT4FS=y
          CONFIG_TARGET_ROOTFS_SQUASHFS=y

          CONFIG_PACKAGE_luci-app-store=y
          CONFIG_PACKAGE_luci-compat=y

          # Shared DNS/proxy base
          # CONFIG_PACKAGE_dnsmasq is not set
          CONFIG_PACKAGE_dnsmasq-full=y
          CONFIG_PACKAGE_iptables=y
          CONFIG_PACKAGE_ip6tables=y
          CONFIG_PACKAGE_kmod-ip6tables=y
          # CONFIG_PACKAGE_firewall4 is not set

          # PassWall: Xray only for the Go 1.23-compatible DoorNet2 tree.
          CONFIG_PACKAGE_luci-app-passwall=y
          CONFIG_PACKAGE_luci-i18n-passwall-zh-cn=y
          CONFIG_PACKAGE_luci-app-passwall_Iptables_Transparent_Proxy=y
          # CONFIG_PACKAGE_luci-app-passwall_Nftables_Transparent_Proxy is not set
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Xray=y
          # CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Geoview is not set
          # CONFIG_PACKAGE_luci-app-passwall_INCLUDE_SingBox is not set
          # CONFIG_PACKAGE_luci-app-passwall_INCLUDE_V2ray_Plugin is not set
          # CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Shadowsocks_Rust_Client is not set
          # CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Shadowsocks_Rust_Server is not set
          # CONFIG_PACKAGE_luci-app-passwall_INCLUDE_ShadowsocksR_Libev_Client is not set
          # CONFIG_PACKAGE_luci-app-passwall_INCLUDE_ShadowsocksR_Libev_Server is not set
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Simple_Obfs=y

          # PassWall2: select Xray explicitly instead of the aarch64 default
          # "All" core, which would pull current Sing-box and a newer Go toolchain.
          CONFIG_PACKAGE_luci-app-passwall2=y
          CONFIG_PACKAGE_luci-i18n-passwall2-zh-cn=y
          CONFIG_PACKAGE_luci-app-passwall2_Basic_Core_Xray=y
          # CONFIG_PACKAGE_luci-app-passwall2_Basic_Core_SingBox is not set
          # CONFIG_PACKAGE_luci-app-passwall2_Basic_Core_All is not set
          CONFIG_PACKAGE_luci-app-passwall2_Iptables_Transparent_Proxy=y
          # CONFIG_PACKAGE_luci-app-passwall2_Nftables_Transparent_Proxy is not set
          # CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_V2ray_Plugin is not set
          # CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_Shadowsocks_Rust_Client is not set
          # CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_Shadowsocks_Rust_Server is not set
          # CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_ShadowsocksR_Libev_Client is not set
          # CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_ShadowsocksR_Libev_Server is not set
          CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_Simple_Obfs=y

          # Known incompatible packages are disabled at package level as well.
          # CONFIG_PACKAGE_geoview is not set
          # CONFIG_PACKAGE_sing-box is not set
          # CONFIG_PACKAGE_v2ray-plugin is not set
          # CONFIG_PACKAGE_shadowsocks-rust is not set
          # CONFIG_PACKAGE_shadowsocks-rust-sslocal is not set
          # CONFIG_PACKAGE_shadowsocks-rust-ssserver is not set
          # CONFIG_PACKAGE_shadowsocksr-libev is not set
          # CONFIG_PACKAGE_shadowsocksr-libev-ssr-local is not set
          # CONFIG_PACKAGE_shadowsocksr-libev-ssr-redir is not set
          # CONFIG_PACKAGE_shadowsocksr-libev-ssr-server is not set

          # SmartDNS + AdGuard Home.  First-boot script leaves both disabled.
          CONFIG_PACKAGE_smartdns=y
          CONFIG_PACKAGE_luci-app-smartdns=y
          CONFIG_PACKAGE_luci-i18n-smartdns-zh-cn=y
          CONFIG_PACKAGE_adguardhome=y

          # UU accelerator is intentionally absent from the final firmware.
          # CONFIG_PACKAGE_luci-app-uugamebooster is not set
          # CONFIG_PACKAGE_uugamebooster is not set
          # CONFIG_PACKAGE_luci-app-uuplugin is not set
          # CONFIG_PACKAGE_uuplugin is not set

          # iStoreOS-style QuickStart dashboard
          CONFIG_PACKAGE_quickstart=y
          CONFIG_PACKAGE_luci-app-quickstart=y
          CONFIG_PACKAGE_luci-i18n-quickstart-zh-cn=y

          # Design is default. Argon and Bootstrap remain recovery themes.
          CONFIG_PACKAGE_luci-theme-bootstrap=y
          CONFIG_PACKAGE_luci-theme-design=y
          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_luci-app-argon-config=y

          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_ca-bundle=y
          CONFIG_PACKAGE_ca-certificates=y
          CONFIG_PACKAGE_jsonfilter=y

          CONFIG_PACKAGE_lsblk=y
          CONFIG_PACKAGE_fdisk=y
          CONFIG_PACKAGE_sfdisk=y
          CONFIG_PACKAGE_blkid=y
          CONFIG_PACKAGE_blockdev=y
          CONFIG_PACKAGE_partx-utils=y
          CONFIG_PACKAGE_mount-utils=y

          CONFIG_PACKAGE_e2fsprogs=y
          CONFIG_PACKAGE_resize2fs=y
          CONFIG_PACKAGE_tune2fs=y

          CONFIG_PACKAGE_block-mount=y
          CONFIG_PACKAGE_kmod-fs-ext4=y

          EOF

      - name: Generate configuration file
        run: |
          set -e

          make defconfig

          echo "===== TARGET ====="
          grep '^CONFIG_TARGET_.*=y' .config || true

          if grep -Eq '^CONFIG_TARGET_x86(_64)?=y' .config; then
              echo "ERROR: x86 target detected. This build must be DoorNet2 RK3399."
              exit 1
          fi

          grep -q '^CONFIG_TARGET_rockchip=y$' .config
          grep -q '^CONFIG_TARGET_rockchip_armv8=y$' .config
          grep -q '^CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_embedfire_doornet2=y$' .config

          echo
          echo "===== VERSION ====="
          cat files/etc/doornet2_release

          echo
          echo "===== UPDATER ====="
          sh -n files/usr/bin/doornet2-updater
          grep -nE             'fe320000|fe330000|verify_mmc_host_layout|verify_sysupgrade_target'             files/usr/bin/doornet2-updater

          echo
          echo "===== PASSWALL / PASSWALL2 / XRAY ====="
          for sym in             CONFIG_PACKAGE_luci-app-passwall             CONFIG_PACKAGE_luci-i18n-passwall-zh-cn             CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Xray             CONFIG_PACKAGE_luci-app-passwall_Iptables_Transparent_Proxy             CONFIG_PACKAGE_luci-app-passwall2             CONFIG_PACKAGE_luci-i18n-passwall2-zh-cn             CONFIG_PACKAGE_luci-app-passwall2_Basic_Core_Xray             CONFIG_PACKAGE_luci-app-passwall2_Iptables_Transparent_Proxy             CONFIG_PACKAGE_dnsmasq-full             CONFIG_PACKAGE_iptables             CONFIG_PACKAGE_ip6tables             CONFIG_PACKAGE_kmod-ip6tables; do
              grep -q "^${sym}=y$" .config || {
                  echo "ERROR: required symbol missing: ${sym}=y"
                  exit 1
              }
          done

          if grep -Eq '^CONFIG_PACKAGE_luci-app-passwall2?_Nftables_Transparent_Proxy=y$|^CONFIG_PACKAGE_firewall4=y$' .config; then
              echo "ERROR: nftables/firewall4 was unexpectedly selected on the proven R4 firewall3 base."
              grep -E 'passwall2?_Nftables_Transparent_Proxy|CONFIG_PACKAGE_firewall4' .config || true
              exit 1
          fi

          # These components caused the prior build failures or require a newer Go.
          if grep -Eq '^CONFIG_PACKAGE_(geoview|sing-box|v2ray-plugin|shadowsocks-rust|shadowsocks-rust-sslocal|shadowsocks-rust-ssserver|shadowsocksr-libev|shadowsocksr-libev-ssr-local|shadowsocksr-libev-ssr-redir|shadowsocksr-libev-ssr-server)=y$' .config; then
              echo "ERROR: incompatible proxy component was re-selected."
              grep -E '^CONFIG_PACKAGE_(geoview|sing-box|v2ray-plugin|shadowsocks-rust|shadowsocks-rust-sslocal|shadowsocks-rust-ssserver|shadowsocksr-libev|shadowsocksr-libev-ssr-local|shadowsocksr-libev-ssr-redir|shadowsocksr-libev-ssr-server)=y$' .config || true
              exit 1
          fi

          if grep -Eq '^CONFIG_PACKAGE_luci-app-passwall2?_INCLUDE_(V2ray_Plugin|Shadowsocks_Rust_Client|Shadowsocks_Rust_Server|ShadowsocksR_Libev_Client|ShadowsocksR_Libev_Server)=y$' .config; then
              echo "ERROR: PassWall/PassWall2 selector re-enabled an incompatible component."
              exit 1
          fi

          grep -q '^# CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Geoview is not set$' .config
          grep -q '^# CONFIG_PACKAGE_luci-app-passwall2_Basic_Core_All is not set$' .config
          grep -q '^# CONFIG_PACKAGE_luci-app-passwall2_Basic_Core_SingBox is not set$' .config

          XRAY_MK="feeds/passwall_packages/xray-core/Makefile"
          grep -q '^PKG_VERSION:=25\.1\.30$' "$XRAY_MK"
          grep -q '^PKG_HASH:=983ee395f085ed1b7fbe0152cb56a5b605a6f70a5645d427c7186c476f14894e$' "$XRAY_MK"
          grep -q '\$(GO_PKG)/core.build=OpenWrt' "$XRAY_MK"
          if grep -q 'core.version=\$(PKG_VERSION)' "$XRAY_MK"; then
              echo "ERROR: incompatible Xray core.version ldflag returned."
              exit 1
          fi

          PW2_MK="feeds/passwall2_luci/luci-app-passwall2/Makefile"
          test -f "$PW2_MK"
          if grep -Eq '(^|[[:space:]])\+geoview([[:space:]]|$)' "$PW2_MK"; then
              echo "ERROR: PassWall2 +geoview hard dependency returned."
              exit 1
          fi

          echo
          echo "===== ISTORE / DNS / UI ====="
          for sym in             CONFIG_PACKAGE_luci-app-store             CONFIG_PACKAGE_smartdns             CONFIG_PACKAGE_luci-app-smartdns             CONFIG_PACKAGE_adguardhome             CONFIG_PACKAGE_quickstart             CONFIG_PACKAGE_luci-app-quickstart             CONFIG_PACKAGE_luci-theme-design             CONFIG_PACKAGE_luci-theme-argon             CONFIG_PACKAGE_luci-app-argon-config; do
              grep -q "^${sym}=y$" .config || {
                  echo "ERROR: required final feature missing: ${sym}=y"
                  exit 1
              }
          done

          echo
          echo "===== UU ABSENCE CHECK ====="
          if grep -Eq '^CONFIG_PACKAGE_.*(uugamebooster|uuplugin).*=y$' .config; then
              echo "ERROR: UU accelerator component is selected."
              grep -Ei 'uugamebooster|uuplugin' .config || true
              exit 1
          fi

          if grep -RniE 'uugamebooster|uuplugin|网易[[:space:]]*UU|NetEase[[:space:]]+UU' files 2>/dev/null; then
              echo "ERROR: UU runtime/menu/autostart/update content exists under files/."
              exit 1
          fi

          if grep -RniE 'router\.uu\.163\.com|uu\.gdl\.netease\.com|uurouter\.gdl\.netease\.com' files 2>/dev/null; then
              echo "ERROR: legacy UU-specific domain exists under files/."
              exit 1
          fi

          test -x files/usr/bin/doornet2-passwall-updater
          test -x files/usr/bin/doornet2-app-updater
          test -x files/etc/uci-defaults/zzzb-doornet2-network-apps
          test -f files/lib/upgrade/keep.d/doornet2-user-network-config
          sh -n files/usr/bin/doornet2-app-updater
          sh -n files/etc/uci-defaults/zzzb-doornet2-network-apps
          test -x files/etc/uci-defaults/zzza-doornet2-shunt-presets
          sh -n files/etc/uci-defaults/zzza-doornet2-shunt-presets
          grep -q 'seed_config passwall' files/etc/uci-defaults/zzza-doornet2-shunt-presets
          grep -q 'seed_config passwall2' files/etc/uci-defaults/zzza-doornet2-shunt-presets
          grep -q 'remarks=分流总节点' files/etc/uci-defaults/zzza-doornet2-shunt-presets
          grep -q 'api.example.com,speedtest.net' files/etc/uci-defaults/zzza-doornet2-shunt-presets
          if grep -Ei 'router\.uu\.163\.com|uu\.gdl\.netease\.com|uurouter\.gdl\.netease\.com' files/etc/uci-defaults/zzza-doornet2-shunt-presets; then
              echo "ERROR: UU-specific domain leaked into shunt presets."
              exit 1
          fi

          if [ -f files/etc/config/dhcp ]; then
              if grep -q '127\.0\.0\.1#3053' files/etc/config/dhcp || \
                 grep -Eq "option[[:space:]]+noresolv[[:space:]]+['\"]?1" files/etc/config/dhcp; then
                  echo "ERROR: old forced dnsmasq -> AdGuard chain is still baked in"
                  cat files/etc/config/dhcp
                  exit 1
              fi
          fi

          if find files -type f \
              \( -name 'doornet2-dns-chain' -o -name 'passwall-delay' -o -name 'passwall2-delay' \) \
              -print 2>/dev/null | grep -q .; then
              echo "ERROR: old automatic DNS/proxy rewrite scripts are still present"
              find files -type f \
                \( -name 'doornet2-dns-chain' -o -name 'passwall-delay' -o -name 'passwall2-delay' \) \
                -print
              exit 1
          fi

          echo "OK: DoorNet2 final configuration preflight passed."

      - name: Download packages
        run: |
          set -e

          echo "===== CLEAN STALE BUILD OUTPUTS ====="
          rm -rf ./artifact
          rm -rf ./bin/targets/rockchip/armv8

          make download -j16

          find dl             -size -1024c             -exec rm -f {} \;

      - name: Preflight package selection sanity checks
        run: |
          set -e

          echo "===== PASSWALL / PASSWALL2 DEPENDENCY PREFLIGHT ====="

          grep -q '^CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Xray=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-app-passwall2_Basic_Core_Xray=y$' .config

          if grep -Eq '^CONFIG_PACKAGE_(geoview|sing-box|v2ray-plugin|shadowsocks-rust-sslocal|shadowsocks-rust-ssserver|shadowsocksr-libev-ssr-local|shadowsocksr-libev-ssr-redir|shadowsocksr-libev-ssr-server)=y$' .config; then
              echo "ERROR: an incompatible PassWall component was re-selected before compile."
              exit 1
          fi

          RUST_MK="feeds/packages/lang/rust/Makefile"
          test -f "$RUST_MK"
          grep -q -- '--set=llvm.download-ci-llvm=false' "$RUST_MK"

          PW2_MK="feeds/passwall2_luci/luci-app-passwall2/Makefile"
          test -f "$PW2_MK"
          if grep -Eq '(^|[[:space:]])\+geoview([[:space:]]|$)' "$PW2_MK"; then
              echo "ERROR: PassWall2 +geoview dependency is active."
              exit 1
          fi

          echo "===== UU FINAL PREFLIGHT ====="
          if grep -Eq '^CONFIG_PACKAGE_.*(uugamebooster|uuplugin).*=y$' .config; then
              echo "ERROR: UU package selected before compile."
              exit 1
          fi

          if grep -RniE 'uugamebooster|uuplugin|网易[[:space:]]*UU|NetEase[[:space:]]+UU' files 2>/dev/null; then
              echo "ERROR: UU runtime content exists in firmware overlay."
              exit 1
          fi

          if grep -RniE 'router\.uu\.163\.com|uu\.gdl\.netease\.com|uurouter\.gdl\.netease\.com' files 2>/dev/null; then
              echo "ERROR: UU-specific domain exists in firmware overlay."
              exit 1
          fi

          echo "OK: dependency preflight passed."

      - name: Verify UU accelerator is completely absent
        run: |
          set -e

          if grep -Eq '^CONFIG_PACKAGE_.*(uugamebooster|uuplugin).*=y$' .config; then
              echo "ERROR: UU package selected."
              exit 1
          fi

          if grep -RniE 'uugamebooster|uuplugin|网易[[:space:]]*UU|NetEase[[:space:]]+UU' files 2>/dev/null; then
              echo "ERROR: UU menu/script/autostart/runtime/update content found in files/."
              exit 1
          fi

          if grep -RniE 'router\.uu\.163\.com|uu\.gdl\.netease\.com|uurouter\.gdl\.netease\.com' files 2>/dev/null; then
              echo "ERROR: UU-specific domain found in files/."
              exit 1
          fi

          echo "OK: UU accelerator is absent from final firmware overlay and config."

      - name: Verify proven source baseline before compile
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "9d1be44f0c1eaf3100ba122a966ff86b66354792"
          echo "Source baseline locked: $(git rev-parse HEAD)"
          grep -q '^CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_embedfire_doornet2=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-app-passwall_Iptables_Transparent_Proxy=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-app-passwall2_Iptables_Transparent_Proxy=y$' .config

      - name: Compile firmware
        run: |
          make -j$(nproc) || \
            make -j1 V=s

          df -h

          find ./bin/targets/ \
            -type f \
            | sort

      - name: Audit generated rootfs before publishing
        run: |
          set -e

          ROOTFS_TAR="$(
            find ./bin/targets/rockchip/armv8 \
              -maxdepth 1 -type f \
              -name '*embedfire_doornet2-rootfs.tar.gz' \
              | head -n 1
          )"

          if [ -z "$ROOTFS_TAR" ]; then
              echo "ERROR: generated DoorNet2 rootfs tarball not found."
              exit 1
          fi

          AUDIT_DIR="$(mktemp -d)"
          trap 'rm -rf "$AUDIT_DIR"' EXIT
          tar -xzf "$ROOTFS_TAR" -C "$AUDIT_DIR"

          echo "===== PROVEN BOOT BASELINE CHECK ====="
          grep -q "DISTRIB_REVISION='R24.12.12-D'" "$AUDIT_DIR/etc/openwrt_release" || {
              echo "ERROR: generated firmware is not based on the proven R24.12.12-D source."
              cat "$AUDIT_DIR/etc/openwrt_release"
              exit 1
          }
          grep -q '^Package: kernel$' "$AUDIT_DIR/usr/lib/opkg/status"
          awk 'BEGIN{p=0} /^Package: kernel$/{p=1} p && /^Version: /{print; exit}' \
            "$AUDIT_DIR/usr/lib/opkg/status" | grep -q 'Version: 6\.6\.66-1-' || {
              echo "ERROR: generated kernel is not the proven DoorNet2 6.6.66 base."
              awk 'BEGIN{p=0} /^Package: kernel$/{p=1} p && /^Version: /{print; exit}' \
                "$AUDIT_DIR/usr/lib/opkg/status"
              exit 1
          }
          grep -q "DOORNET2_SOURCE_BASELINE='9d1be44f0c1eaf3100ba122a966ff86b66354792'" \
            "$AUDIT_DIR/etc/doornet2_release"
          grep -q "DOORNET2_BOOT_MODE='tf-first-emmc-fallback'" \
            "$AUDIT_DIR/etc/doornet2_release"

          echo "===== ROOTFS PACKAGE CHECK ====="
          for pkg in \
            luci-app-passwall \
            luci-app-passwall2 \
            xray-core \
            smartdns \
            luci-app-smartdns \
            adguardhome \
            luci-app-store \
            dnsmasq-full; do
              grep -q "^Package: ${pkg}$" "$AUDIT_DIR/usr/lib/opkg/status" || {
                  echo "ERROR: required package missing from rootfs: $pkg"
                  exit 1
              }
          done

          echo "===== ROOTFS DEFAULT DNS CHECK ====="
          if grep -q '127\.0\.0\.1#3053' "$AUDIT_DIR/etc/config/dhcp" || \
             grep -Eq "option[[:space:]]+noresolv[[:space:]]+['\"]?1" "$AUDIT_DIR/etc/config/dhcp"; then
              echo "ERROR: generated rootfs still contains the old forced dnsmasq -> AdGuard chain."
              cat "$AUDIT_DIR/etc/config/dhcp"
              exit 1
          fi

          grep -q "option 'enabled' '0'" "$AUDIT_DIR/etc/config/smartdns" || {
              echo "ERROR: SmartDNS is not OFF by default in generated rootfs."
              exit 1
          }

          test -x "$AUDIT_DIR/etc/uci-defaults/zzzb-doornet2-network-apps"
          test -f "$AUDIT_DIR/lib/upgrade/keep.d/doornet2-user-network-config"
          grep -q '/etc/config/passwall' "$AUDIT_DIR/lib/upgrade/keep.d/doornet2-user-network-config"
          grep -q '/etc/config/passwall2' "$AUDIT_DIR/lib/upgrade/keep.d/doornet2-user-network-config"
          grep -q '/etc/config/smartdns' "$AUDIT_DIR/lib/upgrade/keep.d/doornet2-user-network-config"
          grep -q '/etc/adguardhome.yaml' "$AUDIT_DIR/lib/upgrade/keep.d/doornet2-user-network-config"
          grep -q '/etc/config/dhcp' "$AUDIT_DIR/lib/upgrade/keep.d/doornet2-user-network-config"
          grep -q '/etc/doornet2-shunt-presets-v1' "$AUDIT_DIR/lib/upgrade/keep.d/doornet2-user-network-config"

          echo "===== ROOTFS SHUNT PRESET CHECK ====="
          SHUNT_PRESET="$AUDIT_DIR/etc/uci-defaults/zzza-doornet2-shunt-presets"
          test -x "$SHUNT_PRESET"
          sh -n "$SHUNT_PRESET"
          grep -q 'seed_config passwall' "$SHUNT_PRESET"
          grep -q 'seed_config passwall2' "$SHUNT_PRESET"
          grep -q 'remarks=分流总节点' "$SHUNT_PRESET"
          grep -q 'DN_WeChat' "$SHUNT_PRESET"
          grep -q 'DN_OpenAI' "$SHUNT_PRESET"
          grep -q 'DN_Netflix' "$SHUNT_PRESET"
          grep -q 'api.example.com,speedtest.net' "$SHUNT_PRESET"
          if grep -Ei 'router\.uu\.163\.com|uu\.gdl\.netease\.com|uurouter\.gdl\.netease\.com' "$SHUNT_PRESET"; then
              echo "ERROR: UU-specific domain exists in generated shunt preset."
              exit 1
          fi

          echo "===== ROOTFS ONLINE-UPGRADE CHECK ====="
          grep -q 'REPO="bwgone/DoorNet2-iStoreOS"' "$AUDIT_DIR/usr/bin/doornet2-updater"
          grep -q 'keep_config.*true' "$AUDIT_DIR/usr/bin/doornet2-updater"
          if grep -Eq '/sbin/sysupgrade[[:space:]\\]*-n|sysupgrade[[:space:]]+-n' "$AUDIT_DIR/usr/bin/doornet2-updater"; then
              echo "ERROR: updater contains sysupgrade -n and would discard settings."
              exit 1
          fi

          echo "===== ROOTFS REPOSITORY CHECK ====="
          if grep -Rni 'chatvps/DoorNet2-iStoreOS' \
              "$AUDIT_DIR/etc" "$AUDIT_DIR/usr" 2>/dev/null; then
              echo "ERROR: stale chatvps repository URL is baked into generated rootfs."
              exit 1
          fi

          grep -q "DOORNET2_GITHUB_REPOSITORY='bwgone/DoorNet2-iStoreOS'" \
            "$AUDIT_DIR/etc/doornet2_release"

          echo "===== ROOTFS UU ABSENCE CHECK ====="
          if find "$AUDIT_DIR" \
              \( -iname '*uugamebooster*' -o -iname '*uuplugin*' -o -iname 'doornet2-uu' -o -iname 'uu-delay' \) \
              -print | grep -q .; then
              echo "ERROR: UU runtime file exists in generated rootfs."
              exit 1
          fi

          if grep -RniE 'router\.uu\.163\.com|uu\.gdl\.netease\.com|uurouter\.gdl\.netease\.com' \
              "$AUDIT_DIR/etc" "$AUDIT_DIR/usr" 2>/dev/null; then
              echo "ERROR: UU-specific domain exists in generated rootfs."
              exit 1
          fi

          echo "OK: generated DoorNet2 rootfs audit passed."


      # ============================================================
      # 17. Prepare artifacts
      # ============================================================

      - name: Prepare artifact
        run: |
          set -e

          mkdir -p \
            ./artifact/package \
            ./artifact/buildinfo \
            ./artifact/firmware \
            ./artifact/release


          find ./bin/packages/ \
            -type f \
            -name "*.ipk" \
            -exec cp -f {} ./artifact/package/ \;


          find ./bin/targets/ \
            -type f \
            \( \
              -name "*.buildinfo" \
              -o -name "*.manifest" \
              -o -name "*.config" \
            \) \
            -exec cp -f {} ./artifact/buildinfo/ \;


          find ./bin/targets/ \
            -type f \
            \( \
              -name "*.img" \
              -o -name "*.img.gz" \
              -o -name "*.bin" \
              -o -name "*.itb" \
              -o -name "*.gz" \
            \) \
            ! -path "*/packages/*" \
            -exec cp -f {} ./artifact/firmware/ \;


          SOURCE_FW="$(
            find ./bin/targets/rockchip/armv8 \
              -maxdepth 1 \
              -type f \
              -name '*embedfire_doornet2-ext4-sysupgrade.img.gz' \
              | head -n 1
          )"


          if [ -z "$SOURCE_FW" ]; then

              echo "ERROR: DoorNet2 firmware not found"
              exit 1

          fi


          cp -f \
            "$SOURCE_FW" \
            ./artifact/release/DoorNet2-ext4-sysupgrade.img.gz


          cd ./artifact/release


          SHA256="$(
            sha256sum \
              DoorNet2-ext4-sysupgrade.img.gz \
            | awk '{print $1}'
          )"


          echo \
            "${SHA256}  DoorNet2-ext4-sysupgrade.img.gz" \
            > sha256sums.txt


          cat > version.json <<EOF
          {
            "board": "embedfire,doornet2",
            "version": "${DOORNET2_VERSION}",
            "tag": "${DOORNET2_TAG}",
            "build_date": "${DOORNET2_BUILD_DATE}",
            "commit": "${GITHUB_SHA}",
            "repository": "${GITHUB_REPOSITORY}",
            "asset": "DoorNet2-ext4-sysupgrade.img.gz",
            "sha256": "${SHA256}",
            "boot_policy": "tf-first-emmc-fallback",
            "mmc_layout": "mmcblk0-tf-mmcblk1-emmc",
            "tf_controller": "fe320000.mmc",
            "emmc_controller": "fe330000.mmc",
            "extroot": false,
            "updater": "physical-target-guard-v2",
            "tf_capacity": "preserve-expanded-root-v1",
            "network_apps": "passwall-passwall2-smartdns-adguard-user-managed-shunt-v5",
            "ui": "quickstart-design-dark-v1",
            "runtime_monitor": "thermal-time-v2"
          }
          EOF


          cat > release-notes.md <<EOF
          # DoorNet2 OpenWrt ${DOORNET2_VERSION}

          R18 storage layout:

          - U-Boot mmc1 = TF
          - U-Boot mmc0 = eMMC
          - Linux mmcblk0 = TF
          - Linux mmcblk1 = eMMC
          - TF controller = fe320000.mmc
          - eMMC controller = fe330000.mmc
          - TF physical type = SD
          - eMMC physical type = MMC

          Boot:

          - TF inserted -> TF kernel + TF rootfs
          - TF removed -> automatic eMMC fallback

          Upgrade protection:

          - Check MMC host aliases
          - Check physical SD/MMC type
          - Check controller path
          - Check current root disk
          - Check OpenWrt sysupgrade diskdev
          - Reject upgrade if any result differs

          TF capacity preservation:

          - Firmware image remains 7 GiB for eMMC compatibility
          - Expanded TF p2 partition table is preserved during sysupgrade
          - ext4 is automatically grown back to the existing TF p2 size
          - eMMC keeps the original Rockchip upgrade behaviour

          Final interface:

          - Design theme is the default LuCI shell
          - QuickStart remains the iStoreOS-style home/workflow page
          - Design dark mode is enabled by default
          - Argon and Bootstrap remain installed as recovery themes
          - CPU temperature + router date/time use a separate theme-independent badge
          - Installed theme headers are patched on first boot as a safety net

          Built-in shunt presets:

          - PassWall and PassWall2 both include a user-facing "分流总节点" preset
          - WeChat / QQ / Tencent media and forced-direct rules default to direct
          - Other service rules are preloaded but do not contain personal node IDs
          - User node selections and edited rules are preserved across retained online upgrades
          - No UU-specific rule, menu, runtime, or updater is included

          Online-updatable network applications:

          - PassWall proxy routing
          - SmartDNS DNS acceleration
          - PassWall2 proxy routing
          - AdGuard Home
          - Updates come from the DoorNet2 OPKG feed built by this workflow
          - Kernel/kmod packages are never selected by the component updater

          SHA256:

          ${SHA256}
          EOF


          ls -lah

          cat version.json


      # ============================================================
      # 18. Prepare OPKG feed
      # ============================================================

      - name: Prepare OPKG feed
        run: |
          set -e

          rm -rf ./artifact/opkg-feed

          mkdir -p \
            ./artifact/opkg-feed/packages \
            ./artifact/opkg-feed/targets/rockchip/armv8

          cp -a \
            ./bin/packages/. \
            ./artifact/opkg-feed/packages/


          if [ -d "./bin/targets/rockchip/armv8/packages" ]; then

              cp -a \
                ./bin/targets/rockchip/armv8/packages \
                ./artifact/opkg-feed/targets/rockchip/armv8/

          else

              echo "ERROR: target package directory missing"
              exit 1

          fi


          cat > ./artifact/opkg-feed/README.md <<EOF
          # DoorNet2 OPKG Feed

          Version:
          ${DOORNET2_VERSION}

          Target:
          rockchip/armv8

          Architecture:
          aarch64_generic
          EOF


          COUNT="$(
            find ./artifact/opkg-feed \
              -type f \
              -name "Packages.gz" \
            | wc -l
          )"


          if [ "$COUNT" -lt 2 ]; then

              echo "ERROR: OPKG indexes missing"
              exit 1

          fi


      # ============================================================
      # 19. Upload artifacts
      # ============================================================

      - name: Upload buildinfo
        uses: actions/upload-artifact@v4
        with:
          name: DoorNet2_buildinfo
          path: ./artifact/buildinfo/
          retention-days: 30


      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: DoorNet2_packages
          path: ./artifact/package/
          retention-days: 30


      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: DoorNet2_firmware
          path: ./artifact/firmware/
          retention-days: 30


      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: DoorNet2_release
          path: ./artifact/release/
          retention-days: 30


      - name: Upload OPKG feed backup
        uses: actions/upload-artifact@v4
        with:
          name: DoorNet2_opkg_feed
          path: ./artifact/opkg-feed/
          retention-days: 30


      # ============================================================
      # 20. Publish OPKG
      # ============================================================

      - name: Publish OPKG feed
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -e

          rm -rf /tmp/doornet2-opkg-feed

          git clone \
            --depth 1 \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            /tmp/doornet2-opkg-feed

          cd /tmp/doornet2-opkg-feed

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout \
            --orphan \
            opkg-feed-new

          git rm -rf . \
            >/dev/null 2>&1 || true

          cp -a \
            "${GITHUB_WORKSPACE}/artifact/opkg-feed/." \
            .

          git add -A

          git commit \
            -m "Update DoorNet2 OPKG feed ${DOORNET2_VERSION}"

          git branch -M opkg-feed

          git push \
            --force \
            origin \
            opkg-feed


      # ============================================================
      # 21. Publish firmware release
      # ============================================================

      - name: Publish firmware release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          if gh release view \
            "${DOORNET2_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            >/dev/null 2>&1
          then

              gh release upload \
                "${DOORNET2_TAG}" \
                "${GITHUB_WORKSPACE}/artifact/release/DoorNet2-ext4-sysupgrade.img.gz" \
                "${GITHUB_WORKSPACE}/artifact/release/sha256sums.txt" \
                "${GITHUB_WORKSPACE}/artifact/release/version.json" \
                "${GITHUB_WORKSPACE}/artifact/release/release-notes.md" \
                --repo "${GITHUB_REPOSITORY}" \
                --clobber

              gh release edit \
                "${DOORNET2_TAG}" \
                --repo "${GITHUB_REPOSITORY}" \
                --title "DoorNet2 ${DOORNET2_VERSION}" \
                --notes-file \
                "${GITHUB_WORKSPACE}/artifact/release/release-notes.md"

          else

              gh release create \
                "${DOORNET2_TAG}" \
                "${GITHUB_WORKSPACE}/artifact/release/DoorNet2-ext4-sysupgrade.img.gz" \
                "${GITHUB_WORKSPACE}/artifact/release/sha256sums.txt" \
                "${GITHUB_WORKSPACE}/artifact/release/version.json" \
                "${GITHUB_WORKSPACE}/artifact/release/release-notes.md" \
                --repo "${GITHUB_REPOSITORY}" \
                --target "${GITHUB_SHA}" \
                --title "DoorNet2 ${DOORNET2_VERSION}" \
                --notes-file \
                "${GITHUB_WORKSPACE}/artifact/release/release-notes.md"

          fi


      # ============================================================
      # 22. Final verification
      # ============================================================

      - name: Final build verification
        run: |
          set -e

          echo "========================================"
          echo "DoorNet2 Final v2.1: user-managed apps + keep-config online upgrade build finished"
          echo "========================================"

          echo
          echo "VERSION:"
          echo "${DOORNET2_VERSION}"

          echo
          echo "===== RELEASE ====="
          cat files/etc/doornet2_release


          echo
          echo "===== BOOT SCRIPT ====="

          grep -nE \
            'Trying TF|Trying eMMC|mmcblk0p2|mmcblk1p2' \
            target/linux/rockchip/image/doornet2.bootscript


          echo
          echo "===== DTS MMC ALIASES ====="

          DTS_FILE="$(
            find target/linux/rockchip \
              -type f \
              -name '*.dts' \
              -print \
            | grep -Ei 'doornet2|door-net2' \
            | head -n 1
          )"

          if [ -z "$DTS_FILE" ]; then

              DTS_FILE="$(
                grep -RIl \
                  --include='*.dts' \
                  'DOORNET2_R18_FIXED_MMC_ALIASES' \
                  target/linux/rockchip \
                  | head -n 1
              )"

          fi


          test -n "$DTS_FILE"

          grep -nE \
            'DOORNET2_R18_FIXED_MMC_ALIASES|mmc0.*sdmmc|mmc1.*sdhci' \
            "$DTS_FILE"


          grep -qE \
            'mmc0[[:space:]]*=[[:space:]]*&sdmmc' \
            "$DTS_FILE"

          grep -qE \
            'mmc1[[:space:]]*=[[:space:]]*&sdhci' \
            "$DTS_FILE"


          echo
          echo "===== UPDATER ====="

          sh -n files/usr/bin/doornet2-updater

          grep -nE \
            'fe320000.mmc|fe330000.mmc|verify_mmc_host_layout|verify_sysupgrade_target' \
            files/usr/bin/doornet2-updater


          echo
          echo "===== TF CAPACITY PRESERVE ====="

          PLATFORM="target/linux/rockchip/armv8/base-files/lib/upgrade/platform.sh"

          sh -n "$PLATFORM"

          grep -nE \
            'DOORNET2_R21_TF_CAPACITY_PRESERVE_V1|RAMFS_COPY_BIN|doornet2_tf_can_preserve_partitions|doornet2_tf_grow_ext4|fe320000.mmc|e2fsck|resize2fs' \
            "$PLATFORM"

          grep -q \
            'DOORNET2_R21_TF_CAPACITY_PRESERVE_V1' \
            "$PLATFORM"

          grep -q \
            "DOORNET2_TF_CAPACITY='preserve-expanded-root-v1'" \
            files/etc/doornet2_release


          echo
          echo "===== PASSWALL ====="

          grep -q \
            "DOORNET2_PASSWALL='passwall-passwall2-xray-shunt-v3'" \
            files/etc/doornet2_release

          grep -q '^CONFIG_PACKAGE_luci-app-passwall=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-i18n-passwall-zh-cn=y$' .config
          grep -q '^CONFIG_PACKAGE_dnsmasq-full=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-app-passwall_Iptables_Transparent_Proxy=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-app-passwall2=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-app-passwall2_Iptables_Transparent_Proxy=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Xray=y$' .config
          grep -q '^# CONFIG_PACKAGE_luci-app-passwall_INCLUDE_SingBox is not set$' .config
          grep -q '^# CONFIG_PACKAGE_luci-app-passwall_INCLUDE_V2ray_Plugin is not set$' .config

          if grep -q '^CONFIG_PACKAGE_sing-box=y$' .config; then
              echo 'ERROR: incompatible sing-box unexpectedly selected in final config.'
              exit 1
          fi

          if grep -q '^CONFIG_PACKAGE_v2ray-plugin=y$' .config; then
              echo 'ERROR: incompatible v2ray-plugin unexpectedly selected in final config.'
              exit 1
          fi

          XRAY_MK="feeds/passwall_packages/xray-core/Makefile"
          grep -q '^PKG_VERSION:=25\.1\.30$' "$XRAY_MK"
          grep -q '^PKG_HASH:=983ee395f085ed1b7fbe0152cb56a5b605a6f70a5645d427c7186c476f14894e$' "$XRAY_MK"
          grep -q '\$(GO_PKG)/core.build=OpenWrt' "$XRAY_MK"

          if grep -q 'core.version=\$(PKG_VERSION)' "$XRAY_MK"; then
              echo 'ERROR: incompatible Xray core.version ldflag present in final tree.'
              exit 1
          fi

          test -f feeds/passwall_luci/luci-app-passwall/Makefile
          test -d feeds/passwall_packages
          test -x files/usr/bin/doornet2-passwall-updater
          sh -n files/usr/bin/doornet2-passwall-updater

          grep -q 'doornet2_passwall_luci' files/etc/opkg/distfeeds.conf
          grep -q 'doornet2_passwall_packages' files/etc/opkg/distfeeds.conf

          echo
          echo "===== PASSWALL2 + ONLINE NETWORK APPS ====="

          grep -q \
            "DOORNET2_NETWORK_APPS='passwall-passwall2-smartdns-adguard-user-managed-shunt-v5'" \
            files/etc/doornet2_release

          grep -q '^CONFIG_PACKAGE_luci-app-passwall2=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-i18n-passwall2-zh-cn=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-app-passwall2_Basic_Core_Xray=y$' .config
          grep -q '^# CONFIG_PACKAGE_luci-app-passwall2_Basic_Core_All is not set$' .config
          grep -q '^# CONFIG_PACKAGE_luci-app-passwall2_Basic_Core_SingBox is not set$' .config

          test -f feeds/passwall2_luci/luci-app-passwall2/Makefile
          grep -q 'doornet2_passwall2_luci' files/etc/opkg/distfeeds.conf

          PASSWALL2_IPK="$(
            find ./bin \
              -type f \
              -name 'luci-app-passwall2_*.ipk' \
              -print \
              | head -n 1
          )"

          if [ -z "$PASSWALL2_IPK" ]; then
              echo "ERROR: PassWall2 IPK was not generated."
              exit 1
          fi

          echo "PassWall2 package: $PASSWALL2_IPK"

          grep -q '^CONFIG_PACKAGE_smartdns=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-app-smartdns=y$' .config
          grep -q '^CONFIG_PACKAGE_adguardhome=y$' .config

          test -x files/usr/bin/doornet2-app-updater
          sh -n files/usr/bin/doornet2-app-updater

          test -x files/etc/uci-defaults/zzzb-doornet2-network-apps
          test -f files/lib/upgrade/keep.d/doornet2-user-network-config
          sh -n files/etc/uci-defaults/zzzb-doornet2-network-apps
          test -x files/etc/uci-defaults/zzza-doornet2-shunt-presets
          sh -n files/etc/uci-defaults/zzza-doornet2-shunt-presets
          grep -q 'seed_config passwall' files/etc/uci-defaults/zzza-doornet2-shunt-presets
          grep -q 'seed_config passwall2' files/etc/uci-defaults/zzza-doornet2-shunt-presets
          grep -q 'remarks=分流总节点' files/etc/uci-defaults/zzza-doornet2-shunt-presets

          grep -q '/etc/config/passwall' files/lib/upgrade/keep.d/doornet2-user-network-config
          grep -q '/etc/config/passwall2' files/lib/upgrade/keep.d/doornet2-user-network-config
          grep -q '/etc/config/smartdns' files/lib/upgrade/keep.d/doornet2-user-network-config
          grep -q '/etc/adguardhome.yaml' files/lib/upgrade/keep.d/doornet2-user-network-config
          grep -q '/etc/config/dhcp' files/lib/upgrade/keep.d/doornet2-user-network-config
          grep -q '/etc/doornet2-shunt-presets-v1' files/lib/upgrade/keep.d/doornet2-user-network-config

          grep -nE \
            'luci-app-passwall2|smartdns|adguardhome|luci-app-smartdns' \
            .config \
            | head -60

          if grep -Eq '^CONFIG_PACKAGE_.*(uugamebooster|uuplugin).*=y$' .config; then
              echo "ERROR: UU accelerator unexpectedly selected in final config."
              exit 1
          fi

          if grep -RniE 'uugamebooster|uuplugin|网易[[:space:]]*UU|NetEase[[:space:]]+UU' files 2>/dev/null; then
              echo "ERROR: UU runtime/menu/autostart/update content exists in final overlay."
              exit 1
          fi

          if grep -RniE 'router\.uu\.163\.com|uu\.gdl\.netease\.com|uurouter\.gdl\.netease\.com' files 2>/dev/null; then
              echo "ERROR: UU-specific domain exists in final overlay."
              exit 1
          fi

          echo "UU accelerator runtime content: absent (OK)"

          echo
          echo "===== R34 DESIGN + QUICKSTART UI ====="

          grep -q \
            "DOORNET2_UI='quickstart-design-dark-v1'" \
            files/etc/doornet2_release

          grep -q '^CONFIG_PACKAGE_quickstart=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-app-quickstart=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-theme-design=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-theme-argon=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-app-argon-config=y$' .config

          test -f feeds/nas/network/services/quickstart/Makefile
          test -f feeds/nas_luci/luci/luci-app-quickstart/Makefile
          test -f package/lean/luci-theme-design/Makefile
          test -f package/lean/luci-theme-design/luasrc/view/themes/design/header.htm
          test -f package/lean/luci-theme-design/htdocs/luci-static/design/css/style.css

          grep -q '/cgi-bin/luci/admin/quickstart/' \
            package/lean/luci-theme-design/luasrc/view/themes/design/header.htm

          test -x files/etc/uci-defaults/95-doornet2-ui
          grep -q "mediaurlbase='/luci-static/design'" \
            files/etc/uci-defaults/95-doornet2-ui

          test -f files/etc/config/design
          grep -q "option mode 'dark'" files/etc/config/design
          grep -q "option navbar_proxy 'passwall'" files/etc/config/design

          DESIGN_IPK="$(
            find ./bin \
              -type f \
              -name 'luci-theme-design_*.ipk' \
              -print \
              | head -n 1
          )"

          if [ -z "$DESIGN_IPK" ]; then
              echo "ERROR: luci-theme-design IPK was not generated."
              exit 1
          fi

          echo "Design package: $DESIGN_IPK"

          ROOT_DESIGN_HEADER="$(
            find build_dir \
              -type f \
              -path '*/root-*/usr/lib/lua/luci/view/themes/design/header.htm' \
              -print \
              | head -n 1
          )"

          if [ -z "$ROOT_DESIGN_HEADER" ]; then
              echo "ERROR: installed Design header not found in build root."
              exit 1
          fi

          echo "Installed Design header: $ROOT_DESIGN_HEADER"

          # R33 demonstrated an important packaging detail:
          # luci-theme-design installs a fresh header into rootfs, so it may not
          # contain our source-tree injection yet. That is expected. What must
          # be true is:
          #   1. the real installed header is present and patchable;
          #   2. the runtime CSS/JS are present in the real rootfs;
          #   3. the first-boot fixer is present in the real rootfs;
          #   4. the fixer can transform a copy of the installed header.
          grep -q '</head>' "$ROOT_DESIGN_HEADER"

          ROOT_DESIGN_CSS="$(
            find build_dir \
              -type f \
              -path '*/root-*/www/luci-static/design/css/style.css' \
              -print \
              | head -n 1
          )"

          if [ -z "$ROOT_DESIGN_CSS" ]; then
              echo "ERROR: installed Design static CSS not found in build root."
              exit 1
          fi

          echo "Installed Design CSS: $ROOT_DESIGN_CSS"

          ROOT_RUNTIME_CSS="$(
            find build_dir \
              -type f \
              -path '*/root-*/www/luci-static/doornet2/runtime-monitor.css' \
              -print \
              | head -n 1
          )"

          ROOT_RUNTIME_JS="$(
            find build_dir \
              -type f \
              -path '*/root-*/www/luci-static/doornet2/runtime-monitor.js' \
              -print \
              | head -n 1
          )"

          ROOT_HEADER_FIX="$(
            find build_dir \
              -type f \
              -path '*/root-*/etc/uci-defaults/99-doornet2-runtime-header-fix' \
              -print \
              | head -n 1
          )"

          ROOT_UI_DEFAULT="$(
            find build_dir \
              -type f \
              -path '*/root-*/etc/uci-defaults/95-doornet2-ui' \
              -print \
              | head -n 1
          )"

          test -n "$ROOT_RUNTIME_CSS"
          test -n "$ROOT_RUNTIME_JS"
          test -n "$ROOT_HEADER_FIX"
          test -n "$ROOT_UI_DEFAULT"

          echo "Installed runtime CSS: $ROOT_RUNTIME_CSS"
          echo "Installed runtime JS : $ROOT_RUNTIME_JS"
          echo "Installed header fix : $ROOT_HEADER_FIX"
          echo "Installed UI default : $ROOT_UI_DEFAULT"

          grep -q '#dn-runtime-monitor' "$ROOT_RUNTIME_CSS"
          grep -q 'doornet2_runtime' "$ROOT_RUNTIME_JS"

          sh -n "$ROOT_HEADER_FIX"
          grep -q 'themes/design/header.htm' "$ROOT_HEADER_FIX"
          grep -q 'runtime-monitor.css' "$ROOT_HEADER_FIX"
          grep -q 'runtime-monitor.js' "$ROOT_HEADER_FIX"
          grep -q '/cgi-bin/luci/admin/quickstart/' "$ROOT_HEADER_FIX"

          sh -n "$ROOT_UI_DEFAULT"
          grep -q "mediaurlbase='/luci-static/design'" "$ROOT_UI_DEFAULT"

          echo "===== SIMULATE FIRST-BOOT DESIGN HEADER PATCH ====="

          TMP_DESIGN_HEADER="$(mktemp)"
          cp -f "$ROOT_DESIGN_HEADER" "$TMP_DESIGN_HEADER"

          TEST_CSS='<link rel="stylesheet" href="/luci-static/doornet2/runtime-monitor.css">'
          TEST_JS='<script defer src="/luci-static/doornet2/runtime-monitor.js"></script>'

          if ! grep -q 'runtime-monitor.css' "$TMP_DESIGN_HEADER"; then
              sed -i "\|</head>|i\\$TEST_CSS" "$TMP_DESIGN_HEADER"
          fi

          if ! grep -q 'runtime-monitor.js' "$TMP_DESIGN_HEADER"; then
              sed -i "\|</head>|i\\$TEST_JS" "$TMP_DESIGN_HEADER"
          fi

          sed -i \
            's#/cgi-bin/luci/admin/status/overview#/cgi-bin/luci/admin/quickstart/#g' \
            "$TMP_DESIGN_HEADER"

          grep -q 'runtime-monitor.css' "$TMP_DESIGN_HEADER"
          grep -q 'runtime-monitor.js' "$TMP_DESIGN_HEADER"

          rm -f "$TMP_DESIGN_HEADER"

          echo "Installed Design header is patchable; first-boot fix verified (OK)"


          echo
          echo "===== R34 RUNTIME MONITOR ====="

          grep -q \
            "DOORNET2_RUNTIME_MONITOR='thermal-time-v2'" \
            files/etc/doornet2_release

          grep -q '^# CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Geoview is not set$' .config
          grep -q '^# CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Shadowsocks_Rust_Client is not set$' .config
          grep -q '^# CONFIG_PACKAGE_luci-app-passwall_INCLUDE_ShadowsocksR_Libev_Client is not set$' .config
          ! grep -Eq '^CONFIG_PACKAGE_shadowsocks-rust-.*=y$' .config
          ! grep -Eq '^CONFIG_PACKAGE_shadowsocksr-libev.*=y$' .config

          test -x files/usr/bin/doornet2-runtime-status
          sh -n files/usr/bin/doornet2-runtime-status

          test -s files/usr/lib/lua/luci/controller/doornet2_runtime.lua
          grep -q 'doornet2_runtime' \
            files/usr/lib/lua/luci/controller/doornet2_runtime.lua

          test -s files/www/luci-static/doornet2/runtime-monitor.js
          grep -q 'doornet2_runtime' \
            files/www/luci-static/doornet2/runtime-monitor.js

          test -s files/www/luci-static/doornet2/runtime-monitor.css
          grep -q '#dn-runtime-monitor' \
            files/www/luci-static/doornet2/runtime-monitor.css

          grep -q 'runtime-monitor.css' \
            package/lean/luci-theme-design/luasrc/view/themes/design/header.htm
          grep -q 'runtime-monitor.js' \
            package/lean/luci-theme-design/luasrc/view/themes/design/header.htm

          test -x files/etc/uci-defaults/99-doornet2-runtime-header-fix
          sh -n files/etc/uci-defaults/99-doornet2-runtime-header-fix

          test -x files/etc/uci-defaults/98-doornet2-time
          sh -n files/etc/uci-defaults/98-doornet2-time
          grep -q "zonename='Asia/Shanghai'" \
            files/etc/uci-defaults/98-doornet2-time


          echo
          echo "===== EXTROOT ====="

          cat files/etc/config/fstab

          if grep -Eq \
            "option[[:space:]]+target[[:space:]]+['\"]?/['\"]?" \
            files/etc/config/fstab
          then

              echo "ERROR: extroot found"
              exit 1

          fi


          echo
          echo "===== RELEASE FILES ====="

          ls -lah ./artifact/release/


          echo
          echo "========================================"
          echo "DOORNET2 FINAL V2.7 + PROVEN R4 BOOT BASE + PASSWALL2 + NO-UU + TF-FIRST SUCCESS"
          echo "========================================"
