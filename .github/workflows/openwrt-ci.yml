          function request(path, method, callback)
          {
              var xhr = new XMLHttpRequest();

              xhr.open(
                  method,
                  BASE + "/" + path,
                  true
              );

              if (method == "POST")
              {
                  xhr.setRequestHeader(
                      "Content-Type",
                      "application/x-www-form-urlencoded"
                  );
              }

              xhr.onreadystatechange =
                  function()
                  {
                      if (xhr.readyState != 4)
                          return;

                      var data;

                      try
                      {
                          data =
                              JSON.parse(
                                  xhr.responseText
                              );
                      }
                      catch (e)
                      {
                          callback(
                              {
                                  ok: false,
                                  message:
                                      "返回数据解析失败"
                              }
                          );

                          return;
                      }

                      callback(data);
