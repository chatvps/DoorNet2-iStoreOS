name: DoorNet2 iStoreOS Final Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_openwrt:
    name: Build DoorNet2 RK3399 OpenWrt
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix executable permissions
        run: |
          chmod -R +x scripts || true
          find . -type f \( -name "*.sh" -o -name "*.pl" -o -name "config.guess" -o -name "command_all.sh" \) -exec chmod +x {} \; || true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison gawk gettext git \
            libncurses-dev libssl-dev python3 python3-pip \
            rsync unzip wget zstd cmake ninja-build
          pip3 install pyelftools

      - name: Update feeds
        run: |
          chmod +x ./scripts/feeds
          ./scripts/feeds update -a
          ./scripts/feeds install -a -f

      - name: Fix Rust 1.80 LLVM bootstrap
        run: |
          set -e
          RUST_MK="feeds/packages/lang/rust/Makefile"
          test -f "$RUST_MK"

          sed -i 's/--set=llvm\.download-ci-llvm=true/--set=llvm.download-ci-llvm=false/g' "$RUST_MK"

          if ! grep -q -- '--set=llvm.download-ci-llvm=false' "$RUST_MK"; then
            echo "ERROR: Rust Makefile was not patched to disable CI LLVM downloads."
            grep -n 'download-ci-llvm' "$RUST_MK" || true
            exit 1
          fi

          echo "Rust LLVM bootstrap setting:"
          grep -n 'download-ci-llvm' "$RUST_MK"

      - name: Patch PassWall2 geoview hard dependency
        run: |
          set -e

          echo "Searching for luci-app-passwall2 Makefile..."
          mapfile -t PW2_MKS < <(find feeds package -path '*/luci-app-passwall2/Makefile' -type f -o -path '*/luci-app-passwall2/Makefile' -type l 2>/dev/null | sort -u)

          if [ "${#PW2_MKS[@]}" -eq 0 ]; then
            echo "INFO: luci-app-passwall2 Makefile is not present in this simplified source tree."
          else
            for mk in "${PW2_MKS[@]}"; do
              real_mk="$(readlink -f "$mk" || true)"
              [ -n "$real_mk" ] || real_mk="$mk"
              echo "Patching: $real_mk"
              sed -i -E 's/(^|[[:space:]])\+geoview([[:space:]]|$)/\1\2/g' "$real_mk"
              if grep -Eq '(^|[[:space:]])\+geoview([[:space:]]|$)' "$real_mk"; then
                echo "ERROR: PassWall2 still has a hard +geoview dependency: $real_mk"
                grep -n 'geoview' "$real_mk" || true
                exit 1
              fi
            done
          fi

      - name: Load DoorNet2 config and sanitize package selection
        run: |
          set -e

          if [ -f config/doorNet2.config ]; then
            cp config/doorNet2.config .config
            echo "Loaded config/doorNet2.config"
          elif [ -f config/doornet2.config ]; then
            cp config/doornet2.config .config
            echo "Loaded config/doornet2.config"
          else
            echo "ERROR: DoorNet2 config not found."
            exit 1
          fi

          disable_config() {
            local sym="$1"
            sed -i \
              -e "/^${sym}=/d" \
              -e "/^# ${sym} is not set$/d" \
              .config
            echo "# ${sym} is not set" >> .config
          }

          # Known incompatible / currently unnecessary packages.
          # Disable both the package symbols and the PassWall selectors that
          # would otherwise re-select them during make defconfig on aarch64.
          disable_config CONFIG_PACKAGE_geoview
          disable_config CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Geoview

          disable_config CONFIG_PACKAGE_v2ray-plugin
          disable_config CONFIG_PACKAGE_luci-app-passwall_INCLUDE_V2ray_Plugin
          disable_config CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_V2ray_Plugin

          disable_config CONFIG_PACKAGE_shadowsocks-rust
          disable_config CONFIG_PACKAGE_shadowsocks-rust-sslocal
          disable_config CONFIG_PACKAGE_shadowsocks-rust-ssserver
          disable_config CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Shadowsocks_Rust_Client
          disable_config CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Shadowsocks_Rust_Server
          disable_config CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_Shadowsocks_Rust_Client
          disable_config CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_Shadowsocks_Rust_Server

          # Disable ShadowsocksR Libev at both PassWall selector level and
          # package/subpackage level.  The previous CONFIG_PACKAGE_shadowsocksr-libev=n
          # alone did not stop the selected ssr-local/ssr-redir subpackages.
          disable_config CONFIG_PACKAGE_luci-app-passwall_INCLUDE_ShadowsocksR_Libev_Client
          disable_config CONFIG_PACKAGE_luci-app-passwall_INCLUDE_ShadowsocksR_Libev_Server
          disable_config CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_ShadowsocksR_Libev_Client
          disable_config CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_ShadowsocksR_Libev_Server
          disable_config CONFIG_PACKAGE_shadowsocksr-libev
          disable_config CONFIG_PACKAGE_shadowsocksr-libev-ssr-local
          disable_config CONFIG_PACKAGE_shadowsocksr-libev-ssr-redir
          disable_config CONFIG_PACKAGE_shadowsocksr-libev-ssr-server

          # DoorNet2 final image must not contain UU accelerator components.
          disable_config CONFIG_PACKAGE_luci-app-uugamebooster
          disable_config CONFIG_PACKAGE_uugamebooster
          disable_config CONFIG_PACKAGE_luci-app-uuplugin
          disable_config CONFIG_PACKAGE_uuplugin

          # IMPORTANT: normalize the config only after all edits.
          make defconfig

      - name: Preflight DoorNet2 dependency and target checks
        run: |
          set -e

          echo "========== TARGET =========="
          grep '^CONFIG_TARGET_.*=y' .config || true

          if grep -Eq '^CONFIG_TARGET_x86(_64)?=y' .config; then
            echo "ERROR: x86 target detected. This build must be DoorNet2 RK3399."
            exit 1
          fi

          if ! grep -q '^CONFIG_TARGET_rockchip=y' .config; then
            echo "ERROR: rockchip target is not selected."
            exit 1
          fi

          echo "========== REQUIRED FEATURE STATUS =========="
          for sym in \
            CONFIG_PACKAGE_luci-app-passwall \
            CONFIG_PACKAGE_luci-app-passwall2 \
            CONFIG_PACKAGE_xray-core \
            CONFIG_PACKAGE_luci-app-store \
            CONFIG_PACKAGE_adguardhome \
            CONFIG_PACKAGE_smartdns \
            CONFIG_PACKAGE_luci-app-smartdns; do
            if grep -q "^${sym}=y" .config; then
              echo "OK: ${sym}=y"
            else
              echo "INFO: ${sym} is not =y in this simplified build config"
            fi
          done

          echo "========== DISABLED PACKAGE CHECK =========="
          grep -E 'geoview|V2ray_Plugin|v2ray-plugin|Shadowsocks_Rust|shadowsocks-rust|ShadowsocksR_Libev|shadowsocksr-libev|uugamebooster|uuplugin' .config || true

          if grep -q '^CONFIG_PACKAGE_geoview=y' .config; then
            echo "ERROR: geoview was re-selected after make defconfig."
            echo "Check PassWall INCLUDE_Geoview or a PassWall2 hard dependency."
            exit 1
          fi

          if grep -Eq '^CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Geoview=y' .config; then
            echo "ERROR: PassWall Geoview selector is still enabled."
            exit 1
          fi

          if grep -Eq '^CONFIG_PACKAGE_(v2ray-plugin|shadowsocks-rust-sslocal|shadowsocks-rust-ssserver)=y' .config; then
            echo "ERROR: a known incompatible PassWall component was re-selected."
            grep -E '^CONFIG_PACKAGE_(v2ray-plugin|shadowsocks-rust-sslocal|shadowsocks-rust-ssserver)=y' .config || true
            exit 1
          fi

          if grep -Eq '^CONFIG_PACKAGE_luci-app-passwall2?_INCLUDE_(V2ray_Plugin|Shadowsocks_Rust_Client|Shadowsocks_Rust_Server)=y' .config; then
            echo "ERROR: PassWall/PassWall2 selector re-enabled v2ray-plugin or shadowsocks-rust."
            exit 1
          fi

          if grep -Eq '^CONFIG_PACKAGE_shadowsocksr-libev(-ssr-local|-ssr-redir|-ssr-server)?=y' .config; then
            echo "ERROR: shadowsocksr-libev is still selected after make defconfig."
            exit 1
          fi

          if grep -Eq '^CONFIG_PACKAGE_luci-app-passwall2?_INCLUDE_ShadowsocksR_Libev_(Client|Server)=y' .config; then
            echo "ERROR: PassWall/PassWall2 ShadowsocksR Libev selector is still enabled."
            exit 1
          fi

          if grep -Eq '^CONFIG_PACKAGE_.*(uugamebooster|uuplugin).*=y' .config; then
            echo "ERROR: UU accelerator component is selected."
            exit 1
          fi

          echo "OK: target/config preflight passed."

      - name: Show PassWall dependency references
        run: |
          echo "========== geoview references =========="
          grep -Rni --include='Makefile' 'geoview' feeds/passwall* package 2>/dev/null | head -100 || true

          echo "========== Rust / V2ray plugin references =========="
          grep -Rni --include='Makefile' -E 'Shadowsocks_Rust|shadowsocks-rust|V2ray_Plugin|v2ray-plugin' feeds/passwall* package 2>/dev/null | head -150 || true

          echo "========== ShadowsocksR Libev references =========="
          grep -Rni --include='Makefile' -E 'ShadowsocksR_Libev|shadowsocksr-libev' feeds/passwall* package 2>/dev/null | head -150 || true

      - name: Build firmware
        run: |
          make -j$(nproc) || make -j1 V=s

      - name: Collect firmware
        run: |
          mkdir -p release
          find bin/targets -type f \( -name '*.img*' -o -name '*.bin' -o -name '*.gz' \) -exec cp {} release/ \; || true

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: DoorNet2-iStoreOS-firmware
          path: release/
