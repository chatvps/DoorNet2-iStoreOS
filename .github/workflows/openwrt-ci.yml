name: DoorNet2 iStoreOS Final Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_openwrt:
    name: Build DoorNet2 RK3399 OpenWrt
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix executable permissions
        run: |
          chmod -R +x scripts || true
          find . -type f \( -name "*.sh" -o -name "*.pl" -o -name "config.guess" -o -name "command_all.sh" \) -exec chmod +x {} \; || true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison gawk gettext git libncurses-dev libssl-dev python3 python3-pip rsync unzip wget zstd cmake ninja-build
          pip3 install pyelftools

      - name: Update feeds
        run: |
          chmod +x ./scripts/feeds
          ./scripts/feeds update -a
          ./scripts/feeds install -a -f


      - name: Fix Rust 1.80 LLVM bootstrap
        run: |
          set -e
          RUST_MK="feeds/packages/lang/rust/Makefile"
          test -f "$RUST_MK"

          sed -i 's/--set=llvm\.download-ci-llvm=true/--set=llvm.download-ci-llvm=false/g' "$RUST_MK"

          if ! grep -q -- '--set=llvm.download-ci-llvm=false' "$RUST_MK"; then
            echo "ERROR: Rust Makefile was not patched to disable CI LLVM downloads."
            grep -n 'download-ci-llvm' "$RUST_MK" || true
            exit 1
          fi

          echo "Rust LLVM bootstrap setting:"
          grep -n 'download-ci-llvm' "$RUST_MK"

      - name: Load config and disable incompatible packages
        run: |
          if [ -f config/doorNet2.config ]; then
            cp config/doorNet2.config .config
          elif [ -f config/doornet2.config ]; then
            cp config/doornet2.config .config
          fi

          echo "CONFIG_PACKAGE_geoview=n" >> .config
          echo "CONFIG_PACKAGE_v2ray-plugin=n" >> .config
          echo "CONFIG_PACKAGE_shadowsocks-rust=n" >> .config
          echo "CONFIG_PACKAGE_shadowsocksr-libev=n" >> .config

          make defconfig


      - name: Force disable incompatible packages in config
        run: |
          for p in geoview v2ray-plugin shadowsocks-rust shadowsocksr-libev; do
            echo "CONFIG_PACKAGE_${p}=n" >> .config
          done

          sed -i '/CONFIG_PACKAGE_geoview=/d' .config
          sed -i '/CONFIG_PACKAGE_v2ray-plugin=/d' .config
          sed -i '/CONFIG_PACKAGE_shadowsocks-rust=/d' .config
          sed -i '/CONFIG_PACKAGE_shadowsocksr-libev=/d' .config

          echo "CONFIG_PACKAGE_geoview=n" >> .config
          echo "CONFIG_PACKAGE_v2ray-plugin=n" >> .config
          echo "CONFIG_PACKAGE_shadowsocks-rust=n" >> .config
          echo "CONFIG_PACKAGE_shadowsocksr-libev=n" >> .config

      - name: Build firmware
        run: |
          make -j$(nproc) || make -j1 V=s

      - name: Collect firmware
        run: |
          mkdir -p release
          find bin/targets -type f \( -name '*.img*' -o -name '*.bin' -o -name '*.gz' \) -exec cp {} release/ \; || true

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: DoorNet2-iStoreOS-firmware
          path: release/
