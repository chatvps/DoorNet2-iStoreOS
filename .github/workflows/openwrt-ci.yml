name: DoorNet2-OpenWrt-iStore-R4-V5.3.4-Final-Solidified-NoUU-Argon181-IPv6Fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_openwrt:
    name: Build DoorNet2 OpenWrt Firmware
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. Build environment
      # ============================================================

      - name: Space cleanup and Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -e

          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            2>/dev/null || true

          docker system prune -af 2>/dev/null || true

          sudo apt-get update

          sudo apt-get install -y --no-install-recommends \
            ack \
            antlr3 \
            asciidoc \
            autoconf \
            automake \
            autopoint \
            binutils \
            bison \
            build-essential \
            bzip2 \
            ccache \
            clang \
            cmake \
            cpio \
            curl \
            device-tree-compiler \
            flex \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            genisoimage \
            git \
            gperf \
            haveged \
            help2man \
            intltool \
            libc6-dev-i386 \
            libelf-dev \
            libfuse-dev \
            libglib2.0-dev \
            libgmp3-dev \
            libltdl-dev \
            libmpc-dev \
            libmpfr-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libpython3-dev \
            libreadline-dev \
            libssl-dev \
            libtool \
            llvm \
            lrzsz \
            msmtp \
            ninja-build \
            p7zip \
            p7zip-full \
            patch \
            pkgconf \
            python3 \
            python3-pyelftools \
            python3-setuptools \
            qemu-utils \
            rsync \
            scons \
            squashfs-tools \
            subversion \
            swig \
            texinfo \
            uglifyjs \
            upx-ucl \
            unzip \
            vim \
            wget \
            xmlto \
            xxd \
            zlib1g-dev

          sudo apt-get clean
          sudo timedatectl set-timezone "Asia/Shanghai" || true

          df -h


      # ============================================================
      # 2. Checkout
      # ============================================================

      - name: Checkout OpenWrt
        uses: actions/checkout@v4


      - name: Remove insecure known default root password
        shell: bash
        run: |
          set -e

          # Upstream LEDE ships a uci-defaults hook that resets root to the
          # well-known password "password". DoorNet2 must preserve the
          # user's existing root credential instead.
          mapfile -t ROOTPW_FILES < <(
