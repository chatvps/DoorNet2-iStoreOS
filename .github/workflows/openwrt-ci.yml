      # ============================================================
      # 9A. R21 TF capacity preservation
      #
      # Keep the firmware image at 7 GiB so it still fits the
      # 7.3 GiB eMMC.
      #
      # When sysupgrade runs from an already-expanded TF card:
      #   1. Physically verify TF = SD = fe320000.mmc = mmcblk0
      #   2. Keep the existing large p2 partition table
      #   3. Write the new image into p1/p2 only
      #   4. Grow the new ext4 filesystem back to the existing p2 size
      #
      # eMMC keeps the original Rockchip upgrade behaviour.
      # ============================================================

      - name: Add DoorNet2 R21 TF capacity preserve
        run: |
          set -e

          PLATFORM="target/linux/rockchip/armv8/base-files/lib/upgrade/platform.sh"

          test -f "$PLATFORM"

          cp -f \
            "$PLATFORM" \
            "${PLATFORM}.upstream-r21-backup"

          cat > "$PLATFORM" <<'EOF'
          # DOORNET2_R21_TF_CAPACITY_PRESERVE_V1
          #
          # DoorNet2 TF capacity-preserving sysupgrade.
          #
          # Physical mapping after the R18 MMC alias fix:
          #   Linux mmcblk0 = TF   = SD  = fe320000.mmc
          #   Linux mmcblk1 = eMMC = MMC = fe330000.mmc
          #
          # The firmware image intentionally keeps a 7 GiB p2 so that
          # the same image also fits the 7.3 GiB eMMC.
          #
          # If TF p2 has already been expanded, preserve its partition
          # table and grow the newly-written ext4 filesystem to the
          # existing large p2 size from the sysupgrade RAMFS.

          RAMFS_COPY_BIN="$RAMFS_COPY_BIN /usr/sbin/e2fsck /usr/sbin/resize2fs"


          doornet2_is_tf_disk()
          {
              local diskdev="$1"
              local board
              local media
              local path

              [ "$diskdev" = "mmcblk0" ] || return 1

              [ -r /tmp/sysinfo/board_name ] || return 1

              board="$(
                  cat /tmp/sysinfo/board_name \
                      2>/dev/null
              )"

              [ "$board" = "embedfire,doornet2" ] || return 1

              [ -r "/sys/class/block/${diskdev}/device/type" ] \
                  || return 1

              media="$(
                  cat "/sys/class/block/${diskdev}/device/type" \
                      2>/dev/null
              )"

              [ "$media" = "SD" ] || return 1

              path="$(
                  /bin/busybox readlink -f \
                      "/sys/class/block/${diskdev}/device" \
                      2>/dev/null
              )"

              case "$path" in
                  *fe320000.mmc*)
                      return 0
                      ;;
                  *)
                      return 1
                      ;;
              esac
          }


          doornet2_tf_can_preserve_partitions()
          {
              local diskdev="$1"

              local boot1
              local image1
              local boot2
              local image2

              local boot2_start
              local boot2_size
              local image2_start
              local image2_size

              doornet2_is_tf_disk "$diskdev" || return 1

              [ -s /tmp/partmap.bootdisk ] || return 1
              [ -s /tmp/partmap.image ] || return 1

              #
              # DoorNet2 image must contain only p1 and p2.
              #
              if awk '$1 > 2 { found=1 } END { exit(found ? 0 : 1) }' \
                  /tmp/partmap.bootdisk
              then
                  return 1
              fi

              if awk '$1 > 2 { found=1 } END { exit(found ? 0 : 1) }' \
                  /tmp/partmap.image
              then
                  return 1
              fi

              boot1="$(
                  awk \
                      '$1 == 1 { print $2 ":" $3; exit }' \
                      /tmp/partmap.bootdisk
              )"

              image1="$(
                  awk \
                      '$1 == 1 { print $2 ":" $3; exit }' \
                      /tmp/partmap.image
              )"

              boot2="$(
                  awk \
                      '$1 == 2 { print $2 ":" $3; exit }' \
                      /tmp/partmap.bootdisk
              )"

              image2="$(
                  awk \
                      '$1 == 2 { print $2 ":" $3; exit }' \
                      /tmp/partmap.image
              )"

              [ -n "$boot1" ] || return 1
              [ -n "$image1" ] || return 1
              [ -n "$boot2" ] || return 1
              [ -n "$image2" ] || return 1

              #
              # p1 start + size must be identical.
              #
              [ "$boot1" = "$image1" ] || return 1

              boot2_start="${boot2%%:*}"
              boot2_size="${boot2##*:}"

              image2_start="${image2%%:*}"
              image2_size="${image2##*:}"

              #
              # p2 may differ ONLY by being larger.
              # The start sector must never move.
              #
              [ "$boot2_start" = "$image2_start" ] || return 1
              [ "$boot2_size" -gt "$image2_size" ] || return 1

              return 0
          }


          doornet2_tf_grow_ext4()
          {
              local diskdev="$1"
              local rootpart
              local rc

              doornet2_is_tf_disk "$diskdev" || return 1

              if ! export_partdevice rootpart 2; then
                  echo "DoorNet2: unable to locate TF root partition"
                  return 1
              fi

              echo "DoorNet2: checking /dev/${rootpart} before ext4 grow"

              /usr/sbin/e2fsck \
                  -f \
                  -y \
                  "/dev/${rootpart}"

              rc=$?

              case "$rc" in
                  0|1)
                      ;;
                  *)
                      echo "DoorNet2: e2fsck failed before grow, rc=${rc}"
                      return 1
                      ;;
              esac

              echo "DoorNet2: growing ext4 to current TF p2 size"

              if ! /usr/sbin/resize2fs \
                  "/dev/${rootpart}"
              then
                  echo "DoorNet2: resize2fs failed"
                  return 1
              fi

              echo "DoorNet2: checking /dev/${rootpart} after ext4 grow"

              /usr/sbin/e2fsck \
                  -f \
                  -y \
                  "/dev/${rootpart}"

              rc=$?

              case "$rc" in
                  0|1)
                      ;;
                  *)
                      echo "DoorNet2: e2fsck failed after grow, rc=${rc}"
                      return 1
                      ;;
              esac

              sync

              return 0
          }


          platform_check_image()
          {
              local diskdev
              local partdev
              local diff
              local preserve_tf=0

              export_bootdevice && \
              export_partdevice diskdev 0 || {
                  echo "Unable to determine upgrade device"
                  return 1
              }

              get_partitions \
                  "/dev/${diskdev}" \
                  bootdisk

              #
              # Extract the boot sector from the image.
              #
              get_image "$@" |
                  dd \
                      of=/tmp/image.bs \
                      count=1 \
                      bs=512b \
                      2>/dev/null

              get_partitions \
                  /tmp/image.bs \
                  image

              diff="$(
                  grep \
                      -F \
                      -x \
                      -v \
                      -f /tmp/partmap.bootdisk \
                      /tmp/partmap.image
              )"

              if [ -n "$diff" ] && \
                 doornet2_tf_can_preserve_partitions \
                     "$diskdev"
              then
                  preserve_tf=1
              fi

              rm -f \
                  /tmp/image.bs \
                  /tmp/partmap.bootdisk \
                  /tmp/partmap.image

              if [ "$preserve_tf" = "1" ]; then
                  echo "DoorNet2: expanded TF p2 detected."
                  echo "DoorNet2: TF partition table will be preserved."
                  return 0
              fi

              if [ -n "$diff" ]; then
                  echo "Partition layout has changed. Full image will be written."
                  ask_bool 0 "Abort" && exit 1
                  return 0
              fi

              return 0
          }


          platform_copy_config()
          {
              local partdev

              if export_partdevice partdev 1; then

                  mount \
                      -o rw,noatime \
                      "/dev/${partdev}" \
                      /mnt

                  cp \
                      -af \
                      "$UPGRADE_BACKUP" \
                      "/mnt/$BACKUP_FILE"

                  umount /mnt
              fi
          }


          platform_do_upgrade()
          {
              local diskdev
              local partdev
              local diff
              local preserve_tf=0

              export_bootdevice && \
              export_partdevice diskdev 0 || {
                  echo "Unable to determine upgrade device"
                  return 1
              }

              sync

              if [ "$UPGRADE_OPT_SAVE_PARTITIONS" = "1" ]; then

                  get_partitions \
                      "/dev/${diskdev}" \
                      bootdisk

                  #
                  # Extract the boot sector from the image.
                  #
                  get_image "$@" |
                      dd \
                          of=/tmp/image.bs \
                          count=1 \
                          bs=512b

                  get_partitions \
                      /tmp/image.bs \
                      image

                  diff="$(
                      grep \
                          -F \
                          -x \
                          -v \
                          -f /tmp/partmap.bootdisk \
                          /tmp/partmap.image
                  )"

              else

                  diff=1

              fi


              if [ -n "$diff" ] && \
                 [ "$UPGRADE_OPT_SAVE_PARTITIONS" = "1" ] && \
                 doornet2_tf_can_preserve_partitions \
                     "$diskdev"
              then

                  preserve_tf=1
                  diff=""

                  echo "DoorNet2: preserving expanded TF partition table."

              fi


              if [ -n "$diff" ]; then

                  get_image "$@" |
                      dd \
                          of="/dev/${diskdev}" \
                          bs=4096 \
                          conv=fsync

                  #
                  # Separate removal and addition is necessary.
                  #
                  partx \
                      -d \
                      - \
                      "/dev/${diskdev}"

                  partx \
                      -a \
                      - \
                      "/dev/${diskdev}"

                  return 0
              fi


              #
              # Keep the current partition table and write the image
              # contents into each existing partition.
              #
              while read part start size
              do

                  if export_partdevice \
                      partdev \
                      "$part"
                  then

                      echo "Writing image to /dev/${partdev}..."

                      get_image "$@" |
                          dd \
                              of="/dev/${partdev}" \
                              ibs=512 \
                              obs=1M \
                              skip="$start" \
                              count="$size" \
                              conv=fsync

                  else

                      echo "Unable to find partition ${part} device, skipped."

                  fi

              done < /tmp/partmap.image


              #
              # Copy the image disk signature / MBR UUID.
              #
              echo "Writing new UUID to /dev/${diskdev}..."

              get_image "$@" |
                  dd \
                      of="/dev/${diskdev}" \
                      bs=1 \
                      skip=440 \
                      count=4 \
                      seek=440 \
                      conv=fsync


              #
              # Only an already-expanded, physically verified TF reaches
              # this branch. The partition itself stays large; resize the
              # newly-written 7 GiB ext4 filesystem back to that size.
              #
              if [ "$preserve_tf" = "1" ]; then

                  echo "DoorNet2: restoring ext4 to expanded TF capacity."

                  if ! doornet2_tf_grow_ext4 \
                      "$diskdev"
                  then

                      echo "WARNING: DoorNet2 TF ext4 auto-grow failed."
                      echo "WARNING: Firmware was written successfully."
                      echo "WARNING: TF filesystem can be grown manually later."

                  fi

              fi

              return 0
          }
          EOF

          echo "===== R21 PLATFORM SYNTAX ====="

          sh -n "$PLATFORM"

          echo
          echo "===== R21 TF CAPACITY PATCH ====="

          grep -nE \
            'DOORNET2_R21_TF_CAPACITY_PRESERVE_V1|RAMFS_COPY_BIN|doornet2_is_tf_disk|doornet2_tf_can_preserve_partitions|doornet2_tf_grow_ext4|preserving expanded TF partition table|resize2fs' \
            "$PLATFORM"

          grep -q \
            'DOORNET2_R21_TF_CAPACITY_PRESERVE_V1' \
            "$PLATFORM"

          grep -q \
            'fe320000.mmc' \
            "$PLATFORM"

          grep -q \
            '/usr/sbin/e2fsck' \
            "$PLATFORM"

          grep -q \
            '/usr/sbin/resize2fs' \
            "$PLATFORM"

          grep -q \
            'preserving expanded TF partition table' \
            "$PLATFORM"

          echo "R21 TF CAPACITY PATCH OK"


      # ============================================================
      # 10. R18 boot logic
      #
      # U-Boot:
      #   mmc 1 = TF
      #   mmc 0 = eMMC
      #
      # Linux aliases:
      #   mmcblk0 = TF
      #   mmcblk1 = eMMC
      # ============================================================

      - name: Configure R18 TF first boot
        run: |
          set -e

          cat > target/linux/rockchip/image/doornet2.bootscript <<'EOF'
          #
          # DoorNet2 r18 stable TF/eMMC boot
          #
          # U-Boot:
          #   mmc 1 = TF
          #   mmc 0 = eMMC
          #
          # Linux DT aliases:
          #   mmc0 = &sdmmc
          #   mmc1 = &sdhci
          #
          # Linux:
          #   TF   = /dev/mmcblk0
          #   eMMC = /dev/mmcblk1
          #

          if test "${stdout}" = "serial@fe660000"; then
              setenv serial_addr ",0xfe660000";
          elif test "${stdout}" = "serial@feb50000"; then
              setenv serial_addr ",0xfeb50000";
          elif test "${stdout}" = "serial@ff130000"; then
              setenv serial_addr ",0xff130000";
          elif test "${stdout}" = "serial@ff1a0000"; then
              setenv serial_addr ",0xff1a0000";
          else
              setenv serial_addr "";
          fi;

          echo "========================================";
          echo "DoorNet2 r18 smart boot";
          echo "Priority: TF -> eMMC";
          echo "Linux: TF=mmcblk0 eMMC=mmcblk1";
          echo "========================================";

          echo "Trying TF via U-Boot mmc 1:1";

          if load mmc 1:1 ${kernel_addr_r} kernel.img; then

              echo "TF kernel found";
              echo "Linux root=/dev/mmcblk0p2";

              setenv rootdev "/dev/mmcblk0p2";

              setenv bootargs "coherent_pool=2M console=ttyS2,1500000 earlycon=uart8250,mmio32${serial_addr} root=${rootdev} rw rootwait";

              bootm ${kernel_addr_r};

              echo "WARNING: TF boot returned unexpectedly";
              echo "Trying eMMC";

          else

              echo "TF kernel not found";
              echo "Fallback to eMMC";

          fi;


          echo "Trying eMMC via U-Boot mmc 0:1";

          if load mmc 0:1 ${kernel_addr_r} kernel.img; then

              echo "eMMC kernel found";
              echo "Linux root=/dev/mmcblk1p2";

              setenv rootdev "/dev/mmcblk1p2";

              setenv bootargs "coherent_pool=2M console=ttyS2,1500000 earlycon=uart8250,mmio32${serial_addr} root=${rootdev} rw rootwait";

              bootm ${kernel_addr_r};

          else

              echo "FATAL: eMMC kernel not found";

          fi;


          echo "========================================";
          echo "FATAL: No bootable DoorNet2 system";
          echo "========================================";
          EOF


          python3 <<'PY'
          from pathlib import Path

          p = Path(
              "target/linux/rockchip/image/armv8.mk"
          )

          s = p.read_text()

          marker = "define Device/embedfire_doornet2"

          start = s.find(marker)

          if start == -1:
              raise SystemExit(
                  "ERROR: DoorNet2 block not found"
              )

          end = s.find("endef", start)

          if end == -1:
              raise SystemExit(
                  "ERROR: DoorNet2 block incomplete"
              )

          block = s[start:end]

          if "BOOT_SCRIPT := doornet2" not in block:

              if "BOOT_FLOW := pine64-bin" not in block:
                  raise SystemExit(
                      "ERROR: BOOT_FLOW not found"
                  )

              block = block.replace(
                  "  BOOT_FLOW := pine64-bin\n",
                  "  BOOT_FLOW := pine64-bin\n"
                  "  BOOT_SCRIPT := doornet2\n"
              )

              s = s[:start] + block + s[end:]

              p.write_text(s)

          print(
              p.read_text()[
                  start:
                  p.read_text().find(
                      "endef",
                      start
                  ) + 5
              ]
          )
          PY


          echo
          echo "===== R18 BOOT SCRIPT ====="

          cat target/linux/rockchip/image/doornet2.bootscript


          echo
          echo "===== BOOT VERIFY ====="

          grep -q \
            'rootdev "/dev/mmcblk0p2"' \
            target/linux/rockchip/image/doornet2.bootscript

          grep -q \
            'rootdev "/dev/mmcblk1p2"' \
            target/linux/rockchip/image/doornet2.bootscript

          if grep -Eq \
            '^[[:space:]]*(mmc dev|mmc rescan|part uuid)' \
            target/linux/rockchip/image/doornet2.bootscript
          then
              echo "ERROR: unsupported boot command found"
              exit 1
          fi


      # ============================================================
      # 11. taskd compatibility
      # ============================================================

      - name: Add taskd compatibility fix
        run: |
          set -e

          mkdir -p files/etc/uci-defaults

          cat > files/etc/uci-defaults/99-taskd-compat <<'EOF'
          #!/bin/sh

          TASKS="/etc/init.d/tasks"

          if [ -f "$TASKS" ] && \
             grep -q 'extra_command ' "$TASKS" && \
             ! grep -q 'TASKD_EXTRA_COMMAND_COMPAT' "$TASKS"
          then

              TMP="/tmp/tasks.compat.$$"

              awk '
              NR == 1 {
                  print
                  print ""
                  print "# TASKD_EXTRA_COMMAND_COMPAT"
                  print "type extra_command >/dev/null 2>&1 || extra_command() { :; }"
                  next
              }
              {
                  print
              }
              ' "$TASKS" > "$TMP"

              cat "$TMP" > "$TASKS"
              rm -f "$TMP"

              chmod 755 "$TASKS"
          fi

          exit 0
          EOF

          chmod 755 files/etc/uci-defaults/99-taskd-compat


      # ============================================================
      # 12. R18 updater
      #
      # Four-level protection:
      #
      # 1. root device
      # 2. MMC host controller
      # 3. physical SD/MMC type
      # 4. OpenWrt sysupgrade diskdev
      # ============================================================

      - name: Add DoorNet2 R18 online updater
        run: |
          set -e

          mkdir -p \
            files/usr/bin \
            files/usr/lib/lua/luci/controller \
            files/usr/lib/lua/luci/view/doornet2


          cat > files/usr/bin/doornet2-updater <<'EOF'
          #!/bin/sh

          export PATH=/usr/sbin:/usr/bin:/sbin:/bin

          REPO="bwgone/DoorNet2-iStoreOS"

          BASE_URL="https://github.com/${REPO}/releases/latest/download"

          WORKDIR="/tmp/doornet2-update"

          META="${WORKDIR}/version.json"

          FIRMWARE="${WORKDIR}/DoorNet2-ext4-sysupgrade.img.gz"

          TESTLOG="/tmp/doornet2-sysupgrade-test.log"

          UPGRADELOG="/tmp/doornet2-upgrade.log"

          RELEASE_INFO="/etc/doornet2_release"

          EXPECTED_BOARD="embedfire,doornet2"

          EXPECTED_ASSET="DoorNet2-ext4-sysupgrade.img.gz"


          get_current_version()
          {
              CURRENT_VERSION="unknown"
              CURRENT_TAG="unknown"

              if [ -f "$RELEASE_INFO" ]; then

                  . "$RELEASE_INFO"

                  CURRENT_VERSION="${DOORNET2_VERSION:-unknown}"
                  CURRENT_TAG="${DOORNET2_TAG:-unknown}"

              fi
          }


          get_board()
          {
              BOARD="unknown"

              if [ -r /tmp/sysinfo/board_name ]; then

                  IFS= read -r BOARD \
                      < /tmp/sysinfo/board_name

                  [ -n "$BOARD" ] || \
                      BOARD="unknown"

              fi
          }


          #
          # Check Linux MMC host numbering.
          #
          # Host mmc0 must be fe320000.mmc (TF controller)
          # Host mmc1 must be fe330000.mmc (eMMC controller)
          #
          # mmc_host exists even when no TF card is inserted.
          #
          verify_mmc_host_layout()
          {
              HOST0=""
              HOST1=""

              HOST0="$(
                  readlink -f \
                    /sys/class/mmc_host/mmc0/device \
                    2>/dev/null
              )"

              HOST1="$(
                  readlink -f \
                    /sys/class/mmc_host/mmc1/device \
                    2>/dev/null
              )"

              case "$HOST0" in
                  *fe320000.mmc*)
                      ;;
                  *)
                      return 1
                      ;;
              esac

              case "$HOST1" in
                  *fe330000.mmc*)
                      ;;
                  *)
                      return 2
                      ;;
              esac

              return 0
          }


          #
          # Determine current root and physical media.
          #
          get_root_info()
          {
              ROOT_DEVICE=""
              ROOT_DISK=""
              UPGRADE_DISK="unknown"
              BOOT_MEDIA="unknown"
              MEDIA_TYPE="unknown"
              CONTROLLER="unknown"

              CMDLINE=""

              if [ -r /proc/cmdline ]; then

                  IFS= read -r CMDLINE \
                      < /proc/cmdline

                  for ARG in $CMDLINE; do

                      case "$ARG" in

                          root=/dev/mmcblk0p2|root=/dev/mmcblk1p2)

                              ROOT_DEVICE="${ARG#root=}"
                              break
                              ;;

                      esac

                  done

              fi


              if [ -z "$ROOT_DEVICE" ]; then

                  ROOT_DEVICE="$(
                      /bin/mount 2>/dev/null |
                      awk '
                          $3 == "/" {
                              print $1
                              exit
                          }
                      '
                  )"

              fi


              case "$ROOT_DEVICE" in

                  /dev/mmcblk0p2)

                      ROOT_DISK="/dev/mmcblk0"
                      ;;

                  /dev/mmcblk1p2)

                      ROOT_DISK="/dev/mmcblk1"
                      ;;

                  *)

                      return 1
                      ;;

              esac


              SYSNAME="${ROOT_DISK#/dev/}"


              if [ -r "/sys/block/${SYSNAME}/device/type" ]; then

                  IFS= read -r MEDIA_TYPE \
                      < "/sys/block/${SYSNAME}/device/type"

              fi


              CONTROLLER="$(
                  readlink -f \
                    "/sys/block/${SYSNAME}/device" \
                    2>/dev/null
              )"


              case "$ROOT_DEVICE:$MEDIA_TYPE:$CONTROLLER" in

                  /dev/mmcblk0p2:SD:*fe320000.mmc*)

                      BOOT_MEDIA="TF"
                      UPGRADE_DISK="/dev/mmcblk0"
                      ;;

                  /dev/mmcblk1p2:MMC:*fe330000.mmc*)

                      BOOT_MEDIA="eMMC"
                      UPGRADE_DISK="/dev/mmcblk1"
                      ;;

                  *)

                      BOOT_MEDIA="unknown"
                      UPGRADE_DISK="unknown"
                      return 2
                      ;;

              esac


              return 0
          }


          #
          # Full upgrade safety guard.
          #
          verify_sysupgrade_target()
          {
              SYSUPGRADE_DISK="unknown"
              TARGET_GUARD_MESSAGE="unknown"


              if ! verify_mmc_host_layout; then

                  TARGET_GUARD_MESSAGE="mmc_host_layout_mismatch"
                  return 20

              fi


              if ! get_root_info; then

                  TARGET_GUARD_MESSAGE="root_media_mismatch"
                  return 21

              fi


              EXPECTED_DISKDEV="${UPGRADE_DISK#/dev/}"


              if [ ! -r /lib/functions.sh ]; then

                  TARGET_GUARD_MESSAGE="functions_missing"
                  return 22

              fi


              if [ ! -r /lib/upgrade/common.sh ]; then

                  TARGET_GUARD_MESSAGE="upgrade_common_missing"
                  return 23

              fi


              . /lib/functions.sh
              . /lib/upgrade/common.sh


              unset diskdev


              if ! export_bootdevice \
                  >/dev/null 2>&1
              then

                  TARGET_GUARD_MESSAGE="export_bootdevice_failed"
                  return 24

              fi


              if ! export_partdevice \
                  diskdev \
                  0 \
                  >/dev/null 2>&1
              then

                  TARGET_GUARD_MESSAGE="export_partdevice_failed"
                  return 25

              fi


              SYSUPGRADE_DISK="/dev/${diskdev}"


              if [ "$diskdev" != "$EXPECTED_DISKDEV" ]; then

                  TARGET_GUARD_MESSAGE="target_mismatch"
                  return 26

              fi


              TARGET_GUARD_MESSAGE="ok"

              return 0
          }


          fetch_metadata()
          {
              mkdir -p "$WORKDIR"

              rm -f "${META}.part"

              if ! curl \
                  -LfsS \
                  --connect-timeout 15 \
                  --retry 3 \
                  -o "${META}.part" \
                  "${BASE_URL}/version.json"
              then
                  return 1
              fi

              mv "${META}.part" "$META"


              LATEST_VERSION="$(
                  jsonfilter \
                      -i "$META" \
                      -e '@.version' \
                      2>/dev/null
              )"

              LATEST_TAG="$(
                  jsonfilter \
                      -i "$META" \
                      -e '@.tag' \
                      2>/dev/null
              )"

              LATEST_BOARD="$(
                  jsonfilter \
                      -i "$META" \
                      -e '@.board' \
                      2>/dev/null
              )"

              LATEST_ASSET="$(
                  jsonfilter \
                      -i "$META" \
                      -e '@.asset' \
                      2>/dev/null
              )"

              LATEST_SHA="$(
                  jsonfilter \
                      -i "$META" \
                      -e '@.sha256' \
                      2>/dev/null
              )"


              [ "$LATEST_BOARD" = "$EXPECTED_BOARD" ] \
                  || return 2

              [ "$LATEST_ASSET" = "$EXPECTED_ASSET" ] \
                  || return 3

              [ -n "$LATEST_VERSION" ] \
                  || return 4

              echo "$LATEST_SHA" |
                  grep -Eq \
                    '^[0-9a-fA-F]{64}$' \
                  || return 5


              return 0
          }


          capture_user_state()
          {
              # The normal sysupgrade path preserves configuration by default
              # because this updater NEVER uses the -n (discard settings) flag.
              # Save the one service state that is not represented by a normal
              # UCI enabled option: AdGuard Home's /etc/rc.d enable symlink.
              if ls /etc/rc.d/S[0-9][0-9]adguardhome >/dev/null 2>&1; then
                  echo 'adguardhome_enabled=1' > /etc/doornet2-upgrade-service-state
              else
                  echo 'adguardhome_enabled=0' > /etc/doornet2-upgrade-service-state
              fi

              # The marker prevents clean-install defaults from being applied
              # again after a retained online upgrade.
              touch /etc/doornet2-user-network-initialized
              sync
          }


          command_status()
          {
              get_current_version
              get_board

              HOST_LAYOUT="bad"

              if verify_mmc_host_layout; then
                  HOST_LAYOUT="ok"
              fi


              get_root_info || true


              printf '{'
              printf '"ok":true,'
              printf '"current_version":"%s",' "$CURRENT_VERSION"
              printf '"current_tag":"%s",' "$CURRENT_TAG"
              printf '"board":"%s",' "$BOARD"
              printf '"root_device":"%s",' "$ROOT_DEVICE"
              printf '"upgrade_disk":"%s",' "$UPGRADE_DISK"
              printf '"boot_media":"%s",' "$BOOT_MEDIA"
              printf '"media_type":"%s",' "$MEDIA_TYPE"
              printf '"mmc_layout":"%s"' "$HOST_LAYOUT"
              printf '}\n'
          }


          command_check()
          {
              get_current_version
              get_board


              if [ "$BOARD" != "$EXPECTED_BOARD" ]; then

                  printf \
                    '{"ok":false,"message":"board_mismatch"}\n'

                  exit 1
              fi


              if ! verify_mmc_host_layout; then

                  printf \
                    '{"ok":false,"message":"mmc_host_layout_mismatch"}\n'

                  exit 1
              fi


              if ! get_root_info; then

                  printf \
                    '{"ok":false,"message":"root_media_mismatch"}\n'

                  exit 1
              fi


              if ! fetch_metadata; then

                  printf \
                    '{"ok":false,"message":"metadata_download_failed"}\n'

                  exit 1
              fi


              if [ "$CURRENT_VERSION" = "$LATEST_VERSION" ]; then
                  AVAILABLE="false"
              else
                  AVAILABLE="true"
              fi


              printf '{'
              printf '"ok":true,'
              printf '"current_version":"%s",' "$CURRENT_VERSION"
              printf '"latest_version":"%s",' "$LATEST_VERSION"
              printf '"latest_tag":"%s",' "$LATEST_TAG"
              printf '"update_available":%s,' "$AVAILABLE"
              printf '"boot_media":"%s",' "$BOOT_MEDIA"
              printf '"media_type":"%s",' "$MEDIA_TYPE"
              printf '"upgrade_disk":"%s",' "$UPGRADE_DISK"
              printf '"mmc_layout":"ok"'
              printf '}\n'
          }


          command_prepare()
          {
              get_board


              if [ "$BOARD" != "$EXPECTED_BOARD" ]; then

                  printf \
                    '{"ok":false,"message":"board_mismatch"}\n'

                  exit 1
              fi


              if ! verify_sysupgrade_target; then

                  printf '{'
                  printf '"ok":false,'
                  printf '"message":"target_guard_failed",'
                  printf '"guard_message":"%s",' "$TARGET_GUARD_MESSAGE"
                  printf '"boot_media":"%s",' "$BOOT_MEDIA"
                  printf '"upgrade_disk":"%s",' "$UPGRADE_DISK"
                  printf '"sysupgrade_disk":"%s"' "$SYSUPGRADE_DISK"
                  printf '}\n'

                  exit 1
              fi


              if ! fetch_metadata; then

                  printf \
                    '{"ok":false,"message":"metadata_download_failed"}\n'

                  exit 1
              fi


              rm -f "${FIRMWARE}.part"


              if ! curl \
                  -LfsS \
                  --connect-timeout 15 \
                  --retry 3 \
                  -o "${FIRMWARE}.part" \
                  "${BASE_URL}/${EXPECTED_ASSET}"
              then

                  rm -f "${FIRMWARE}.part"

                  printf \
                    '{"ok":false,"message":"firmware_download_failed"}\n'

                  exit 1
              fi


              mv "${FIRMWARE}.part" "$FIRMWARE"


              ACTUAL_SHA="$(
                  sha256sum "$FIRMWARE" |
                  awk '{print $1}'
              )"


              if [ "$ACTUAL_SHA" != "$LATEST_SHA" ]; then

                  rm -f "$FIRMWARE"

                  printf \
                    '{"ok":false,"message":"sha256_failed"}\n'

                  exit 1
              fi


              rm -f "$TESTLOG"


              if ! /sbin/sysupgrade \
                  -T \
                  "$FIRMWARE" \
                  >"$TESTLOG" 2>&1
              then

                  printf \
                    '{"ok":false,"message":"sysupgrade_test_failed"}\n'

                  exit 1
              fi


              if ! verify_sysupgrade_target; then

                  printf '{'
                  printf '"ok":false,'
                  printf '"message":"target_guard_failed_after_test",'
                  printf '"guard_message":"%s",' "$TARGET_GUARD_MESSAGE"
                  printf '"boot_media":"%s",' "$BOOT_MEDIA"
                  printf '"upgrade_disk":"%s",' "$UPGRADE_DISK"
                  printf '"sysupgrade_disk":"%s"' "$SYSUPGRADE_DISK"
                  printf '}\n'

                  exit 1
              fi


              SIZE="$(
                  du -h "$FIRMWARE" |
                  awk '{print $1}'
              )"


              printf '{'
              printf '"ok":true,'
              printf '"ready":true,'
              printf '"latest_version":"%s",' "$LATEST_VERSION"
              printf '"sha256":"%s",' "$ACTUAL_SHA"
              printf '"size":"%s",' "$SIZE"
              printf '"boot_media":"%s",' "$BOOT_MEDIA"
              printf '"media_type":"%s",' "$MEDIA_TYPE"
              printf '"upgrade_disk":"%s",' "$UPGRADE_DISK"
              printf '"sysupgrade_disk":"%s",' "$SYSUPGRADE_DISK"
              printf '"mmc_layout":"ok",'
              printf '"keep_config":true,'
              printf '"target_guard":"ok"'
              printf '}\n'
          }


          command_upgrade()
          {
              get_board


              if [ "$BOARD" != "$EXPECTED_BOARD" ]; then

                  printf \
                    '{"ok":false,"message":"board_mismatch"}\n'

                  exit 1
              fi


              if [ ! -f "$META" ] || \
                 [ ! -f "$FIRMWARE" ]
              then

                  printf \
                    '{"ok":false,"message":"firmware_not_prepared"}\n'

                  exit 1
              fi


              LATEST_SHA="$(
                  jsonfilter \
                      -i "$META" \
                      -e '@.sha256' \
                      2>/dev/null
              )"


              ACTUAL_SHA="$(
                  sha256sum "$FIRMWARE" |
                  awk '{print $1}'
              )"


              if [ -z "$LATEST_SHA" ] || \
                 [ "$LATEST_SHA" != "$ACTUAL_SHA" ]
              then

                  printf \
                    '{"ok":false,"message":"sha256_failed"}\n'

                  exit 1
              fi


              if ! /sbin/sysupgrade \
                  -T \
                  "$FIRMWARE" \
                  >"$TESTLOG" 2>&1
              then

                  printf \
                    '{"ok":false,"message":"sysupgrade_test_failed"}\n'

                  exit 1
              fi


              #
              # FINAL safety check immediately before writing disk.
              #
              if ! verify_sysupgrade_target; then

                  printf '{'
                  printf '"ok":false,'
                  printf '"message":"final_target_guard_failed",'
                  printf '"guard_message":"%s",' "$TARGET_GUARD_MESSAGE"
                  printf '"boot_media":"%s",' "$BOOT_MEDIA"
                  printf '"upgrade_disk":"%s",' "$UPGRADE_DISK"
                  printf '"sysupgrade_disk":"%s"' "$SYSUPGRADE_DISK"
                  printf '}\n'

                  exit 1
              fi


              # Retain current user configuration by default.  OpenWrt
              # sysupgrade preserves settings unless -n is supplied; this updater
              # intentionally never supplies -n.  Capture AdGuard Home's service
              # enable state before the backup/flash phase as well.
              capture_user_state
              sync


              (
                  sleep 3

                  /sbin/sysupgrade \
                    -v \
                    "$FIRMWARE"

              ) >"$UPGRADELOG" \
                2>&1 \
                </dev/null &


              printf '{'
              printf '"ok":true,'
              printf '"started":true,'
              printf '"boot_media":"%s",' "$BOOT_MEDIA"
              printf '"upgrade_disk":"%s",' "$UPGRADE_DISK"
              printf '"sysupgrade_disk":"%s",' "$SYSUPGRADE_DISK"
              printf '"keep_config":true,'
              printf '"target_guard":"ok"'
              printf '}\n'
          }


          case "$1" in

              status)
                  command_status
                  ;;

              check)
                  command_check
                  ;;

              prepare)
                  command_prepare
                  ;;

              upgrade)
                  command_upgrade
                  ;;

              *)
                  echo "Usage:"
                  echo "  doornet2-updater status"
                  echo "  doornet2-updater check"
                  echo "  doornet2-updater prepare"
                  echo "  doornet2-updater upgrade"
                  exit 1
                  ;;

          esac
          EOF


          chmod 755 files/usr/bin/doornet2-updater

          sh -n files/usr/bin/doornet2-updater


          # ----------------------------------------------------------
