          cat > files/usr/lib/lua/luci/controller/doornet2_update.lua <<'EOF'
          module("luci.controller.doornet2_update", package.seeall)

          function index()

              if not nixio.fs.access(
                  "/usr/bin/doornet2-updater"
              ) then
                  return
              end

              local page = entry(
                  {
                      "admin",
                      "system",
                      "doornet2_update"
                  },
                  template("doornet2/update"),
                  _("DoorNet2 在线升级"),
                  90
              )

              page.dependent = false

              entry(
                  {
                      "admin",
                      "system",
                      "doornet2_update",
                      "status"
                  },
                  call("action_status")
              ).leaf = true

              entry(
                  {
                      "admin",
                      "system",
                      "doornet2_update",
                      "check"
                  },
                  call("action_check")
              ).leaf = true

              entry(
                  {
                      "admin",
                      "system",
                      "doornet2_update",
                      "prepare"
                  },
                  call("action_prepare")
              ).leaf = true

              entry(
                  {
                      "admin",
                      "system",
                      "doornet2_update",
                      "upgrade"
                  },
                  call("action_upgrade")
              ).leaf = true
          end


          local function output_json(command)

              local http = require "luci.http"
              local sys = require "luci.sys"

              local result = sys.exec(
                  "/usr/bin/doornet2-updater " ..
                  command ..
                  " 2>/dev/null"
              )

              http.prepare_content(
                  "application/json"
              )

              http.write(result)
          end


          local function require_post()

              local http = require "luci.http"

              if http.getenv(
                  "REQUEST_METHOD"
              ) ~= "POST" then

                  http.status(
                      405,
                      "Method Not Allowed"
                  )

                  http.prepare_content(
                      "application/json"
                  )

                  http.write(
                      '{"ok":false,"message":"POST required"}'
                  )

                  return false
              end

              return true
          end


          function action_status()
              output_json("status")
          end

          function action_check()
              output_json("check")
          end

          function action_prepare()

              if not require_post() then
                  return
              end

              output_json("prepare")
          end

          function action_upgrade()

              if not require_post() then
                  return
              end

              output_json("upgrade")
          end
          EOF


