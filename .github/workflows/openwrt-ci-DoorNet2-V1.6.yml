name: DoorNet2-V1.7
run-name: DoorNet2-V1.7

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_openwrt:
    name: Build Firmware
    # Proven host image used by the bootable R4 DoorNet2 build.
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:

      # ============================================================
      # 1. Build environment
      # ============================================================

      - name: Space cleanup and Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -e

          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            2>/dev/null || true

          docker system prune -af 2>/dev/null || true

          echo "===== RUNNER ====="
          echo "Runner: ubuntu-22.04 (proven R4 baseline)"
          uname -a
          cat /etc/os-release || true

          sudo apt-get update

          sudo apt-get install -y --no-install-recommends \
            ack \
            antlr3 \
            asciidoc \
            autoconf \
            automake \
            autopoint \
            binutils \
            bison \
            build-essential \
            bzip2 \
            ccache \
            clang \
            cmake \
            cpio \
            curl \
            device-tree-compiler \
            e2fsprogs \
            flex \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            genisoimage \
            git \
            gperf \
            haveged \
            help2man \
            intltool \
            libc6-dev-i386 \
            libelf-dev \
            libfuse-dev \
            libglib2.0-dev \
            libgmp3-dev \
            libltdl-dev \
            libmpc-dev \
            libmpfr-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libpython3-dev \
            libreadline-dev \
            libssl-dev \
            libtool \
            llvm \
            lrzsz \
            msmtp \
            ninja-build \
            p7zip \
            p7zip-full \
            patch \
            pkgconf \
            python3 \
            python3-pyelftools \
            python3-setuptools \
            qemu-utils \
            rsync \
            scons \
            squashfs-tools \
            subversion \
            swig \
            texinfo \
            uglifyjs \
            upx-ucl \
            unzip \
            vim \
            wget \
            xmlto \
            xxd \
            zlib1g-dev

          # Ubuntu 24.04 ships a newer default GCC than the old DoorNet2/LEDE
          # buildroot was originally tested with.  Prefer GCC 12 when the
          # package is available, while keeping Ubuntu 22.04 compatible.
          if apt-cache show gcc-12 >/dev/null 2>&1 && \
             apt-cache show g++-12 >/dev/null 2>&1; then
              sudo apt-get install -y --no-install-recommends gcc-12 g++-12
              sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-12 120
              sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-12 120
          fi

          echo "===== HOST TOOLCHAIN ====="
          gcc --version | head -1
          g++ --version | head -1
          python3 --version
