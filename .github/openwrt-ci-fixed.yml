name: DoorNet2 V5.3.5 Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_openwrt:
    name: Build DoorNet2 OpenWrt Firmware
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. Build environment
      # ============================================================

      - name: Space cleanup and Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -e

          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            2>/dev/null || true

          docker system prune -af 2>/dev/null || true

          sudo apt-get update

          sudo apt-get install -y --no-install-recommends \
            ack \
            antlr3 \
            asciidoc \
            autoconf \
            automake \
            autopoint \
            binutils \
            bison \
            build-essential \
            bzip2 \
            ccache \
            clang \
            cmake \
            cpio \
            curl \
            device-tree-compiler \
            flex \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            genisoimage \
            git \
            gperf \
            haveged \
            help2man \
            intltool \
            libc6-dev-i386 \
            libelf-dev \
            libfuse-dev \
            libglib2.0-dev \
            libgmp3-dev \
            libltdl-dev \
            libmpc-dev \
            libmpfr-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libpython3-dev \
            libreadline-dev \
            libssl-dev \
            libtool \
            llvm \
            lrzsz \
            msmtp \
            ninja-build \
            p7zip \
            p7zip-full \
            patch \
            pkgconf \
            python3 \
            python3-pyelftools \
            python3-setuptools \
            qemu-utils \
            rsync \
            scons \
            squashfs-tools \
            subversion \
            swig \
            texinfo \
            uglifyjs \
            upx-ucl \
            unzip \
            vim \
            wget \
            xmlto \
            xxd \
            zlib1g-dev

          sudo apt-get clean
          sudo timedatectl set-timezone "Asia/Shanghai" || true

          df -h


      # ============================================================
      # 2. Checkout
      # ============================================================

      - name: Checkout OpenWrt
        uses: actions/checkout@v4


      - name: Restore OpenWrt build cache
        uses: actions/cache@v4
        with:
          path: |
            dl
            build_dir
            staging_dir
            tmp
            .ccache
          key: openwrt-rk3399-${{ hashFiles('.config') }}-${{ github.sha }}
          restore-keys: |
            openwrt-rk3399-${{ hashFiles('.config') }}-
            openwrt-rk3399-

      - name: Enable ccache
        run: |
          echo 'export PATH="/usr/lib/ccache:$PATH"' >> "$GITHUB_ENV"
          mkdir -p .ccache
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache" >> "$GITHUB_ENV"
          ccache --max-size=5G
          ccache --zero-stats

      - name: Remove insecure known default root password
        shell: bash
        run: |
          set -e

          # Upstream LEDE ships a uci-defaults hook that resets root to the
          # well-known password "password". DoorNet2 must preserve the
          # user's existing root credential instead.
          ROOTPW_FILES="$(grep -RIl --fixed-strings 'V4UetPzk' package 2>/dev/null || true)"

          if [ -z "$ROOTPW_FILES" ]; then
              echo "ERROR: expected upstream default-password hook not found"
              exit 1
          fi

          for f in $ROOTPW_FILES; do
              echo "Hardening root-password hook: $f"
              sed -i '/V4UetPzk/d' "$f"
          done

          if grep -Rqs --fixed-strings 'V4UetPzk' package 2>/dev/null; then
              echo "ERROR: known default root-password hash still present"
              exit 1
          fi


      # ============================================================
      # 3. Version
      # ============================================================

      - name: Generate build version
        run: |
          set -e

          BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          BUILD_DAY="$(date -u +'%Y.%m.%d')"
          SHORT_SHA="${GITHUB_SHA:0:7}"

          # DoorNet2 public/stable numbering restarts here.
          # R4 -> R5 -> R6... is bumped manually in this workflow.
          RELEASE_NUM="4"

          VERSION="${BUILD_DAY}-r${RELEASE_NUM}-${SHORT_SHA}"
          TAG="doornet2-${VERSION}"

          echo "DOORNET2_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "DOORNET2_TAG=${TAG}" >> "$GITHUB_ENV"
          echo "DOORNET2_BUILD_DATE=${BUILD_DATE}" >> "$GITHUB_ENV"

          echo "========================================"
          echo "VERSION=${VERSION}"
          echo "TAG=${TAG}"
          echo "========================================"


      # ============================================================
      # 4. iStore + official OpenWrt LuCI interface
      # ============================================================

      - name: Add iStore feed
        run: |
          set -e

          grep -q '^src-git istore ' feeds.conf.default || \
            echo 'src-git istore https://github.com/linkease/istore;main' \
            >> feeds.conf.default

          cat feeds.conf.default


      - name: Add PassWall feeds
        run: |
          set -e

          echo "===== ADD OFFICIAL PASSWALL FEEDS ====="

          # PassWall upstream recommends placing its feeds before the normal
          # OpenWrt feeds so its newer core package definitions take priority.
          sed -i \
            -e '/^src-git passwall_packages /d' \
            -e '/^src-git passwall_luci /d' \
            feeds.conf.default

          {
            echo 'src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main'
            echo 'src-git passwall_luci https://github.com/Openwrt-Passwall/openwrt-passwall.git;main'
            cat feeds.conf.default
          } > feeds.conf.default.new

          mv feeds.conf.default.new feeds.conf.default

          echo "===== PASSWALL FEEDS ====="
          head -n 8 feeds.conf.default


      - name: Update base feeds
        run: |
          set -e

          ./scripts/feeds update -a
          ./scripts/feeds install -a -f

          ./scripts/feeds install \
            -d y \
            -p istore \
            luci-app-store

          echo "===== PIN PASSWALL LUCI TO 25.1.15-1 ====="

          test -d feeds/passwall_luci/.git

          git -C feeds/passwall_luci fetch \
            --force \
            --depth 1 \
            origin \
            refs/tags/25.1.15-1:refs/tags/25.1.15-1

          git -C feeds/passwall_luci checkout -f 25.1.15-1

          PASSWALL_COMMIT="$(git -C feeds/passwall_luci rev-parse --short=12 HEAD)"
          echo "Pinned PassWall commit: ${PASSWALL_COMMIT}"

          test -f feeds/passwall_luci/luci-app-passwall/Makefile
          test -d feeds/passwall_packages

          grep -q '^PKG_VERSION:=25\.1\.15$' \
            feeds/passwall_luci/luci-app-passwall/Makefile

          grep -q '^PKG_RELEASE:=1$' \
            feeds/passwall_luci/luci-app-passwall/Makefile

          # R4 is an iptables/firewall3 build. This legacy LEDE tree already
          # ships xtables-legacy as the normal `iptables` package and does NOT
          # define the newer OpenWrt package name `iptables-zz-legacy`.
          # Patch only that dependency name; PassWall still uses its normal
          # iptables backend and runtime scripts.
          PASSWALL_MK="feeds/passwall_luci/luci-app-passwall/Makefile"

          grep -q 'Iptables Transparent Proxy' "$PASSWALL_MK"

          sed -i \
            '/^[[:space:]]*select PACKAGE_iptables-zz-legacy[[:space:]]*$/d' \
            "$PASSWALL_MK"

          if grep -q 'select PACKAGE_iptables-zz-legacy' "$PASSWALL_MK"; then
              echo "ERROR: incompatible iptables-zz-legacy dependency remains."
              exit 1
          fi

          # DoorNet2 R4 FINAL owns the visible shunt framework through R4Shunt.
          # Remove only PassWall's stock `myshunt` node from the packaged
          # default config so a clean flash does not show two "分流总节点"
          # entries. Keep PassWall's stock shunt-rule definitions intact.
          PASSWALL_DEFAULT_CFG="feeds/passwall_luci/luci-app-passwall/root/usr/share/passwall/0_default_config"

          test -f "$PASSWALL_DEFAULT_CFG"

          awk '
            BEGIN { skip = 0 }
            /^config nodes '\''myshunt'\''$/ {
                skip = 1
                next
            }
            skip && /^config / {
                skip = 0
            }
            !skip {
                print
            }
          ' "$PASSWALL_DEFAULT_CFG" > "${PASSWALL_DEFAULT_CFG}.tmp"

          mv "${PASSWALL_DEFAULT_CFG}.tmp" "$PASSWALL_DEFAULT_CFG"

          if grep -q "^config nodes 'myshunt'$" "$PASSWALL_DEFAULT_CFG"; then
              echo "ERROR: stock PassWall myshunt node still exists."
              exit 1
          fi

          # Refresh the active package symlink after checking out the tag.
          rm -rf package/feeds/passwall_luci/luci-app-passwall

          ./scripts/feeds install \
            -d y \
            -f \
            -p passwall_luci \
            luci-app-passwall

          echo "===== VERIFY PASSWALL 25.1.15-1 ====="

          grep -nE \
            'PKG_NAME:=luci-app-passwall|PKG_VERSION|PKG_RELEASE|LUCI_DEPENDS' \
            feeds/passwall_luci/luci-app-passwall/Makefile \
            | head -30


      - name: Pin PassWall Go cores for DoorNet2 Go 1.23
        run: |
          set -e

          echo "===== DOORNET2 GO 1.23 PASSWALL COMPATIBILITY ====="

          # This legacy/stable LEDE tree provides Go 1.23.1.
          # Current PassWall packages track newer Go applications:
          #   sing-box 1.14.0      -> Go >= 1.25.5
          #   v2ray-plugin 5.49.0 -> Go >= 1.25.5
          #   current Xray        -> newer Go toolchain
          #
          # DoorNet2 R4 pairs PassWall 25.1.15-1 with Xray 25.1.30,
          # a compatible 2025-era combination. Xray 25.1.30 uses Go 1.23,
          # while Sing-box/v2ray-plugin from the current packages feed require
          # newer Go toolchains, so those remain disabled.
          # in the firmware configuration below. Do not replace the whole Go
          # toolchain: TF-first/eMMC fallback and the R23 stable buildroot stay
          # untouched.

          XRAY_MK="feeds/passwall_packages/xray-core/Makefile"
          test -f "$XRAY_MK"

          sed -i \
            's/^PKG_VERSION:=.*/PKG_VERSION:=25.1.30/' \
            "$XRAY_MK"

          sed -i \
            's/^PKG_HASH:=.*/PKG_HASH:=983ee395f085ed1b7fbe0152cb56a5b605a6f70a5645d427c7186c476f14894e/' \
            "$XRAY_MK"

          # PassWall's current Xray Makefile injects core.version, which exists
          # in newer Xray but not in v25.1.30. Keep only core.build for the
          # pinned release.
          export XRAY_MK
          python3 <<'PY_XRAY'
          import os
          from pathlib import Path

          p = Path(os.environ["XRAY_MK"])
          lines = p.read_text().splitlines()
          out = []

          found_build = False
          found_version = False

          for line in lines:
              if "$(GO_PKG)/core.build=OpenWrt" in line:
                  out.append("\t$(GO_PKG)/core.build=OpenWrt")
                  found_build = True
                  continue

              if "$(GO_PKG)/core.version=$(PKG_VERSION)" in line:
                  found_version = True
                  continue

              out.append(line)

          if not found_build:
              raise SystemExit("ERROR: xray core.build ldflag line not found")

          if not found_version:
              raise SystemExit("ERROR: xray core.version ldflag line not found")

          p.write_text("\n".join(out) + "\n")
          PY_XRAY

          grep -q '^PKG_VERSION:=25\.1\.30$' "$XRAY_MK"
          grep -q '^PKG_HASH:=983ee395f085ed1b7fbe0152cb56a5b605a6f70a5645d427c7186c476f14894e$' "$XRAY_MK"
          grep -q '\$(GO_PKG)/core.build=OpenWrt' "$XRAY_MK"

          if grep -q 'core.version=\$(PKG_VERSION)' "$XRAY_MK"; then
              echo "ERROR: incompatible Xray core.version ldflag still present"
              exit 1
          fi

          echo "Pinned Xray:"
          grep -nE '^PKG_(VERSION|HASH):=|GO_PKG_LDFLAGS_X|core\.build|core\.version' "$XRAY_MK"


      - name: Add DNS acceleration and remove standalone UU package integration
        run: |
          set -e

          echo "===== SMARTDNS / ADGUARD FROM NORMAL FEEDS ====="

          # Use the packages already matched to this LEDE tree for SmartDNS and
          # AdGuard Home.
          # Standalone NetEase UU Game Booster integration is intentionally removed
          # from this solidified build. Existing user-installed applications are not
          # managed by this firmware build.
          ./scripts/feeds install \
            -d y \
            -f \
            -p packages \
            smartdns \
            adguardhome

          ./scripts/feeds install \
            -d y \
            -f \
            -p luci \
            luci-app-smartdns

          echo "===== UU PACKAGE INTEGRATION REMOVED ====="


      - name: Pin official AdGuard Home v0.107.79 arm64 runtime
        run: |
          set -euo pipefail

          echo "===== PIN OFFICIAL ADGUARD HOME RUNTIME ====="

          AGH_VERSION='v0.107.79'
          AGH_ASSET='AdGuardHome_linux_arm64.tar.gz'
          AGH_SHA256='3f7893c18e8aaadc456d0452839190561c306ca95175a2254958be80a769c1ae'
          AGH_URL="https://github.com/AdguardTeam/AdGuardHome/releases/download/${AGH_VERSION}/${AGH_ASSET}"

          rm -rf /tmp/doornet2-agh
          mkdir -p /tmp/doornet2-agh files/usr/bin files/etc

          curl --fail --location \
            --retry 5 --retry-delay 3 --connect-timeout 20 \
            --output "/tmp/doornet2-agh/${AGH_ASSET}" \
            "${AGH_URL}"

          echo "${AGH_SHA256}  /tmp/doornet2-agh/${AGH_ASSET}" | sha256sum -c -
          tar -xzf "/tmp/doornet2-agh/${AGH_ASSET}" -C /tmp/doornet2-agh

          test -x /tmp/doornet2-agh/AdGuardHome/AdGuardHome
          install -m 0755 \
            /tmp/doornet2-agh/AdGuardHome/AdGuardHome \
            files/usr/bin/AdGuardHome

          AGH_BIN_SHA256="$(sha256sum files/usr/bin/AdGuardHome | awk '{print $1}')"
          cat > files/etc/doornet2_adguard_runtime <<EOF
          ADGUARD_VERSION='${AGH_VERSION}'
          ADGUARD_ASSET='${AGH_ASSET}'
          ADGUARD_ARCHIVE_SHA256='${AGH_SHA256}'
          ADGUARD_BINARY_SHA256='${AGH_BIN_SHA256}'
          EOF

          test -s files/usr/bin/AdGuardHome
          test -s files/etc/doornet2_adguard_runtime
          grep -q "ADGUARD_VERSION='v0.107.79'" files/etc/doornet2_adguard_runtime


      - name: Add QuickStart and Argon UI
        run: |
          set -e

          echo "===== ADD QUICKSTART FEEDS (OPTIONAL APP ONLY) ====="

          grep -q '^src-git nas ' feeds.conf.default || \
            echo 'src-git nas https://github.com/linkease/nas-packages.git;master' \
            >> feeds.conf.default

          grep -q '^src-git nas_luci ' feeds.conf.default || \
            echo 'src-git nas_luci https://github.com/linkease/nas-packages-luci.git;main' \
            >> feeds.conf.default

          ./scripts/feeds update nas nas_luci

          ./scripts/feeds install \
            -d y \
            -p nas \
            quickstart

          ./scripts/feeds install \
            -d y \
            -p nas_luci \
            luci-app-quickstart

          echo "===== VERIFY QUICKSTART OPTIONAL APP ====="

          test -f feeds/nas/network/services/quickstart/Makefile
          test -f feeds/nas_luci/luci/luci-app-quickstart/Makefile

          grep -nE \
            'PKG_NAME:=quickstart|PKG_VERSION|DEPENDS' \
            feeds/nas/network/services/quickstart/Makefile \
            | head -20

          grep -nE \
            'LUCI_TITLE|LUCI_DEPENDS|PKG_VERSION' \
            feeds/nas_luci/luci/luci-app-quickstart/Makefile

          echo "QuickStart stays installed as an optional application only."

          # DoorNet2 still uses the classic Lua LuCI stack.  Use the Argon
          # package supplied by the matching LuCI feed instead of forcing the
          # modern Argon v2.x/ucode branch into an incompatible userspace.
          rm -rf \
            package/lean/luci-theme-design \
            package/lean/luci-theme-argon \
            package/lean/luci-app-argon-config \
            package/doornet2/luci-theme-argon

          ./scripts/feeds install -f -p luci luci-theme-argon

          ARGON_MK=""
          for candidate in \
            package/feeds/luci/luci-theme-argon/Makefile \
            feeds/luci/themes/luci-theme-argon/Makefile
          do
              if [ -f "$candidate" ]; then
                  ARGON_MK="$candidate"
                  break
              fi
          done

          if [ -z "$ARGON_MK" ]; then
              echo "ERROR: Lua-compatible luci-theme-argon was not found in the LuCI feed."
              exit 1
          fi

          echo "Using Lua-compatible Argon package: $ARGON_MK"
          grep -nE 'PKG_VERSION|PKG_RELEASE|LUCI_TITLE' "$ARGON_MK" | head -20 || true
          echo "Bootstrap remains installed as fallback."


      - name: Configure DoorNet2 Argon LuCI defaults
        run: |
          set -e

          mkdir -p files/etc/uci-defaults

          cat > files/etc/uci-defaults/95-doornet2-ui <<'EOF'
          #!/bin/sh

          # DoorNet2 R4 V5.3.3 UI policy:
          # Use the Lua-compatible Argon feed package as the default LuCI shell.
          # Keep Bootstrap installed as a safe fallback.
          # QuickStart remains available from the menu but is NOT the homepage.

          uci -q set luci.themes.Bootstrap='/luci-static/bootstrap'
          uci -q set luci.themes.Argon='/luci-static/argon'
          uci -q delete luci.themes.Design
          uci -q set luci.main.mediaurlbase='/luci-static/argon'
          uci -q set luci.main.lang='zh_cn'
          uci -q commit luci

          # Remove stale custom-theme configuration if upgrading from an older
          # DoorNet2 build that used luci-theme-design.
          rm -f /etc/config/design

          # System hostname is intentionally standardized to OpenWrt.
          # This applies to both clean installs and retained sysupgrades, so
          # the shell prompt / LuCI hostname / local hostname all stay aligned.
          uci -q set system.@system[0].hostname='OpenWrt'
          uci -q commit system

          rm -rf \
            /tmp/luci-indexcache \
            /tmp/luci-modulecache \
            /tmp/luci-templatecache

          exit 0
          EOF

          chmod 755 files/etc/uci-defaults/95-doornet2-ui
          sh -n files/etc/uci-defaults/95-doornet2-ui

          echo "===== OFFICIAL LUCI UI DEFAULTS ====="
          cat files/etc/uci-defaults/95-doornet2-ui

      - name: Inject extracted Slim firmware Argon 1.8.1 UI
        run: |
          set -e

          # Exact UI payload extracted from the user-supplied
          # slim-embedfire_doornet2-squashfs-sysupgrade.img.gz.
          # Only LuCI theme/configuration assets are overlaid; kernel,
          # drivers, network stack, PassWall, DNS, UU and upgrade logic
          # remain the V5.3.3 Final implementation.

          mkdir -p /tmp/doornet2-slim-ui files

          UI_PAYLOAD="$GITHUB_WORKSPACE/.github/assets/DoorNet2-SlimUI-Argon-1.8.1-overlay.tar.gz"
          test -f "$UI_PAYLOAD" || {
            echo "ERROR: missing SlimUI payload: $UI_PAYLOAD"
            exit 1
          }
          cp -f "$UI_PAYLOAD" /tmp/doornet2-slim-ui/argon181.tar.gz

          echo "29056b0619beeabd7198f9803d61edb02cf4b186dcc670631ee6527846ffc20e  /tmp/doornet2-slim-ui/argon181.tar.gz" | sha256sum -c -

          tar -xzf /tmp/doornet2-slim-ui/argon181.tar.gz -C files

          # OpenWrt branding:
          # the system hostname is also standardized to OpenWrt by 95-doornet2-ui;
          # DoorNet2 internal updater/service/release identifiers remain unchanged.
          ARGON_HEADER="files/usr/lib/lua/luci/view/themes/argon/header.htm"
          test -f "$ARGON_HEADER"

          python3 - "$ARGON_HEADER" <<'PY_ARGON_BRAND'
          from pathlib import Path
          import re
          import sys

          p = Path(sys.argv[1])
          s = p.read_text()

          # Argon 1.8.x renders the top-left label inside <a class="brand">.
          # Replace the visible brand with OpenWrt. DoorNet2 updater/service
          # names and internal release identifiers remain unchanged.
          brand = re.compile(
              r'(<a\b[^>]*\bclass=(["\'])brand\2[^>]*>).*?(</a>)',
              re.S,
          )
          s2, n = brand.subn(
              lambda m: m.group(1) + "OpenWrt" + m.group(3),
              s,
              count=1,
          )

          if n != 1:
              raise SystemExit("ERROR: Argon brand anchor not found exactly once")

          # Verify the modified anchor really contains OpenWrt.
          m = brand.search(s2)
          if not m or "OpenWrt" not in m.group(0):
              raise SystemExit("ERROR: Argon OpenWrt brand verification failed")

          p.write_text(s2)
          print("Argon top-left brand patched to OpenWrt")
          PY_ARGON_BRAND

          grep -q 'OpenWrt</a>' "$ARGON_HEADER"

          test -f files/www/luci-static/argon/css/cascade.css
          test -f files/www/luci-static/argon/css/dark.css
          test -f files/www/luci-static/argon/img/bg1.jpg
          test -f files/usr/lib/lua/luci/view/themes/argon/header.htm
          test -f files/usr/lib/lua/luci/view/themes/argon/footer.htm
          test -f files/usr/lib/lua/luci/view/themes/argon/sysauth.htm
          test -f files/usr/lib/lua/luci/controller/argon-config.lua
          test -f files/etc/config/argon

          grep -q 'ArgonTheme v1.8.1' \
            files/usr/lib/lua/luci/view/themes/argon/footer.htm

          grep -q "option primary '#5e72e4'" files/etc/config/argon
          grep -q "option dark_primary '#483d8b'" files/etc/config/argon

          echo "===== SLIM UI EXTRACT VERIFIED ====="
          echo "Argon theme: 1.8.1-20230527 (extracted source UI)"
          echo "Argon config: 0.9-20220424"
          echo "Payload SHA256: 29056b0619beeabd7198f9803d61edb02cf4b186dcc670631ee6527846ffc20e"


      - name: Configure DoorNet2 R4 DNS and accelerator defaults
        run: |
          set -e

          # FIX4: an earlier experimental hook named 99-v5.3.3-network-fix
          # conflicts with the validated dnsmasq -> AdGuard :3053 -> SmartDNS :6053
          # topology. Never let that stale repository overlay enter the image.
          rm -f files/etc/uci-defaults/99-v5.3.3-network-fix

          mkdir -p \
            files/etc/uci-defaults \
            files/etc/init.d \
            files/etc/smartdns \
            files/usr/bin

          # V5.3.3 field-validated OpenAI/ChatGPT SmartDNS policy.
          # Domestic DNS remains dual-stack; only these proxy-domain answers
          # are forced through proxy-test and have AAAA suppressed.
          cat > files/etc/smartdns/custom.conf <<'EOF'
          server-tcp 1.1.1.1:53 -group proxy-test
          server-tcp 8.8.8.8:53 -group proxy-test
          nameserver /chatgpt.com/proxy-test
          nameserver /openai.com/proxy-test
          nameserver /oaistatic.com/proxy-test
          nameserver /oaiusercontent.com/proxy-test
          nameserver /openaimerge.com/proxy-test
          address /chatgpt.com/#6
          address /openai.com/#6
          address /oaistatic.com/#6
          address /oaiusercontent.com/#6
          address /openaimerge.com/#6
          nameserver /openai.com.cdn.cloudflare.net/proxy-test
          address /openai.com.cdn.cloudflare.net/#6

          # X/Twitter parent domains: field-validated IPv4-only proxy DNS.
          # Do not globally alter Cloudflare/Fastly; only the X/Twitter domains
          # validated on the live V5.3.2 system are included here.
          nameserver /x.com/proxy-test
          address /x.com/#6
          nameserver /twitter.com/proxy-test
          address /twitter.com/#6
          nameserver /twimg.com/proxy-test
          address /twimg.com/#6
          nameserver /t.co/proxy-test
          address /t.co/#6
          EOF

          cat > files/etc/uci-defaults/93-doornet2-dualstack-proxyv4 <<'EOF'
          #!/bin/sh

          # V5.3.5 adaptive dual-stack policy:
          # - Domestic/direct traffic may use native IPv4 + IPv6.
          # - PassWall proxy targets remain IPv4-only.
          # - DHCP/static WAN keeps the standalone wan6 DHCPv6 client enabled.
          # - PPPoE uses netifd's integrated IPv6/PD path and does not start a
          #   second DHCPv6 client directly on eth0.

          WAN_PROTO="$(uci -q get network.wan.proto)"

          if uci -q get network.wan >/dev/null 2>&1; then
              uci -q set network.wan.ipv6='auto'
              uci -q set network.wan.delegate='1'
          fi

          if uci -q get network.wan6 >/dev/null 2>&1; then
              case "$WAN_PROTO" in
                  pppoe)
                      # PPPoE already creates the IPv6 path on pppoe-wan.
                      # Keep the retained wan6 section for compatibility, but
                      # do not autostart a duplicate eth0 odhcp6c client.
                      uci -q set network.wan6.auto='0'
                      uci -q delete network.wan6.disabled
                      ;;
                  *)
                      # DHCP/static upstreams need the standalone wan6 client.
                      uci -q set network.wan6.auto='1'
                      uci -q delete network.wan6.disabled
                      ;;
              esac
          fi

          if uci -q get network.lan >/dev/null 2>&1; then
              [ -n "$(uci -q get network.lan.ip6assign)" ] || \
                  uci -q set network.lan.ip6assign='64'
          fi
          uci -q commit network

          if uci -q get dhcp.lan >/dev/null 2>&1; then
              uci -q set dhcp.lan.ra='server'
              uci -q set dhcp.lan.dhcpv6='server'
              uci -q set dhcp.lan.ndp='disabled'
              uci -q commit dhcp
          fi

          exit 0
          EOF

          chmod 755 files/etc/uci-defaults/93-doornet2-dualstack-proxyv4
          sh -n files/etc/uci-defaults/93-doornet2-dualstack-proxyv4

        
          # Explicit persistence policy for retained sysupgrades. Standard UCI
          # files are already preserved by OpenWrt; these entries make the R4
          # contract explicit and also retain AdGuard/SmartDNS non-UCI data.
          cat > files/etc/sysupgrade.conf <<'EOF'
          /etc/config/network
          /etc/config/dhcp
          /etc/config/firewall
          /etc/config/system
          /etc/config/dropbear
          /etc/config/luci
          /etc/config/passwall
          /etc/config/smartdns
          /etc/config/adguardhome
          /etc/config/uuplugin
          /etc/config/uugamebooster
          /etc/adguardhome.yaml
          /etc/smartdns/
          /usr/share/uugamebooster/uu.conf
          EOF

          # Clean-install AdGuard Home baseline.  On retained sysupgrade the
          # preserved /etc/adguardhome.yaml from sysupgrade.conf overrides this
          # file, so user accounts, filters and custom rules remain untouched.
          # The default DNS chain is dnsmasq:53 -> AdGuard:3053 -> SmartDNS:6053.
          cat > files/etc/adguardhome.yaml <<'EOF'
          http:
            pprof:
              port: 6060
              enabled: false
            address: 0.0.0.0:3000
            session_ttl: 720h
          users: []
          auth_attempts: 5
          block_auth_min: 15
          http_proxy: ""
          language: zh-cn
          theme: auto
          dns:
            bind_hosts:
              - 0.0.0.0
              - '::'
            port: 3053
            anonymize_client_ip: false
            ratelimit: 20
            ratelimit_subnet_len_ipv4: 24
            ratelimit_subnet_len_ipv6: 56
            refuse_any: true
            upstream_dns:
              - 127.0.0.1:6053
            upstream_dns_file: ""
            bootstrap_dns:
              - 223.5.5.5
              - 119.29.29.29
            fallback_dns: []
            upstream_mode: load_balance
            fastest_timeout: 1s
            allowed_clients: []
            disallowed_clients: []
            blocked_hosts:
              - version.bind
              - id.server
              - hostname.bind
            trusted_proxies:
              - 127.0.0.0/8
              - ::1/128
            cache_size: 4194304
            cache_ttl_min: 0
            cache_ttl_max: 0
            cache_optimistic: false
            bogus_nxdomain: []
            aaaa_disabled: false
            enable_dnssec: false
            edns_client_subnet:
              custom_ip: ""
              enabled: false
              use_custom: false
            max_goroutines: 300
            handle_ddr: true
            ipset: []
            ipset_file: ""
            bootstrap_prefer_ipv6: false
            local_ptr_upstreams: []
            use_private_ptr_resolvers: true
            use_dns64: false
            dns64_prefixes: []
            serve_http3: false
            use_http3_upstreams: false
            serve_plain_dns: true
            hostsfile_enabled: true
          tls:
            enabled: false
            server_name: ""
            force_https: false
            port_https: 443
            port_dns_over_tls: 853
            port_dns_over_quic: 853
            port_dnscrypt: 0
            dnscrypt_config_file: ""
            allow_unencrypted_doh: false
            certificate_chain: ""
            private_key: ""
            certificate_path: ""
            private_key_path: ""
            strict_sni_check: false
          querylog:
            ignored: []
            interval: 2160h
            size_memory: 1000
            enabled: true
            file_enabled: true
          statistics:
            ignored: []
            interval: 24h
          filters:
            - enabled: true
              url: https://adguardteam.github.io/HostlistsRegistry/assets/filter_1.txt
              name: AdGuard DNS filter
              id: 1
            - enabled: false
              url: https://anti-ad.net/easylist.txt
              name: anti-AD
              id: 900001
          whitelist_filters: []
          user_rules: []
          filtering:
            blocking_ipv4: ""
            blocking_ipv6: ""
            protection_enabled: true
            filtering_enabled: true
            filters_update_interval: 24
            parental_enabled: false
            safesearch_enabled: false
            safebrowsing_enabled: false
            rewrites: []
          dhcp:
            enabled: false
            interface_name: ""
            local_domain_name: lan
          clients:
            runtime_sources:
              whois: true
              arp: true
              rdns: true
              dhcp: true
              hosts: true
            persistent: []
          log:
            file: ""
            max_backups: 0
            max_size: 100
            max_age: 3
            compress: false
            localtime: false
            verbose: false
          os:
            group: ""
            user: ""
            rlimit_nofile: 0
          schema_version: 29
          EOF

          # AdGuard filter defaults are applied non-destructively after the
          # clean installs ship /etc/adguardhome.yaml and retained upgrades preserve it.
          # Existing user filter choices are preserved; anti-AD is preloaded
          # when it is missing but remains disabled by default. AdGuard Home's clean-install defaults keep
          # AdGuard DNS filter enabled and AdAway disabled.
          cat > files/usr/bin/doornet2-adguard-filter-defaults <<'EOF'
          #!/bin/sh

          CFG='/etc/adguardhome.yaml'
          ANTI_URL='https://anti-ad.net/easylist.txt'

          [ -s "$CFG" ] || exit 0
          grep -Fq "$ANTI_URL" "$CFG" && exit 0

          TMP="/tmp/adguardhome.yaml.doornet2.$$"
          WAS_RUNNING=0

          if pidof AdGuardHome >/dev/null 2>&1; then
              WAS_RUNNING=1
              /etc/init.d/adguardhome stop >/dev/null 2>&1 || true
              sleep 1
          fi

          awk '
          BEGIN { inserted = 0 }
          /^filters:[[:space:]]*\[\][[:space:]]*$/ && !inserted {
              print "filters:"
              print "  - enabled: false"
              print "    url: https://anti-ad.net/easylist.txt"
              print "    name: anti-AD"
              print "    id: 900001"
              inserted = 1
              next
          }
          /^filters:[[:space:]]*$/ && !inserted {
              print
              print "  - enabled: false"
              print "    url: https://anti-ad.net/easylist.txt"
              print "    name: anti-AD"
              print "    id: 900001"
              inserted = 1
              next
          }
          { print }
          END {
              if (!inserted) {
                  print "filters:"
                  print "  - enabled: false"
                  print "    url: https://anti-ad.net/easylist.txt"
                  print "    name: anti-AD"
                  print "    id: 900001"
              }
          }
          ' "$CFG" >"$TMP"

          if grep -Fq "$ANTI_URL" "$TMP"; then
              cat "$TMP" >"$CFG"
              sync
          fi
          rm -f "$TMP"

          if [ "$WAS_RUNNING" = '1' ]; then
              if [ -x /etc/init.d/doornet2-dns-chain ]; then
                  /etc/init.d/doornet2-dns-chain restart >/dev/null 2>&1 || true
              else
                  /etc/init.d/adguardhome start >/dev/null 2>&1 || true
              fi
          fi

          exit 0
          EOF

          chmod 755 files/usr/bin/doornet2-adguard-filter-defaults
          sh -n files/usr/bin/doornet2-adguard-filter-defaults

          # Copy the package's native AdGuard init script into the rootfs
          # overlay, then override only service_triggers().  This preserves
          # package-specific start/stop behavior while removing interface-up
          # auto-restarts that can race SmartDNS.  Configuration reloads are
          # still supported.
          ADGUARD_INIT_SRC="$(
            find feeds -type f -path '*/adguardhome/files/adguardhome.init' -print | head -n 1
          )"

          if [ -z "$ADGUARD_INIT_SRC" ] || [ ! -f "$ADGUARD_INIT_SRC" ]; then
              echo "ERROR: AdGuard Home init source not found"
              exit 1
          fi

          cp "$ADGUARD_INIT_SRC" files/etc/init.d/adguardhome

          cat >> files/etc/init.d/adguardhome <<'EOF'

          # DoorNet2 V5.3.3: DNS-chain helper owns WAN/boot ordering.
          # Do not let AdGuard independently restart on interface-up events.
          service_triggers()
          {
              procd_add_reload_trigger "adguardhome"
          }
          EOF

          chmod 755 files/etc/init.d/adguardhome
          sh -n files/etc/init.d/adguardhome

          cat > files/etc/uci-defaults/97-doornet2-network-apps <<'EOF'
          #!/bin/sh

          # R4 validated DNS topology:
          #   dnsmasq :53 -> AdGuard Home :3053 -> SmartDNS :6053
          #
          # Clean-install safety:
          # - SmartDNS is prepared on :6053.
          # - SmartDNS never auto-rewrites dnsmasq.
          # - A baseline AdGuard config is shipped on :3053 with SmartDNS :6053
          #   as upstream; retained upgrades preserve the user's existing YAML.
          # - dnsmasq is only switched after AdGuard is actually listening on
          #   :3053, so even an invalid/edited YAML cannot take DNS offline.

          CUR_ENABLED="$(uci -q get smartdns.@smartdns[0].enabled)"
          CUR_PORT="$(uci -q get smartdns.@smartdns[0].port)"

          # Apply the DoorNet2 preset only to the package's clean/default state.
          # Existing user SmartDNS configurations are left intact on retained
          # sysupgrades.
          if [ -z "$CUR_PORT" ] || \
             { [ "$CUR_ENABLED" = "0" ] && [ "$CUR_PORT" = "53" ]; }
          then
              uci -q set smartdns.@smartdns[0].enabled='1'
              uci -q set smartdns.@smartdns[0].port='6053'
              uci -q set smartdns.@smartdns[0].auto_set_dnsmasq='0'

              while uci -q delete smartdns.@server[0] >/dev/null 2>&1; do
                  :
              done

              ALI="$(uci add smartdns server)"
              uci -q set smartdns."$ALI".name='AliDNS'
              uci -q set smartdns."$ALI".ip='223.5.5.5'
              uci -q set smartdns."$ALI".port='53'

              DNSPOD="$(uci add smartdns server)"
              uci -q set smartdns."$DNSPOD".name='DNSPod'
              uci -q set smartdns."$DNSPOD".ip='119.29.29.29'
              uci -q set smartdns."$DNSPOD".port='53'

              uci -q commit smartdns
              CUR_PORT='6053'
          fi

          if [ "$CUR_PORT" = "6053" ] && [ -x /etc/init.d/smartdns ]; then
              /etc/init.d/smartdns enable >/dev/null 2>&1 || true
          fi

          # Retained sysupgrades preserve /etc/smartdns/, so merge the
          # V5.3.3 field-validated proxy-domain rules non-destructively.
          SMARTDNS_CUSTOM='/etc/smartdns/custom.conf'
          mkdir -p /etc/smartdns
          touch "$SMARTDNS_CUSTOM"
          for RULE in \
              'server-tcp 1.1.1.1:53 -group proxy-test' \
              'server-tcp 8.8.8.8:53 -group proxy-test' \
              'nameserver /chatgpt.com/proxy-test' \
              'nameserver /openai.com/proxy-test' \
              'nameserver /oaistatic.com/proxy-test' \
              'nameserver /oaiusercontent.com/proxy-test' \
              'nameserver /openaimerge.com/proxy-test' \
              'address /chatgpt.com/#6' \
              'address /openai.com/#6' \
              'address /oaistatic.com/#6' \
              'address /oaiusercontent.com/#6' \
              'address /openaimerge.com/#6' \
              'nameserver /openai.com.cdn.cloudflare.net/proxy-test' \
              'address /openai.com.cdn.cloudflare.net/#6' \
              'nameserver /x.com/proxy-test' \
              'address /x.com/#6' \
              'nameserver /twitter.com/proxy-test' \
              'address /twitter.com/#6' \
              'nameserver /twimg.com/proxy-test' \
              'address /twimg.com/#6' \
              'nameserver /t.co/proxy-test' \
              'address /t.co/#6'
          do
              grep -Fxq "$RULE" "$SMARTDNS_CUSTOM" || echo "$RULE" >>"$SMARTDNS_CUSTOM"
          done

          # DoorNet2 DNS-chain helper is the sole boot coordinator for
          # AdGuard Home.  Disable AdGuard's own rc.d boot symlink so it cannot
          # race SmartDNS and generate transient 127.0.0.1:6053 connection
          # refusals.  The service remains fully usable and is started by
          # doornet2-dns-chain only after SmartDNS :6053 is listening.
          if [ -x /etc/init.d/adguardhome ]; then
              if [ -s /etc/adguardhome.yaml ]; then
                  [ -x /usr/bin/doornet2-adguard-filter-defaults ] && \
                    /usr/bin/doornet2-adguard-filter-defaults >/dev/null 2>&1 || true
                  /etc/init.d/adguardhome disable >/dev/null 2>&1 || true
              fi
          fi

          if [ -x /etc/init.d/doornet2-dns-chain ]; then
              /etc/init.d/doornet2-dns-chain enable >/dev/null 2>&1 || true
              /etc/init.d/doornet2-dns-chain start >/dev/null 2>&1 || true
          fi

          exit 0
          EOF

          chmod 755 files/etc/uci-defaults/97-doornet2-network-apps
          sh -n files/etc/uci-defaults/97-doornet2-network-apps

          cat > files/etc/init.d/doornet2-dns-chain <<'EOF'
          #!/bin/sh /etc/rc.common

          START=98
          STOP=12

          LOG="/tmp/doornet2-dns-chain.log"

          log_msg()
          {
              echo "$(date '+%Y-%m-%d %H:%M:%S') $*" >>"$LOG"
          }

          port_ready()
          {
              netstat -lnptu 2>/dev/null \
                | grep -E "[:.]$1[[:space:]]" \
                >/dev/null 2>&1
          }

          dns_query_port_ok()
          {
              port="$1"
              nslookup -port="$port" www.baidu.com 127.0.0.1 >/dev/null 2>&1 || \
              nslookup -port="$port" www.qq.com 127.0.0.1 >/dev/null 2>&1
          }

          set_dnsmasq_upstream()
          {
              target="$1"
              uci -q delete dhcp.@dnsmasq[0].server
              uci -q add_list dhcp.@dnsmasq[0].server="$target"
              uci -q set dhcp.@dnsmasq[0].noresolv='1'
              uci -q commit dhcp
              /etc/init.d/dnsmasq restart >/dev/null 2>&1 || true
              sleep 2
          }

          prepare_smartdns()
          {
              if ! uci -q get smartdns.@smartdns[0] >/dev/null 2>&1; then
                  return 1
              fi

              uci -q set smartdns.@smartdns[0].enabled='1'
              uci -q set smartdns.@smartdns[0].port='6053'
              uci -q set smartdns.@smartdns[0].auto_set_dnsmasq='0'
              uci -q commit smartdns

              /etc/init.d/smartdns enable >/dev/null 2>&1 || true
              /etc/init.d/smartdns restart >/dev/null 2>&1 || true

              i=0
              while [ "$i" -lt 45 ]; do
                  if port_ready 6053 && dns_query_port_ok 6053; then
                      return 0
                  fi
                  sleep 1
                  i=$((i + 1))
              done
              return 1
          }

          activate_fallback()
          {
              # PassWall ChinaDNS-NG is internal-only.  Client DNS must not
              # depend on its 11400/15353 chain, so keep global DNS redirect
              # disabled for future PassWall restarts.
              if uci -q get passwall.@global[0] >/dev/null 2>&1; then
                  uci -q set passwall.@global[0].dns_redirect='0'
                  uci -q commit passwall
              fi

              if ! dns_query_port_ok 6053; then
                  log_msg "ERROR: SmartDNS :6053 direct query failed"
                  return 1
              fi

              set_dnsmasq_upstream '127.0.0.1#6053'
              log_msg "DNS fallback healthy: dnsmasq:53 -> SmartDNS:6053"
              return 0
          }

          try_activate_adguard()
          {
              pidof AdGuardHome >/dev/null 2>&1 || return 1
              port_ready 3053 || return 1
              dns_query_port_ok 3053 || return 1

              set_dnsmasq_upstream '127.0.0.1#3053'
              log_msg "DNS primary healthy: dnsmasq:53 -> AdGuard:3053 -> SmartDNS:6053"
              return 0
          }

          start()
          {
              (
                  : >"$LOG"
                  log_msg "R4 V5.3.5 DNS failover coordinator started"

                  if ! prepare_smartdns; then
                      log_msg "ERROR: SmartDNS :6053 not ready/queryable; leaving existing dnsmasq config unchanged"
                      exit 0
                  fi
                  log_msg "SmartDNS :6053 ready and queryable"

                  # Always establish the safe path first.  This makes retained
                  # online upgrades survivable even when AdGuard's preserved
                  # YAML cannot be parsed by the runtime.
                  activate_fallback || true

                  [ -x /usr/bin/doornet2-adguard-filter-defaults ] && \
                    /usr/bin/doornet2-adguard-filter-defaults >/dev/null 2>&1 || true

                  if [ ! -s /etc/adguardhome.yaml ] || [ ! -x /etc/init.d/adguardhome ]; then
                      log_msg "AdGuard config/service missing; SmartDNS fallback retained"
                      exit 0
                  fi

                  # Bounded retry: no more endless start storms when a retained
                  # configuration is incompatible.
                  attempt=1
                  while [ "$attempt" -le 3 ]; do
                      /etc/init.d/adguardhome restart >/dev/null 2>&1 || true

                      wait=0
                      while [ "$wait" -lt 10 ]; do
                          if try_activate_adguard; then
                              log_msg "AdGuard activated on attempt $attempt"
                              exit 0
                          fi
                          sleep 1
                          wait=$((wait + 1))
                      done

                      log_msg "AdGuard attempt $attempt failed"
                      attempt=$((attempt + 1))
                      sleep 3
                  done

                  /etc/init.d/adguardhome stop >/dev/null 2>&1 || true
                  activate_fallback >/dev/null 2>&1 || true
                  log_msg "AdGuard unavailable after bounded retries; SmartDNS fallback retained"
              ) &
          }

          stop()
          {
              :
          }
          EOF

          chmod 755 files/etc/init.d/doornet2-dns-chain
          sh -n files/etc/init.d/doornet2-dns-chain

          cat > files/usr/bin/doornet2-dns-postpasswall <<'EOF'
          #!/bin/sh

          export PATH=/usr/sbin:/usr/bin:/sbin:/bin

          LOG='/tmp/doornet2-dns-chain.log'
          PW_DNSMASQ='/tmp/dnsmasq.d/dnsmasq-passwall.conf'
          CHINADNS_CFG='/tmp/etc/passwall/acl/default/chinadns_ng.conf'
          CHANGED=0

          log_msg()
          {
              echo "$(date '+%Y-%m-%d %H:%M:%S') post-passwall: $*" >>"$LOG"
          }

          port_ready()
          {
              netstat -lnptu 2>/dev/null | grep -E "[:.]$1[[:space:]]" >/dev/null 2>&1
          }

          dns_query_port_ok()
          {
              port="$1"
              nslookup -port="$port" www.baidu.com 127.0.0.1 >/dev/null 2>&1 || \
              nslookup -port="$port" www.qq.com 127.0.0.1 >/dev/null 2>&1
          }

          set_upstream()
          {
              target="$1"
              current="$(uci -q get dhcp.@dnsmasq[0].server)"
              if [ "$current" != "$target" ] || \
                 [ "$(uci -q get dhcp.@dnsmasq[0].noresolv)" != '1' ]; then
                  uci -q delete dhcp.@dnsmasq[0].server
                  uci -q add_list dhcp.@dnsmasq[0].server="$target"
                  uci -q set dhcp.@dnsmasq[0].noresolv='1'
                  uci -q commit dhcp
                  /etc/init.d/dnsmasq restart >/dev/null 2>&1 || true
                  sleep 2
                  CHANGED=1
              fi
          }

          restart_chinadns_only()
          {
              [ -x /tmp/etc/passwall/bin/chinadns-ng ] || return 1
              [ -s "$CHINADNS_CFG" ] || return 1

              killall chinadns-ng >/dev/null 2>&1 || true
              sleep 1
              /tmp/etc/passwall/bin/chinadns-ng -C "$CHINADNS_CFG" \
                >/tmp/chinadns-ng-doornet2.log 2>&1 &
              sleep 2
              pidof chinadns-ng >/dev/null 2>&1
          }

          fix_passwall_chinadns_upstream()
          {
              [ -s "$CHINADNS_CFG" ] || return 0

              # Real-device V5.3.4 diagnosis proved that a dead AdGuard :3053
              # here makes domestic/direct DNS stall for 5 seconds while the
              # proxy trust DNS still works.  ChinaDNS-NG is PassWall-internal,
              # so its local domestic/direct/vps upstream is deliberately
              # independent of AdGuard and always uses SmartDNS :6053.
              if ! dns_query_port_ok 6053; then
                  log_msg "ERROR: SmartDNS :6053 failed; ChinaDNS upstream left unchanged"
                  return 1
              fi

              before="$(grep -E '^(china-dns|group-upstream)[[:space:]]+127\.0\.0\.1#(3053|6053)[[:space:]]*$' "$CHINADNS_CFG" 2>/dev/null)"

              sed -i \
                -e 's|^china-dns 127\.0\.0\.1#3053$|china-dns 127.0.0.1#6053|' \
                -e 's|^group-upstream 127\.0\.0\.1#3053$|group-upstream 127.0.0.1#6053|' \
                "$CHINADNS_CFG"

              after="$(grep -E '^(china-dns|group-upstream)[[:space:]]+127\.0\.0\.1#(3053|6053)[[:space:]]*$' "$CHINADNS_CFG" 2>/dev/null)"

              if [ "$before" != "$after" ]; then
                  log_msg "ChinaDNS domestic/direct/vps upstream corrected: 3053 -> 6053"
                  restart_chinadns_only || log_msg "ERROR: ChinaDNS-NG restart failed after upstream correction"
                  CHANGED=1
              fi

              if pidof chinadns-ng >/dev/null 2>&1 && dns_query_port_ok 15353; then
                  log_msg "ChinaDNS-NG :15353 domestic query healthy via SmartDNS :6053"
              else
                  log_msg "ERROR: ChinaDNS-NG :15353 domestic query failed"
              fi
          }

          # ChinaDNS-NG remains PassWall-internal only.
          if [ -f "$PW_DNSMASQ" ] && \
             grep -Eq '^(server=127\.0\.0\.1#15353|all-servers|no-poll|no-resolv)[[:space:]]*$' "$PW_DNSMASQ"
          then
              rm -f "$PW_DNSMASQ"
              log_msg "removed PassWall global dnsmasq bypass"
              CHANGED=1
          fi

          # Repair the actual PassWall internal DNS chain first.  This runs
          # after every PassWall start/restart and prevents regenerated 3053
          # references from reintroducing the V5.3.4 five-second timeout.
          fix_passwall_chinadns_upstream || true

          # Main client DNS may use AdGuard only when :3053 answers real DNS
          # queries.  Otherwise retain the verified SmartDNS fallback.
          if pidof AdGuardHome >/dev/null 2>&1 && \
             port_ready 3053 && dns_query_port_ok 3053; then
              set_upstream '127.0.0.1#3053'
              log_msg "AdGuard primary DNS confirmed by direct :3053 query"
          else
              set_upstream '127.0.0.1#6053'
              if dns_query_port_ok 6053; then
                  log_msg "AdGuard not healthy; SmartDNS :6053 fallback retained"
              else
                  log_msg "ERROR: SmartDNS fallback query failed"
              fi
          fi

          [ "$CHANGED" = '1' ] && log_msg "DNS policy corrected after PassWall event"
          exit 0
          EOF

          chmod 755 files/usr/bin/doornet2-dns-postpasswall
          sh -n files/usr/bin/doornet2-dns-postpasswall

          echo "===== R4 NETWORK DEFAULTS ====="
          grep -nE \
            '6053|223\.5\.5\.5|119\.29\.29\.29|auto_set_dnsmasq|3053' \
            files/etc/uci-defaults/97-doornet2-network-apps
          sh -n files/etc/init.d/doornet2-dns-chain



      # ============================================================
      # 3B. R4 PassWall shunt presets + route-aware boot guard
      # ============================================================

      - name: Add DoorNet2 R4 PassWall shunt presets and delayed restart
        run: |
          set -e

          mkdir -p \
            files/etc/uci-defaults \
            files/etc/init.d

          cat > files/etc/uci-defaults/96-doornet2-passwall-shunt <<'EOF'
          #!/bin/sh

          # Always enable the boot guard if it exists.
          if [ -x /etc/init.d/passwall-delay ]; then
              /etc/init.d/passwall-delay enable >/dev/null 2>&1 || true
          fi

          # Remove the legacy PassWall stock myshunt only when it is still
          # untouched. This also cleans up retained upgrades from R3 without
          # deleting a user-customized legacy shunt.
          if [ "$(uci -q get passwall.myshunt.remarks)" = "分流总节点" ] && \
             [ "$(uci -q get passwall.myshunt.type)" = "Xray" ] && \
             [ "$(uci -q get passwall.myshunt.protocol)" = "_shunt" ] && \
             [ "$(uci -q get passwall.myshunt.DirectGame)" = "_direct" ] && \
             [ "$(uci -q get passwall.myshunt.ProxyGame)" = "_default" ] && \
             [ "$(uci -q get passwall.myshunt.AIGC)" = "_default" ] && \
             [ "$(uci -q get passwall.myshunt.Streaming)" = "_default" ] && \
             [ "$(uci -q get passwall.myshunt.Proxy)" = "_default" ] && \
             [ "$(uci -q get passwall.myshunt.Direct)" = "_direct" ] && \
             [ "$(uci -q get passwall.myshunt.default_node)" = "_direct" ]
          then
              uci -q delete passwall.myshunt
              uci -q commit passwall
          fi

          # R4 system-owned forced-direct rule. Apply it even on a retained
          # sysupgrade so the new firmware can add these safe direct domains
          # without overwriting the user's other shunt/node selections.
          uci -q delete passwall.DN_ForcedDirect
          uci -q set passwall.DN_ForcedDirect='shunt_rules'
          uci -q set passwall.DN_ForcedDirect.remarks='DoorNet2 强制直连'
          uci -q set passwall.DN_ForcedDirect.network='tcp,udp'
          uci -q set "passwall.DN_ForcedDirect.domain_list=api.example.com
          domain:speedtest.net"

          # High-priority mainland Tencent/WeChat media path.  V5.1
          # field testing showed that text messages could work while photo
          # uploads failed when WeChat and Tencent CDN domains used different
          # exits.  Keep the whole family on one direct mainland path.
          uci -q delete passwall.DN_TencentDirect
          uci -q set passwall.DN_TencentDirect='shunt_rules'
          uci -q set passwall.DN_TencentDirect.remarks='微信 / QQ / 腾讯媒体强制直连'
          uci -q set passwall.DN_TencentDirect.network='tcp,udp'
          uci -q set "passwall.DN_TencentDirect.domain_list=domain:wechat.com
          domain:weixin.qq.com
          domain:wx.qq.com
          domain:wechatapp.com
          domain:qpic.cn
          domain:qq.com
          domain:qzone.qq.com
          domain:gtimg.com
          domain:idqqimg.com
          domain:qlogo.cn
          domain:weixinbridge.com"

          # High-priority ChatGPT login path. OpenAI's login flow also uses
          # WorkOS, Cloudflare challenge, Stripe/Intercom telemetry endpoints
          # and one Apple endpoint. Keep the whole login transaction on the
          # same proxy egress as DN_OpenAI to avoid mixed-exit login failures.
          uci -q delete passwall.DN_ChatGPT_Login
          uci -q set passwall.DN_ChatGPT_Login='shunt_rules'
          uci -q set passwall.DN_ChatGPT_Login.remarks='ChatGPT 登录完整链路'
          uci -q set passwall.DN_ChatGPT_Login.network='tcp,udp'
          uci -q set "passwall.DN_ChatGPT_Login.domain_list=domain:auth.openai.com
          domain:chatgpt.com
          domain:ct.sendgrid.net
          domain:intercom.io
          domain:intercomcdn.com
          domain:oaistatic.com
          domain:oaiusercontent.com
          domain:openai.com
          domain:oaistatsig.com
          auth0.openai.com
          cdn.openaimerge.com
          cdn.workos.com
          challenges.cloudflare.com
          forwarder.workos.com
          humb.apple.com
          images.workoscdn.com
          js.intercomcdn.com
          js.stripe.com
          o207216.ingest.sentry.io
          o33249.ingest.sentry.io
          rum.browser-intake-datadoghq.com
          setup.auth.openai.com
          setup.workos.com
          workos.imgix.net"

          # Keep system-owned safety/login rules ahead of broad service rules.
          uci -q reorder passwall.DN_ForcedDirect=0 >/dev/null 2>&1 || true
          uci -q reorder passwall.DN_TencentDirect=1 >/dev/null 2>&1 || true
          uci -q reorder passwall.DN_ChatGPT_Login=2 >/dev/null 2>&1 || true

          # Broad umbrella rows stay visible but must not overlap the dedicated
          # per-service rules. Clear only the stock DoorNet2 definitions.
          if [ "$(uci -q get passwall.DN_AIGC.remarks)" = "AIGC" ]; then
              uci -q delete passwall.DN_AIGC.domain_list
              uci -q delete passwall.DN_AIGC.ip_list
          fi
          if [ "$(uci -q get passwall.DN_Streaming.remarks)" = "Streaming" ]; then
              uci -q delete passwall.DN_Streaming.domain_list
              uci -q delete passwall.DN_Streaming.ip_list
          fi
          if [ "$(uci -q get passwall.DN_ProxyGame.remarks)" = "ProxyGame" ]; then
              uci -q delete passwall.DN_ProxyGame.domain_list
              uci -q delete passwall.DN_ProxyGame.ip_list
          fi

          # Visible-label migration only. Keep the internal UCI section name
          # R4Shunt unchanged so retained upgrades preserve every user-selected
          # service node. V5.3.3 used "R4 分流总节点"; the new visible label is
          # simply "分流总节点".
          R4_REMARK="$(uci -q get passwall.R4Shunt.remarks)"
          if [ "$R4_REMARK" = "R4 分流总节点" ]; then
              uci -q set passwall.R4Shunt.remarks='分流总节点'
              R4_REMARK='分流总节点'
          fi

          # Do not overwrite a previously customized R4 preset. Attach the
          # system direct rule and, when possible, inherit DN_OpenAI's concrete
          # node for the ChatGPT login path. Leave all other dropdowns untouched.
          if [ "$R4_REMARK" = "分流总节点" ]; then
              uci -q set passwall.R4Shunt.DN_ForcedDirect='_direct'
              uci -q set passwall.R4Shunt.DN_TencentDirect='_direct'
              uci -q set passwall.R4Shunt.DN_WeChat='_direct'
              uci -q set passwall.R4Shunt.DN_QQ='_direct'

              if [ -z "$(uci -q get passwall.R4Shunt.DN_ChatGPT_Login)" ]; then
                  OPENAI_NODE="$(uci -q get passwall.R4Shunt.DN_OpenAI)"
                  case "$OPENAI_NODE" in
                      ""|_direct|_default|_blackhole)
                          :
                          ;;
                      *)
                          uci -q set "passwall.R4Shunt.DN_ChatGPT_Login=$OPENAI_NODE"
                          ;;
                  esac
              fi

              # Proxy services use IPv4 only while direct/domestic traffic
              # keeps native dual-stack.  Field-tested on DoorNet2 V5.2.
              if uci -q get passwall.@global[0] >/dev/null 2>&1; then
                  uci -q set passwall.@global[0].filter_proxy_ipv6='1'
              fi
              if uci -q get passwall.@global_forwarding[0] >/dev/null 2>&1; then
                  uci -q set passwall.@global_forwarding[0].ipv6_tproxy='0'
              fi

              uci -q commit passwall
              exit 0
          fi

          add_rule()
          {
              id="$1"
              remarks="$2"
              domains="$3"
              ips="$4"

              uci -q delete "passwall.$id"
              uci -q set "passwall.$id=shunt_rules"
              uci -q set "passwall.$id.remarks=$remarks"
              uci -q set "passwall.$id.network=tcp,udp"

              if [ -n "$domains" ]; then
                  domain_list="$(
                      printf '%s' "$domains" \
                        | tr ',' '\n' \
                        | sed '/^$/d;s/^/domain:/'
                  )"
                  uci -q set "passwall.$id.domain_list=$domain_list"
              fi

              if [ -n "$ips" ]; then
                  ip_list="$(
                      printf '%s' "$ips" \
                        | tr ',' '\n' \
                        | sed '/^$/d'
                  )"
                  uci -q set "passwall.$id.ip_list=$ip_list"
              fi
          }

          # Mainland communication
          add_rule DN_WeChat "WeChat / 微信" \
            "wechat.com,weixin.qq.com,wx.qq.com,wechatapp.com,qpic.cn,weixinbridge.com" ""
          add_rule DN_QQ "QQ / 腾讯" \
            "qq.com,qzone.qq.com,gtimg.com,idqqimg.com,qlogo.cn" ""

          # Overseas communication
          add_rule DN_LINE "LINE" \
            "line.me,line-apps.com,line-scdn.net,lin.ee,line.naver.jp" ""
          add_rule DN_WhatsApp "WhatsApp" \
            "whatsapp.com,whatsapp.net" ""
          add_rule DN_Signal "Signal" \
            "signal.org,signal.art,whispersystems.org" ""
          add_rule DN_Telegram "Telegram" \
            "telegram.org,t.me,telegram.me,telegra.ph" \
            "149.154.160.0/20,91.108.4.0/22,91.108.8.0/22,91.108.56.0/22"
          add_rule DN_Discord "Discord" \
            "discord.com,discord.gg,discordapp.com,discordapp.net,discordcdn.com" ""

          # Social
          add_rule DN_Facebook "Facebook / Messenger" \
            "facebook.com,fbcdn.net,fb.me,fbsbx.com,messenger.com" ""
          add_rule DN_Instagram "Instagram" \
            "instagram.com,cdninstagram.com" ""
          add_rule DN_XTwitter "X / Twitter" \
            "x.com,twitter.com,twimg.com,t.co" ""
          add_rule DN_Reddit "Reddit" \
            "reddit.com,redditmedia.com,redditstatic.com,redd.it" ""

          # Google
          add_rule DN_YouTube "YouTube" \
            "youtube.com,youtu.be,ytimg.com,googlevideo.com,youtube-nocookie.com" ""
          add_rule DN_GoogleAI "Google AI / Gemini" \
            "gemini.google.com,ai.google.dev,generativelanguage.googleapis.com,aistudio.google.com,deepmind.google" ""
          add_rule DN_GmailDrive "Gmail / Google Drive" \
            "gmail.com,mail.google.com,drive.google.com,docs.google.com" ""
          add_rule DN_Google "Google" \
            "google.com,gstatic.com,googleapis.com,googleusercontent.com,ggpht.com" ""

          # AI
          add_rule DN_OpenAI "OpenAI / ChatGPT" \
            "openai.com,chatgpt.com,auth.openai.com,oaistatic.com,oaiusercontent.com,oaistatsig.com" ""
          add_rule DN_Claude "Claude / Anthropic" \
            "claude.ai,anthropic.com" ""
          add_rule DN_Perplexity "Perplexity" "perplexity.ai" ""
          add_rule DN_Copilot "Microsoft Copilot" \
            "copilot.microsoft.com,copilot.cloud.microsoft" ""
          add_rule DN_Grok "Grok / xAI" "grok.com,x.ai" ""

          # Streaming
          add_rule DN_Netflix "Netflix" \
            "netflix.com,nflxvideo.net,nflximg.net,nflxext.com,nflxso.net" ""
          add_rule DN_DisneyPlus "Disney+" \
            "disneyplus.com,dssott.com,bamgrid.com,disney-plus.net" ""
          add_rule DN_MaxHBO "Max / HBO" \
            "max.com,hbomax.com,hbo.com,hbogo.com" ""
          add_rule DN_PrimeVideo "Amazon Prime Video" \
            "primevideo.com,amazonvideo.com,aiv-cdn.net" ""
          add_rule DN_Spotify "Spotify" \
            "spotify.com,scdn.co,spotifycdn.com" ""
          add_rule DN_TikTok "TikTok" \
            "tiktok.com,tiktokcdn.com,tiktokv.com,byteoversea.com,ibytedtos.com,muscdn.com" ""

          # Platform / cloud / work
          add_rule DN_Apple "Apple / iCloud / App Store" \
            "apple.com,icloud.com,apple-cloudkit.com,mzstatic.com" ""
          add_rule DN_Microsoft "Microsoft / Office / OneDrive" \
            "microsoft.com,live.com,office.com,office365.com,onedrive.com" ""
          add_rule DN_GitHub "GitHub" \
            "github.com,githubusercontent.com,githubassets.com,github.io" ""
          add_rule DN_Slack "Slack" "slack.com,slack-edge.com" ""
          add_rule DN_Zoom "Zoom" "zoom.us,zoom.com" ""
          add_rule DN_Notion "Notion" \
            "notion.so,notion.site,notionusercontent.com" ""
          add_rule DN_Dropbox "Dropbox" \
            "dropbox.com,dropboxapi.com,dropboxusercontent.com" ""

          # Games
          add_rule DN_PlayStation "PlayStation" \
            "playstation.com,playstation.net,sonyentertainmentnetwork.com" ""
          add_rule DN_Nintendo "Nintendo" \
            "nintendo.com,nintendo.net,nintendo.co.jp" ""
          add_rule DN_Xbox "Xbox" \
            "xbox.com,xboxlive.com,xboxservices.com" ""

          # Local media + umbrella rules
          add_rule DN_LocalMedia "Emby / Jellyfin / Plex" \
            "emby.media,jellyfin.org,plex.tv" ""
          add_rule DN_AIGC "AIGC（汇总备用）" "" ""
          add_rule DN_Streaming "Streaming（汇总备用）" "" ""
          add_rule DN_ProxyGame "ProxyGame（汇总备用）" "" ""
          add_rule DN_DirectGame "DirectGame" "" ""

          # Create the shunt framework without embedding any personal node ID.
          # Every ordinary preset row starts unused (no mapping). The user
          # explicitly selects a node per service. Only the system-owned
          # DN_ForcedDirect rule is active by default.
          uci -q delete passwall.R4Shunt
          uci -q set passwall.R4Shunt='nodes'
          uci -q set passwall.R4Shunt.remarks='分流总节点'
          uci -q set passwall.R4Shunt.type='Xray'
          uci -q set passwall.R4Shunt.protocol='_shunt'
          uci -q set passwall.R4Shunt.domainStrategy='IPOnDemand'
          uci -q set passwall.R4Shunt.default_node='_direct'

          # Ordinary service rules intentionally have no R4Shunt mapping here,
          # which LuCI presents as unused/not selected on first boot.
          uci -q set passwall.R4Shunt.DN_ForcedDirect='_direct'
          uci -q set passwall.R4Shunt.DN_TencentDirect='_direct'
          uci -q set passwall.R4Shunt.DN_WeChat='_direct'
          uci -q set passwall.R4Shunt.DN_QQ='_direct'

          # Domestic/direct traffic remains native IPv4 + IPv6.  Only domains
          # actually handled as PassWall proxy targets have AAAA filtered, so
          # proxy traffic stays IPv4-only and cannot leak/bypass over IPv6.
          if uci -q get passwall.@global[0] >/dev/null 2>&1; then
              uci -q set passwall.@global[0].filter_proxy_ipv6='1'
          fi
          if uci -q get passwall.@global_forwarding[0] >/dev/null 2>&1; then
              uci -q set passwall.@global_forwarding[0].ipv6_tproxy='0'
          fi

          # Do not change the user's current global on/off state or TCP node
          # during a retained sysupgrade.
          uci -q commit passwall

          exit 0
          EOF

          chmod 755 files/etc/uci-defaults/96-doornet2-passwall-shunt
          sh -n files/etc/uci-defaults/96-doornet2-passwall-shunt

          cat > files/etc/init.d/passwall-delay <<'EOF'
          #!/bin/sh /etc/rc.common

          START=99
          STOP=15

          LOG="/tmp/passwall-delay.log"

          start()
          {
              (
                  echo "$(date '+%Y-%m-%d %H:%M:%S') R4 PassWall guard starting" >"$LOG"

                  GLOBAL_ENABLED="$(uci -q get passwall.@global[0].enabled)"
                  SOCKS_ENABLED="$(uci -q get passwall.@global[0].socks_enabled)"

                  if [ "$GLOBAL_ENABLED" != "1" ] && [ "$SOCKS_ENABLED" != "1" ]; then
                      echo "$(date '+%Y-%m-%d %H:%M:%S') PassWall not enabled; no restart needed" >>"$LOG"
                      exit 0
                  fi

                  i=0
                  while [ "$i" -lt 30 ]; do
                      if ip route 2>/dev/null | grep -q '^default '; then
                          echo "$(date '+%Y-%m-%d %H:%M:%S') default route ready" >>"$LOG"
                          break
                      fi
                      sleep 1
                      i=$((i + 1))
                  done

                  sleep 5

                  # Avoid a redundant PassWall restart once the proxy core is already alive.
                  # A needless restart makes PassWall reload SmartDNS and can briefly drop :6053.
                  if ps w 2>/dev/null | grep -Eq '[x]ray|[s]ing-box'; then
                      echo "$(date '+%Y-%m-%d %H:%M:%S') PassWall proxy already running; skip restart" >>"$LOG"
                  else
                      echo "$(date '+%Y-%m-%d %H:%M:%S') proxy not running; restarting PassWall" >>"$LOG"
                      /etc/init.d/passwall restart >>"$LOG" 2>&1
                  fi

                  sleep 5
                  if ps w 2>/dev/null | grep -Eq '[x]ray|[s]ing-box'; then
                      echo "$(date '+%Y-%m-%d %H:%M:%S') PassWall proxy running" >>"$LOG"
                  else
                      echo "$(date '+%Y-%m-%d %H:%M:%S') PassWall proxy not running after guard" >>"$LOG"
                  fi
              ) &
          }

          stop()
          {
              :
          }
          EOF

          chmod 755 files/etc/init.d/passwall-delay
          sh -n files/etc/init.d/passwall-delay

          # V5.3.3: retained sysupgrades can carry stale rc.d links from earlier builds.
          # Keep exactly the verified startup ownership:
          #   S19 passwall / S98 doornet2-dns-chain / S99 passwall-delay.
          cat > files/etc/uci-defaults/98-doornet2-rc-cleanup <<'EOF'
          #!/bin/sh

          # Remove stale duplicate start links observed on retained V5.3.1 upgrades.
          rm -f /etc/rc.d/S99passwall
          rm -f /etc/rc.d/S19passwall-delay

          # Recreate only the service-native links from their START values.
          if [ -x /etc/init.d/passwall ]; then
              /etc/init.d/passwall enable >/dev/null 2>&1 || true
          fi
          if [ -x /etc/init.d/doornet2-dns-chain ]; then
              /etc/init.d/doornet2-dns-chain enable >/dev/null 2>&1 || true
          fi
          if [ -x /etc/init.d/passwall-delay ]; then
              /etc/init.d/passwall-delay enable >/dev/null 2>&1 || true
          fi
          if [ -x /etc/init.d/doornet2-selfheal ]; then
              /etc/init.d/doornet2-selfheal enable >/dev/null 2>&1 || true
          fi

          # Re-assert that the two known-bad duplicates are absent even if an
          # older package postinst or preserved overlay attempted to recreate them.
          rm -f /etc/rc.d/S99passwall
          rm -f /etc/rc.d/S19passwall-delay

          exit 0
          EOF

          chmod 755 files/etc/uci-defaults/98-doornet2-rc-cleanup
          sh -n files/etc/uci-defaults/98-doornet2-rc-cleanup

          echo "===== R4 PASSWALL PRESETS ====="
          grep -nE \
            'R4Shunt|DN_ForcedDirect|DN_ChatGPT_Login|speedtest\.net|api\.example\.com|DN_WeChat|DN_LINE|DN_OpenAI|DN_Netflix|DN_AIGC|DN_Streaming' \
            files/etc/uci-defaults/96-doornet2-passwall-shunt \
            | head -100


      # ============================================================
      # 3C. R4 Final stability helpers
      #   - UU route-aware delayed recovery
      #   - read-only DoorNet2 health/self-check command
      # ============================================================

      - name: Add DoorNet2 R4 final stability helpers
        run: |
          set -e

          mkdir -p \
            files/etc/init.d \
            files/etc/uci-defaults \
            files/usr/bin

          cat > files/etc/uci-defaults/94-doornet2-final-helpers <<'EOF'
          #!/bin/sh

          # These guards are inert when their corresponding app is disabled.
          for svc in passwall-delay doornet2-dns-chain doornet2-selfheal doornet2-readiness; do
              if [ -x "/etc/init.d/$svc" ]; then
                  "/etc/init.d/$svc" enable >/dev/null 2>&1 || true
              fi
          done

          exit 0
          EOF

          chmod 755 files/etc/uci-defaults/94-doornet2-final-helpers
          sh -n files/etc/uci-defaults/94-doornet2-final-helpers

          cat > files/usr/bin/doornet2-health <<'EOF'
          #!/bin/sh

          ok()
          {
              printf '  [OK]   %s\n' "$*"
          }

          warn()
          {
              printf '  [WARN] %s\n' "$*"
          }

          info()
          {
              printf '  [INFO] %s\n' "$*"
          }

          echo "===== DoorNet2 R4 FINAL HEALTH CHECK ====="

          echo
          echo "===== RELEASE ====="
          if [ -r /etc/doornet2_release ]; then
              grep -E \
                "^DOORNET2_(VERSION|RELEASE|TAG|BOARD|BOOT_MODE|UPDATER|TF_CAPACITY|UI|PASSWALL|NETWORK_APPS|SHUNT|DNS_CHAIN|PASSWALL_DELAY|HEALTH|IP_POLICY|PERSISTENCE|WAN_POLICY|SELFHEAL|DNS_POSTPASSWALL|SMARTDNS_OPENAI)=" \
                /etc/doornet2_release 2>/dev/null || true
          else
              warn "/etc/doornet2_release missing"
          fi

          echo
          echo "===== ROOT / STORAGE ====="
          ROOT_SRC="$(mount | awk '$3=="/"{print $1; exit}')"
          ROOT_TYPE="$(mount | awk '$3=="/"{print $5; exit}')"
          info "root=$ROOT_SRC type=$ROOT_TYPE"

          ROOT_DISK="$(printf '%s\n' "$ROOT_SRC" | sed -n 's#^/dev/\(mmcblk[0-9]\+\)p[0-9]\+$#\1#p')"
          if [ -n "$ROOT_DISK" ] && [ -r "/sys/block/$ROOT_DISK/device/type" ]; then
              MMC_TYPE="$(cat "/sys/block/$ROOT_DISK/device/type" 2>/dev/null)"
              MMC_PATH="$(readlink -f "/sys/block/$ROOT_DISK/device" 2>/dev/null)"
              info "$ROOT_DISK type=$MMC_TYPE"
              info "$MMC_PATH"

              if [ "$MMC_TYPE" = "MMC" ] && echo "$MMC_PATH" | grep -q 'fe330000.mmc'; then
                  ok "root is physical eMMC"
              elif [ "$MMC_TYPE" = "SD" ] && echo "$MMC_PATH" | grep -q 'fe320000.mmc'; then
                  ok "root is physical TF/SD"
              else
                  warn "root MMC physical mapping is unexpected"
              fi
          fi

          df -h / 2>/dev/null || true

          echo
          echo "===== IPTABLES ====="
          if command -v iptables >/dev/null 2>&1; then
              iptables --version 2>/dev/null || true
              iptables -w -t nat -L >/dev/null 2>&1 && ok "IPv4 NAT" || warn "IPv4 NAT failed"
              iptables -w -t mangle -L >/dev/null 2>&1 && ok "IPv4 mangle" || warn "IPv4 mangle failed"
          else
              warn "iptables missing"
          fi

          if command -v ip6tables >/dev/null 2>&1; then
              ip6tables --version 2>/dev/null || true
              ip6tables -w -t filter -L >/dev/null 2>&1 && ok "IPv6 filter" || warn "IPv6 filter failed"
              ip6tables -w -t mangle -L >/dev/null 2>&1 && ok "IPv6 mangle" || warn "IPv6 mangle failed"
          else
              warn "ip6tables missing"
          fi

          echo
          echo "===== DNS CHAIN ====="
          DNSMASQ_SERVER="$(uci -q get dhcp.@dnsmasq[0].server)"
          DNSMASQ_NORESOLV="$(uci -q get dhcp.@dnsmasq[0].noresolv)"
          info "dnsmasq.server=${DNSMASQ_SERVER:-default}"
          info "dnsmasq.noresolv=${DNSMASQ_NORESOLV:-default}"

          netstat -lnptu 2>/dev/null | grep -E ':53 |:3000|:3053|:6053|:15353' || true

          if netstat -lnptu 2>/dev/null | grep -q ':6053 '; then
              ok "SmartDNS :6053 listening"
          else
              warn "SmartDNS :6053 not listening"
          fi

          if netstat -lnptu 2>/dev/null | grep -q ':3053 '; then
              ok "AdGuard DNS :3053 listening"
          else
              warn "AdGuard DNS :3053 not listening"
          fi

          if command -v nslookup >/dev/null 2>&1; then
              nslookup www.baidu.com 127.0.0.1 >/tmp/doornet2-health-dns.log 2>&1 \
                && ok "dnsmasq :53 query" \
                || warn "dnsmasq :53 query failed"
          fi

          echo
          echo "===== PASSWALL ====="
          PW_ENABLED="$(uci -q get passwall.@global[0].enabled)"
          PW_NODE="$(uci -q get passwall.@global[0].tcp_node)"
          PW_DNS_REDIRECT="$(uci -q get passwall.@global[0].dns_redirect)"
          info "enabled=${PW_ENABLED:-0}"
          info "tcp_node=${PW_NODE:-none}"
          info "dns_redirect=${PW_DNS_REDIRECT:-unset}"

          if ps w 2>/dev/null | grep -Eq '[x]ray|[s]ing-box'; then
              ok "PassWall proxy core running"
          else
              info "PassWall proxy core not running"
          fi

          netstat -lntp 2>/dev/null | grep -E ':1080|:1081' || true

          echo
          echo "===== DUAL-STACK / PROXY-IPv4 ====="
          info "wan.ipv6=$(uci -q get network.wan.ipv6)"
          info "wan.delegate=$(uci -q get network.wan.delegate)"
          info "wan6.auto=$(uci -q get network.wan6.auto)"
          info "wan6.disabled=$(uci -q get network.wan6.disabled)"
          info "lan.ip6assign=$(uci -q get network.lan.ip6assign)"
          info "lan.ra=$(uci -q get dhcp.lan.ra)"
          info "lan.dhcpv6=$(uci -q get dhcp.lan.dhcpv6)"
          info "filter_proxy_ipv6=$(uci -q get passwall.@global[0].filter_proxy_ipv6)"
          info "ipv6_tproxy=$(uci -q get passwall.@global_forwarding[0].ipv6_tproxy)"

          echo
          echo "===== BOOT GUARDS ====="
          for svc in passwall-delay doornet2-dns-chain doornet2-selfheal doornet2-readiness; do
              if [ -x "/etc/init.d/$svc" ]; then
                  /etc/init.d/"$svc" enabled >/dev/null 2>&1 \
                    && ok "$svc enabled" \
                    || warn "$svc disabled"
              else
                  warn "$svc missing"
              fi
          done

          echo
          echo "===== ONLINE UPDATE ====="
          [ -x /usr/bin/doornet2-updater ] \
            && ok "firmware updater installed" \
            || warn "firmware updater missing"

          [ -x /usr/bin/doornet2-app-updater ] \
            && ok "network-app updater installed" \
            || warn "network-app updater missing"

          [ -x /usr/bin/doornet2-passwall-updater ] \
            && ok "PassWall updater installed" \
            || warn "PassWall updater missing"

          echo
          echo "===== DONE ====="
          echo "Read-only check complete."
          EOF

          chmod 755 files/usr/bin/doornet2-health
          sh -n files/usr/bin/doornet2-health

          cat > files/usr/bin/doornet2-heal <<'EOF'
          #!/bin/sh

          export PATH=/usr/sbin:/usr/bin:/sbin:/bin

          LOG="/tmp/doornet2-selfheal.log"
          STATE_DIR="/tmp/doornet2-selfheal"
          mkdir -p "$STATE_DIR"

          log_msg()
          {
              echo "$(date '+%Y-%m-%d %H:%M:%S') $*" >>"$LOG"
              SIZE="$(wc -c <"$LOG" 2>/dev/null)"
              case "$SIZE" in ''|*[!0-9]*) SIZE=0 ;; esac
              if [ "$SIZE" -ge 131072 ]; then
                  tail -n 400 "$LOG" >"${LOG}.tmp"
                  mv "${LOG}.tmp" "$LOG"
              fi
          }

          clear_fail()
          {
              rm -f "$STATE_DIR/$1"
          }

          second_fail()
          {
              key="$1"
              n=0
              [ -r "$STATE_DIR/$key" ] && n="$(cat "$STATE_DIR/$key" 2>/dev/null)"
              case "$n" in ''|*[!0-9]*) n=0 ;; esac
              n=$((n + 1))
              echo "$n" >"$STATE_DIR/$key"
              [ "$n" -ge 2 ]
          }

          port_ready()
          {
              netstat -lnptu 2>/dev/null | grep -E "[:.]$1[[:space:]]" >/dev/null 2>&1
          }

          log_msg "self-heal check started mode=${1:-manual}"

          # A missing default route is reported but never triggers a whole-network
          # restart. This avoids PPPoE flapping; service repair resumes as soon as
          # WAN routing returns.
          if ! ip route 2>/dev/null | grep -q '^default '; then
              log_msg "WARN no default route; defer service repair"
              exit 2
          fi

          if [ "$(uci -q get smartdns.@smartdns[0].enabled)" = "1" ]; then
              if port_ready 6053; then
                  clear_fail smartdns
              elif second_fail smartdns; then
                  log_msg "repair SmartDNS :6053"
                  /etc/init.d/smartdns restart >>"$LOG" 2>&1 || true
                  clear_fail smartdns
              else
                  log_msg "SmartDNS miss 1/2"
              fi
          fi

          if [ -s /etc/adguardhome.yaml ]; then
              [ -x /usr/bin/doornet2-adguard-filter-defaults ] && \
                /usr/bin/doornet2-adguard-filter-defaults >>"$LOG" 2>&1 || true

              if port_ready 3053; then
                  clear_fail adguard
              elif second_fail adguard; then
                  log_msg "repair DNS policy / bounded AdGuard check"
                  /etc/init.d/doornet2-dns-chain restart >>"$LOG" 2>&1 || true
                  clear_fail adguard
              else
                  log_msg "AdGuard miss 1/2"
              fi
          fi

          if command -v nslookup >/dev/null 2>&1; then
              if nslookup www.baidu.com 127.0.0.1 >/dev/null 2>&1; then
                  clear_fail dns
              elif second_fail dns; then
                  log_msg "repair DNS chain/dnsmasq"
                  /etc/init.d/doornet2-dns-chain restart >>"$LOG" 2>&1 || true
                  sleep 3
                  /etc/init.d/dnsmasq restart >>"$LOG" 2>&1 || true
                  clear_fail dns
              else
                  log_msg "DNS query miss 1/2"
              fi
          fi

          PW_ENABLED="$(uci -q get passwall.@global[0].enabled)"
          PW_SOCKS_ENABLED="$(uci -q get passwall.@global[0].socks_enabled)"
          if [ "$PW_ENABLED" = "1" ] || [ "$PW_SOCKS_ENABLED" = "1" ]; then
              if ps w 2>/dev/null | grep -Eq '[x]ray|[s]ing-box'; then
                  clear_fail passwall
              elif second_fail passwall; then
                  log_msg "repair PassWall proxy core"
                  /etc/init.d/passwall restart >>"$LOG" 2>&1 || true
                  clear_fail passwall
              else
                  log_msg "PassWall proxy core miss 1/2"
              fi
          fi

          log_msg "self-heal check complete"
          exit 0
          EOF

          chmod 755 files/usr/bin/doornet2-heal
          sh -n files/usr/bin/doornet2-heal

          cat > files/usr/bin/doornet2-selfheal-loop <<'EOF'
          #!/bin/sh
          sleep 120
          while true; do
              /usr/bin/doornet2-heal auto >/dev/null 2>&1 || true
              sleep 300
          done
          EOF

          chmod 755 files/usr/bin/doornet2-selfheal-loop
          sh -n files/usr/bin/doornet2-selfheal-loop

          cat > files/etc/init.d/doornet2-selfheal <<'EOF'
          #!/bin/sh /etc/rc.common

          START=99
          STOP=10
          USE_PROCD=1

          start_service()
          {
              procd_open_instance
              procd_set_param command /usr/bin/doornet2-selfheal-loop
              procd_set_param respawn 3600 5 5
              procd_close_instance
          }
          EOF

          chmod 755 files/etc/init.d/doornet2-selfheal
          sh -n files/etc/init.d/doornet2-selfheal

          # Read-only boot readiness trace.  It records the actual order in
          # which WAN, IPv6, SmartDNS, AdGuard, dnsmasq and PassWall become
          # usable without changing the validated DNS or routing policy.
          cat > files/usr/bin/doornet2-readiness <<'EOF'
          #!/bin/sh

          export PATH=/usr/sbin:/usr/bin:/sbin:/bin
          LOG=/tmp/doornet2-boot.log
          : >"$LOG"

          log_msg()
          {
              echo "$(date '+%Y-%m-%d %H:%M:%S') $*" >>"$LOG"
          }

          port_ready()
          {
              netstat -lnptu 2>/dev/null | grep -E "[:.]$1[[:space:]]" >/dev/null 2>&1
          }

          wait_for()
          {
              label="$1"
              command="$2"
              timeout="$3"
              n=0
              while [ "$n" -lt "$timeout" ]; do
                  if eval "$command" >/dev/null 2>&1; then
                      log_msg "$label ready"
                      return 0
                  fi
                  n=$((n + 1))
                  sleep 1
              done
              log_msg "$label not ready after ${timeout}s"
              return 1
          }

          log_msg "system boot readiness started"
          log_msg "hostname=$(uci -q get system.@system[0].hostname 2>/dev/null)"

          wait_for "IPv4 default route" "ip -4 route 2>/dev/null | grep -q '^default '" 180 || true
          wait_for "IPv6 default route" "ip -6 route 2>/dev/null | grep -q '^default '" 180 || true
          wait_for "SmartDNS :6053" "port_ready 6053" 120 || true
          wait_for "local DNS query" "nslookup www.baidu.com 127.0.0.1" 60 || true

          DNS_NORESOLV="$(uci -q get dhcp.@dnsmasq[0].noresolv 2>/dev/null)"
          DNS_SERVER="$(uci -q get dhcp.@dnsmasq[0].server 2>/dev/null)"
          case ",$DNS_SERVER," in
              *,127.0.0.1#3053,*)
                  if pidof AdGuardHome >/dev/null 2>&1 && port_ready 3053; then
                      log_msg "dnsmasq primary chain active: noresolv=$DNS_NORESOLV server=127.0.0.1#3053"
                  else
                      log_msg "WARN dnsmasq points to 3053 but AdGuard is not healthy"
                  fi
                  ;;
              *,127.0.0.1#6053,*)
                  log_msg "dnsmasq fail-safe chain active: noresolv=$DNS_NORESOLV server=127.0.0.1#6053"
                  ;;
              *)
                  log_msg "WARN unexpected dnsmasq chain: noresolv=$DNS_NORESOLV server=$DNS_SERVER"
                  ;;
          esac

          if pidof AdGuardHome >/dev/null 2>&1 && port_ready 3053; then
              log_msg "AdGuard :3053 ready"
          else
              log_msg "AdGuard :3053 unavailable; fail-safe DNS is acceptable"
          fi

          if ps w 2>/dev/null | grep -Eq '[x]ray|[s]ing-box'; then
              log_msg "Xray/ sing-box ready"
          else
              log_msg "Xray/ sing-box not ready"
          fi

          log_msg "system boot readiness complete"
          exit 0
          EOF

          chmod 755 files/usr/bin/doornet2-readiness
          sh -n files/usr/bin/doornet2-readiness

          cat > files/etc/init.d/doornet2-readiness <<'EOF'
          #!/bin/sh /etc/rc.common

          START=99
          STOP=10

          start()
          {
              /usr/bin/doornet2-readiness >/dev/null 2>&1 &
          }

          stop()
          {
              :
          }
          EOF

          chmod 755 files/etc/init.d/doornet2-readiness
          sh -n files/etc/init.d/doornet2-readiness

          echo "===== R4 FINAL HELPERS ====="
          test -x files/etc/init.d/doornet2-selfheal
          test -x files/etc/uci-defaults/94-doornet2-final-helpers
          test -x files/usr/bin/doornet2-health
          test -x files/usr/bin/doornet2-heal
          test -x files/usr/bin/doornet2-readiness
          test -x files/etc/init.d/doornet2-readiness


      # ============================================================
      # 4. R4 Argon LuCI UI strategy
      #
      # Lua-compatible Argon shell with Bootstrap retained as fallback.
      # QuickStart stays installed only as an optional app.
      # ============================================================

      - name: Verify DoorNet2 Argon LuCI UI policy
        run: |
          set -e

          echo "===== VERIFY ARGON LUCI POLICY ====="

          test -x files/etc/uci-defaults/95-doornet2-ui
          sh -n files/etc/uci-defaults/95-doornet2-ui

          grep -q "luci-static/argon" \
            files/etc/uci-defaults/95-doornet2-ui

          grep -q "luci-static/bootstrap" \
            files/etc/uci-defaults/95-doornet2-ui

          grep -q "delete luci.themes.Design" \
            files/etc/uci-defaults/95-doornet2-ui

          grep -q "system.@system\[0\].hostname='OpenWrt'" \
            files/etc/uci-defaults/95-doornet2-ui
          ! grep -q "system.@system\[0\].hostname='DoorNet2'" \
            files/etc/uci-defaults/95-doornet2-ui

          test -f package/feeds/luci/luci-theme-argon/Makefile || \
            test -f feeds/luci/themes/luci-theme-argon/Makefile
          test ! -e package/lean/luci-theme-design
          test ! -e files/etc/config/design

          test -f files/usr/lib/lua/luci/view/themes/argon/header.htm
          test -f files/usr/lib/lua/luci/view/themes/argon/footer.htm
          grep -q 'OpenWrt</a>' files/usr/lib/lua/luci/view/themes/argon/header.htm
          grep -q 'ArgonTheme v1.8.1' files/usr/lib/lua/luci/view/themes/argon/footer.htm
          echo "29056b0619beeabd7198f9803d61edb02cf4b186dcc670631ee6527846ffc20e  extracted Slim Argon 1.8.1 payload"


      # ============================================================
      # 4A. R4 time + Argon first-boot enforcement
      #
      # No floating CPU/date/time badge is injected. RK3399 thermal
      # support remains untouched, so normal LuCI system information can
      # continue to expose CPU temperature if supported by the base tree.
      # ============================================================

      - name: Add DoorNet2 R4 time and Argon first-boot enforcement
        run: |
          set -e

          mkdir -p files/etc/uci-defaults

          cat > files/etc/uci-defaults/99-doornet2-argon-ui <<'EOF'
          #!/bin/sh

          # Run late on first boot so retained configs from older DoorNet2
          # releases cannot force Design/Bootstrap back as the active theme.
          uci -q set luci.themes.Bootstrap='/luci-static/bootstrap'
          uci -q set luci.themes.Argon='/luci-static/argon'
          uci -q delete luci.themes.Design
          uci -q set luci.main.mediaurlbase='/luci-static/argon'
          uci -q commit luci

          rm -f /etc/config/design

          rm -rf \
            /tmp/luci-indexcache \
            /tmp/luci-modulecache \
            /tmp/luci-templatecache

          exit 0
          EOF

          chmod 755 files/etc/uci-defaults/99-doornet2-argon-ui
          sh -n files/etc/uci-defaults/99-doornet2-argon-ui

          cat > files/etc/uci-defaults/98-doornet2-time <<'EOF'
          #!/bin/sh

          uci -q set system.@system[0].zonename='Asia/Shanghai'
          uci -q set system.@system[0].timezone='CST-8'

          if ! uci -q get system.ntp >/dev/null 2>&1; then
              uci -q set system.ntp='timeserver'
          fi

          uci -q set system.ntp.enabled='1'
          uci -q delete system.ntp.server
          uci -q add_list system.ntp.server='ntp.aliyun.com'
          uci -q add_list system.ntp.server='ntp.tencent.com'
          uci -q add_list system.ntp.server='0.openwrt.pool.ntp.org'
          uci -q add_list system.ntp.server='1.openwrt.pool.ntp.org'
          uci -q commit system

          if [ -x /etc/init.d/sysntpd ]; then
              /etc/init.d/sysntpd enable >/dev/null 2>&1 || true
              /etc/init.d/sysntpd restart >/dev/null 2>&1 || true
          fi

          rm -rf \
            /tmp/luci-indexcache \
            /tmp/luci-modulecache \
            /tmp/luci-templatecache

          exit 0
          EOF

          chmod 755 files/etc/uci-defaults/98-doornet2-time
          sh -n files/etc/uci-defaults/98-doornet2-time

          echo "===== R4 UI/TIME FILES ====="
          test -x files/etc/uci-defaults/98-doornet2-time
          test -x files/etc/uci-defaults/99-doornet2-argon-ui

          if find files -type f -print0 | xargs -0 grep -Il 'runtime-monitor\.js\|runtime-monitor\.css' 2>/dev/null | grep -q .; then
              echo "ERROR: floating runtime monitor references unexpectedly remain in files/."
              exit 1
          fi


      # ============================================================
      # 5. LAN / WAN
      # ============================================================

      - name: Set default LAN IP
        run: |
          set -e

          LAN_CONFIG="package/base-files/files/bin/config_generate"

          test -f "$LAN_CONFIG"

          sed -i \
            's/192\.168\.1\.1/192.168.100.1/g' \
            "$LAN_CONFIG"

          grep -n "192\.168\.100\.1" "$LAN_CONFIG" || true


      - name: Configure default WAN safely
        run: |
          set -e

          mkdir -p files/etc/uci-defaults

          cat > files/etc/uci-defaults/96-doornet2-wan <<'EOF'
          #!/bin/sh

          # CRITICAL retained-upgrade policy:
          # Never overwrite an existing WAN protocol. In particular, a retained
          # PPPoE configuration must stay PPPoE after sysupgrade.
          WAN_PROTO="$(uci -q get network.wan.proto)"

          if [ -n "$WAN_PROTO" ]; then
              logger -t doornet2                 "WAN preset skipped; preserving existing proto=$WAN_PROTO"
              exit 0
          fi

          # Extra retained-upgrade guard: if PPPoE credentials survived but
          # proto is unexpectedly absent, reconstruct PPPoE instead of DHCP.
          WAN_USER="$(uci -q get network.wan.username)"
          WAN_PASS="$(uci -q get network.wan.password)"
          if [ -n "$WAN_USER" ] || [ -n "$WAN_PASS" ]; then
              uci -q set network.wan='interface'
              uci -q set network.wan.proto='pppoe'
              uci -q commit network
              logger -t doornet2 \
                "WAN proto restored to PPPoE because retained credentials were found"
              exit 0
          fi

          # Clean-install fallback only. Most images already get a WAN section
          # from config_generate/board defaults; create DHCP only when no WAN
          # protocol exists at all.
          WAN_IFNAME="$(uci -q get network.wan.ifname)"
          WAN_DEVICE="$(uci -q get network.wan.device)"

          uci -q set network.wan='interface'

          if [ -z "$WAN_IFNAME" ] && [ -z "$WAN_DEVICE" ]; then
              # This LEDE/Rockchip tree historically uses eth0 for DoorNet2 WAN.
              uci -q set network.wan.ifname='eth0'
          fi

          uci -q set network.wan.proto='dhcp'
          uci -q commit network

          logger -t doornet2             "WAN preset created DHCP fallback because no existing proto was found"

          exit 0
          EOF

          chmod 755 files/etc/uci-defaults/96-doornet2-wan
          sh -n files/etc/uci-defaults/96-doornet2-wan


      # ============================================================
      # 6. Disable extroot
      # ============================================================

      - name: Disable root extroot configuration
        run: |
          set -e

          mkdir -p files/etc/config

          cat > files/etc/config/fstab <<'EOF'
          config global
                  option anon_swap '0'
                  option anon_mount '0'
                  option auto_swap '1'
                  option auto_mount '1'
                  option delay_root '5'
                  option check_fs '0'
          EOF

          if grep -Eq \
            "option[[:space:]]+target[[:space:]]+['\"]?/['\"]?" \
            files/etc/config/fstab
          then
              echo "ERROR: root extroot target detected"
              exit 1
          fi

          cat files/etc/config/fstab


      # ============================================================
      # 7. R18 critical fix:
      #
      # Fix Linux MMC host numbering using DT aliases.
      #
      # mmc0 -> fe320000.mmc -> SD/TF
      # mmc1 -> fe330000.mmc -> eMMC
      #
      # Therefore:
      # /dev/mmcblk0 = TF
      # /dev/mmcblk1 = eMMC
      # ============================================================

      - name: Fix DoorNet2 Linux MMC numbering
        run: |
          set -e

          echo "========================================"
          echo "Searching DoorNet2 DTS"
          echo "========================================"

          DTS_FILE="$(
            find target/linux/rockchip \
              -type f \
              -name '*.dts' \
              -print \
            | grep -Ei 'doornet2|door-net2' \
            | head -n 1
          )"

          if [ -z "$DTS_FILE" ]; then

            DTS_FILE="$(
              grep -RIl \
                --include='*.dts' \
                'embedfire,doornet2' \
                target/linux/rockchip \
                2>/dev/null \
              | head -n 1
            )"

          fi

          if [ -z "$DTS_FILE" ]; then

            echo "ERROR: DoorNet2 DTS file not found."
            echo
            echo "Possible DTS files:"
            find target/linux/rockchip \
              -type f \
              \( -name '*.dts' -o -name '*.dtsi' \) \
              | grep -Ei 'door|embedfire|rk3399' \
              | head -100

            exit 1
          fi


          echo "DoorNet2 DTS:"
          echo "$DTS_FILE"


          export DTS_FILE


          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          p = Path(os.environ["DTS_FILE"])

          s = p.read_text()

          marker = "DOORNET2_R18_FIXED_MMC_ALIASES"

          if marker in s:
              print("MMC alias patch already present.")
              raise SystemExit(0)


          #
          # If the board DTS already has an aliases node,
          # add/replace mmc0/mmc1 there.
          #
          alias_match = re.search(
              r'aliases\s*\{',
              s
          )

          if alias_match:

              start = alias_match.end()

              # Replace existing mapping if present.
              s = re.sub(
                  r'\bmmc0\s*=\s*&[^;]+;',
                  'mmc0 = &sdmmc;',
                  s
              )

              s = re.sub(
                  r'\bmmc1\s*=\s*&[^;]+;',
                  'mmc1 = &sdhci;',
                  s
              )

              # Add missing properties.
              alias_match = re.search(
                  r'aliases\s*\{',
                  s
              )

              start = alias_match.end()

              addition = "\n"
              addition += "\t\t/* DOORNET2_R18_FIXED_MMC_ALIASES */\n"

              if not re.search(
                  r'\bmmc0\s*=\s*&sdmmc\s*;',
                  s
              ):
                  addition += "\t\tmmc0 = &sdmmc;\n"

              if not re.search(
                  r'\bmmc1\s*=\s*&sdhci\s*;',
                  s
              ):
                  addition += "\t\tmmc1 = &sdhci;\n"

              s = s[:start] + addition + s[start:]

          else:

              root = re.search(
                  r'/\s*\{',
                  s
              )

              if not root:
                  raise SystemExit(
                      "ERROR: root DTS node not found"
                  )

              addition = """
              /* DOORNET2_R18_FIXED_MMC_ALIASES */
              aliases {
                      mmc0 = &sdmmc;
                      mmc1 = &sdhci;
              };

              """

              pos = root.end()

              s = s[:pos] + "\n" + addition + s[pos:]


          p.write_text(s)


          final = p.read_text()

          if not re.search(
              r'\bmmc0\s*=\s*&sdmmc\s*;',
              final
          ):
              raise SystemExit(
                  "ERROR: mmc0 alias not installed"
              )

          if not re.search(
              r'\bmmc1\s*=\s*&sdhci\s*;',
              final
          ):
              raise SystemExit(
                  "ERROR: mmc1 alias not installed"
              )

          print("DoorNet2 MMC aliases installed:")
          print("  mmc0 = &sdmmc   (TF / fe320000.mmc)")
          print("  mmc1 = &sdhci   (eMMC / fe330000.mmc)")
          PY


          echo
          echo "===== MMC ALIAS RESULT ====="

          grep -nE \
            'DOORNET2_R18_FIXED_MMC_ALIASES|mmc0.*sdmmc|mmc1.*sdhci' \
            "$DTS_FILE"


      # ============================================================
      # 8. OPKG feed
      # ============================================================

      - name: Configure GitHub OPKG feed
        run: |
          set -e

          mkdir -p files/etc/opkg

          cat > files/etc/opkg/distfeeds.conf <<'EOF'
          src/gz openwrt_core https://raw.githubusercontent.com/Taipeione/lede-rockchip/opkg-feed/targets/rockchip/armv8/packages
          src/gz openwrt_base https://raw.githubusercontent.com/Taipeione/lede-rockchip/opkg-feed/packages/aarch64_generic/base
          src/gz openwrt_istore https://raw.githubusercontent.com/Taipeione/lede-rockchip/opkg-feed/packages/aarch64_generic/istore
          src/gz openwrt_luci https://raw.githubusercontent.com/Taipeione/lede-rockchip/opkg-feed/packages/aarch64_generic/luci
          src/gz openwrt_packages https://raw.githubusercontent.com/Taipeione/lede-rockchip/opkg-feed/packages/aarch64_generic/packages
          src/gz openwrt_routing https://raw.githubusercontent.com/Taipeione/lede-rockchip/opkg-feed/packages/aarch64_generic/routing
          src/gz openwrt_telephony https://raw.githubusercontent.com/Taipeione/lede-rockchip/opkg-feed/packages/aarch64_generic/telephony
          src/gz doornet2_passwall_luci https://raw.githubusercontent.com/Taipeione/lede-rockchip/opkg-feed/packages/aarch64_generic/passwall_luci
          src/gz doornet2_passwall_packages https://raw.githubusercontent.com/Taipeione/lede-rockchip/opkg-feed/packages/aarch64_generic/passwall_packages
          EOF


      # ============================================================
      # 9. Version information
      # ============================================================

      - name: Embed DoorNet2 version
        run: |
          set -e

          mkdir -p files/etc

          cat > files/etc/doornet2_release <<EOF
          DOORNET2_VERSION='${DOORNET2_VERSION}'
          DOORNET2_RELEASE='R4'
          DOORNET2_TAG='${DOORNET2_TAG}'
          DOORNET2_BUILD_DATE='${DOORNET2_BUILD_DATE}'
          DOORNET2_GIT_COMMIT='${GITHUB_SHA}'
          DOORNET2_GITHUB_REPOSITORY='${GITHUB_REPOSITORY}'
          DOORNET2_BOARD='embedfire,doornet2'
          DOORNET2_BOOT_MODE='tf-first-emmc-fallback'
          DOORNET2_STORAGE_FIX='no-extroot'
          DOORNET2_MMC_LAYOUT='mmcblk0-tf-mmcblk1-emmc'
          DOORNET2_UPDATER='physical-target-guard-v2'
          DOORNET2_TF_CAPACITY='preserve-expanded-root-v1'
          DOORNET2_UI='slim-source-argon-1.8.1-extracted-with-bootstrap-fallback-v1'
          DOORNET2_PASSWALL='builtin-online-feed-shunt-v2'
          DOORNET2_NETWORK_APPS='smartdns-adguard-persist-online-v6'
          DOORNET2_SHUNT='preset-rules-tencent-direct-login-safe-v5'
          DOORNET2_DNS_CHAIN='adguard-smartdns-postpasswall-v5'
          DOORNET2_ADGUARD_RUNTIME='official-v0.107.79-arm64-sha256-v1'
          DOORNET2_PASSWALL_DELAY='route-aware-proxy-aware-v2'
          DOORNET2_HEALTH='selfcheck-selfheal-v3'
          DOORNET2_FINAL_PROFILE='stable-final-v5.3.5-solidified-no-uu-dnsfailover-adguard10779-dualstack-proxyv4-slim-argon181'
          DOORNET2_RUNTIME_MONITOR='cpu-temp-status-only-v1'
          DOORNET2_IP_POLICY='domestic-dualstack-proxy-ipv4only-v1'
          DOORNET2_PERSISTENCE='sysupgrade-explicit-adguard-v2'
          DOORNET2_WAN_POLICY='preserve-existing-proto-and-pppoe-creds-v2'
          DOORNET2_SELFHEAL='service-aware-two-strike-v2'
          DOORNET2_ROOT_AUTH='preserve-user-password-no-known-default-v1'
          DOORNET2_DNS_POSTPASSWALL='chinadns-smartdns-guard-v2'
          DOORNET2_SMARTDNS_OPENAI='proxytest-ipv4only-reboot-validated-v1'
          EOF

          cat files/etc/doornet2_release



      # ============================================================
      # 9A. R21 TF capacity preservation
      #
      # Keep the firmware image at 7 GiB so it still fits the
      # 7.3 GiB eMMC.
      #
      # When sysupgrade runs from an already-expanded TF card:
      #   1. Physically verify TF = SD = fe320000.mmc = mmcblk0
      #   2. Keep the existing large p2 partition table
      #   3. Write the new image into p1/p2 only
      #   4. Grow the new ext4 filesystem back to the existing p2 size
      #
      # eMMC keeps the original Rockchip upgrade behaviour.
      # ============================================================

      - name: Add DoorNet2 R21 TF capacity preserve
        run: |
          set -e

          PLATFORM="target/linux/rockchip/armv8/base-files/lib/upgrade/platform.sh"

          test -f "$PLATFORM"

          cp -f \
            "$PLATFORM" \
            "${PLATFORM}.upstream-r21-backup"

          cat > "$PLATFORM" <<'EOF'
          # DOORNET2_R21_TF_CAPACITY_PRESERVE_V1
          #
          # DoorNet2 TF capacity-preserving sysupgrade.
          #
          # Physical mapping after the R18 MMC alias fix:
          #   Linux mmcblk0 = TF   = SD  = fe320000.mmc
          #   Linux mmcblk1 = eMMC = MMC = fe330000.mmc
          #
          # The firmware image intentionally keeps a 7 GiB p2 so that
          # the same image also fits the 7.3 GiB eMMC.
          #
          # If TF p2 has already been expanded, preserve its partition
          # table and grow the newly-written ext4 filesystem to the
          # existing large p2 size from the sysupgrade RAMFS.

          RAMFS_COPY_BIN="$RAMFS_COPY_BIN /usr/sbin/e2fsck /usr/sbin/resize2fs"


          doornet2_is_tf_disk()
          {
              local diskdev="$1"
              local board
              local media
              local path

              [ "$diskdev" = "mmcblk0" ] || return 1

              [ -r /tmp/sysinfo/board_name ] || return 1

              board="$(
                  cat /tmp/sysinfo/board_name \
                      2>/dev/null
              )"

              [ "$board" = "embedfire,doornet2" ] || return 1

              [ -r "/sys/class/block/${diskdev}/device/type" ] \
                  || return 1

              media="$(
                  cat "/sys/class/block/${diskdev}/device/type" \
                      2>/dev/null
              )"

              [ "$media" = "SD" ] || return 1

              path="$(
                  /bin/busybox readlink -f \
                      "/sys/class/block/${diskdev}/device" \
                      2>/dev/null
              )"

              case "$path" in
                  *fe320000.mmc*)
                      return 0
                      ;;
                  *)
                      return 1
                      ;;
              esac
          }


          doornet2_tf_can_preserve_partitions()
          {
              local diskdev="$1"

              local boot1
              local image1
              local boot2
              local image2

              local boot2_start
              local boot2_size
              local image2_start
              local image2_size

              doornet2_is_tf_disk "$diskdev" || return 1

              [ -s /tmp/partmap.bootdisk ] || return 1
              [ -s /tmp/partmap.image ] || return 1

              #
              # DoorNet2 image must contain only p1 and p2.
              #
              if awk '$1 > 2 { found=1 } END { exit(found ? 0 : 1) }' \
                  /tmp/partmap.bootdisk
              then
                  return 1
              fi

              if awk '$1 > 2 { found=1 } END { exit(found ? 0 : 1) }' \
                  /tmp/partmap.image
              then
                  return 1
              fi

              boot1="$(
                  awk \
                      '$1 == 1 { print $2 ":" $3; exit }' \
                      /tmp/partmap.bootdisk
              )"

              image1="$(
                  awk \
                      '$1 == 1 { print $2 ":" $3; exit }' \
                      /tmp/partmap.image
              )"

              boot2="$(
                  awk \
                      '$1 == 2 { print $2 ":" $3; exit }' \
                      /tmp/partmap.bootdisk
              )"

              image2="$(
                  awk \
                      '$1 == 2 { print $2 ":" $3; exit }' \
                      /tmp/partmap.image
              )"

              [ -n "$boot1" ] || return 1
              [ -n "$image1" ] || return 1
              [ -n "$boot2" ] || return 1
              [ -n "$image2" ] || return 1

              #
              # p1 start + size must be identical.
              #
              [ "$boot1" = "$image1" ] || return 1

              boot2_start="${boot2%%:*}"
              boot2_size="${boot2##*:}"

              image2_start="${image2%%:*}"
              image2_size="${image2##*:}"

              #
              # p2 may differ ONLY by being larger.
              # The start sector must never move.
              #
              [ "$boot2_start" = "$image2_start" ] || return 1
              [ "$boot2_size" -gt "$image2_size" ] || return 1

              return 0
          }


          doornet2_tf_grow_ext4()
          {
              local diskdev="$1"
              local rootpart
              local rc

              doornet2_is_tf_disk "$diskdev" || return 1

              if ! export_partdevice rootpart 2; then
                  echo "DoorNet2: unable to locate TF root partition"
                  return 1
              fi

              echo "DoorNet2: checking /dev/${rootpart} before ext4 grow"

              /usr/sbin/e2fsck \
                  -f \
                  -y \
                  "/dev/${rootpart}"

              rc=$?

              case "$rc" in
                  0|1)
                      ;;
                  *)
                      echo "DoorNet2: e2fsck failed before grow, rc=${rc}"
                      return 1
                      ;;
              esac

              echo "DoorNet2: growing ext4 to current TF p2 size"

              if ! /usr/sbin/resize2fs \
                  "/dev/${rootpart}"
              then
                  echo "DoorNet2: resize2fs failed"
                  return 1
              fi

              echo "DoorNet2: checking /dev/${rootpart} after ext4 grow"

              /usr/sbin/e2fsck \
                  -f \
                  -y \
                  "/dev/${rootpart}"

              rc=$?

              case "$rc" in
                  0|1)
                      ;;
                  *)
                      echo "DoorNet2: e2fsck failed after grow, rc=${rc}"
                      return 1
                      ;;
              esac

              sync

              return 0
          }


          platform_check_image()
          {
              local diskdev
              local partdev
              local diff
              local preserve_tf=0

              export_bootdevice && \
              export_partdevice diskdev 0 || {
                  echo "Unable to determine upgrade device"
                  return 1
              }

              get_partitions \
                  "/dev/${diskdev}" \
                  bootdisk

              #
              # Extract the boot sector from the image.
              #
              get_image "$@" |
                  dd \
                      of=/tmp/image.bs \
                      count=1 \
                      bs=512b \
                      2>/dev/null

              get_partitions \
                  /tmp/image.bs \
                  image

              diff="$(
                  grep \
                      -F \
                      -x \
                      -v \
                      -f /tmp/partmap.bootdisk \
                      /tmp/partmap.image
              )"

              if [ -n "$diff" ] && \
                 doornet2_tf_can_preserve_partitions \
                     "$diskdev"
              then
                  preserve_tf=1
              fi

              rm -f \
                  /tmp/image.bs \
                  /tmp/partmap.bootdisk \
                  /tmp/partmap.image

              if [ "$preserve_tf" = "1" ]; then
                  echo "DoorNet2: expanded TF p2 detected."
                  echo "DoorNet2: TF partition table will be preserved."
                  return 0
              fi

              if [ -n "$diff" ]; then
                  echo "Partition layout has changed. Full image will be written."
                  ask_bool 0 "Abort" && exit 1
                  return 0
              fi

              return 0
          }


          platform_copy_config()
          {
              local partdev

              if export_partdevice partdev 1; then

                  mount \
                      -o rw,noatime \
                      "/dev/${partdev}" \
                      /mnt

                  cp \
                      -af \
                      "$UPGRADE_BACKUP" \
                      "/mnt/$BACKUP_FILE"

                  umount /mnt
              fi
          }


          platform_do_upgrade()
          {
              local diskdev
              local partdev
              local diff
              local preserve_tf=0

              export_bootdevice && \
              export_partdevice diskdev 0 || {
                  echo "Unable to determine upgrade device"
                  return 1
              }

              sync

              if [ "$UPGRADE_OPT_SAVE_PARTITIONS" = "1" ]; then

                  get_partitions \
                      "/dev/${diskdev}" \
                      bootdisk

                  #
                  # Extract the boot sector from the image.
                  #
                  get_image "$@" |
                      dd \
                          of=/tmp/image.bs \
                          count=1 \
                          bs=512b

                  get_partitions \
                      /tmp/image.bs \
                      image

                  diff="$(
                      grep \
                          -F \
                          -x \
                          -v \
                          -f /tmp/partmap.bootdisk \
                          /tmp/partmap.image
                  )"

              else

                  diff=1

              fi


              if [ -n "$diff" ] && \
                 [ "$UPGRADE_OPT_SAVE_PARTITIONS" = "1" ] && \
                 doornet2_tf_can_preserve_partitions \
                     "$diskdev"
              then

                  preserve_tf=1
                  diff=""

                  echo "DoorNet2: preserving expanded TF partition table."

              fi


              if [ -n "$diff" ]; then

                  get_image "$@" |
                      dd \
                          of="/dev/${diskdev}" \
                          bs=4096 \
                          conv=fsync

                  #
                  # Separate removal and addition is necessary.
                  #
                  partx \
                      -d \
                      - \
                      "/dev/${diskdev}"

                  partx \
                      -a \
                      - \
                      "/dev/${diskdev}"

                  return 0
              fi


              #
              # Keep the current partition table and write the image
              # contents into each existing partition.
              #
              while read part start size
              do

                  if export_partdevice \
                      partdev \
                      "$part"
                  then

                      echo "Writing image to /dev/${partdev}..."

                      get_image "$@" |
                          dd \
                              of="/dev/${partdev}" \
                              ibs=512 \
                              obs=1M \
                              skip="$start" \
                              count="$size" \
                              conv=fsync

                  else

                      echo "Unable to find partition ${part} device, skipped."

                  fi

              done < /tmp/partmap.image


              #
              # Copy the image disk signature / MBR UUID.
              #
              echo "Writing new UUID to /dev/${diskdev}..."

              get_image "$@" |
                  dd \
                      of="/dev/${diskdev}" \
                      bs=1 \
                      skip=440 \
                      count=4 \
                      seek=440 \
                      conv=fsync


              #
              # Only an already-expanded, physically verified TF reaches
              # this branch. The partition itself stays large; resize the
              # newly-written 7 GiB ext4 filesystem back to that size.
              #
              if [ "$preserve_tf" = "1" ]; then

                  echo "DoorNet2: restoring ext4 to expanded TF capacity."

                  if ! doornet2_tf_grow_ext4 \
                      "$diskdev"
                  then

                      echo "WARNING: DoorNet2 TF ext4 auto-grow failed."
                      echo "WARNING: Firmware was written successfully."
                      echo "WARNING: TF filesystem can be grown manually later."

                  fi

              fi

              return 0
          }
          EOF

          echo "===== R21 PLATFORM SYNTAX ====="

          sh -n "$PLATFORM"

          echo
          echo "===== R21 TF CAPACITY PATCH ====="

          grep -nE \
            'DOORNET2_R21_TF_CAPACITY_PRESERVE_V1|RAMFS_COPY_BIN|doornet2_is_tf_disk|doornet2_tf_can_preserve_partitions|doornet2_tf_grow_ext4|preserving expanded TF partition table|resize2fs' \
            "$PLATFORM"

          grep -q \
            'DOORNET2_R21_TF_CAPACITY_PRESERVE_V1' \
            "$PLATFORM"

          grep -q \
            'fe320000.mmc' \
            "$PLATFORM"

          grep -q \
            '/usr/sbin/e2fsck' \
            "$PLATFORM"

          grep -q \
            '/usr/sbin/resize2fs' \
            "$PLATFORM"

          grep -q \
            'preserving expanded TF partition table' \
            "$PLATFORM"

          echo "R21 TF CAPACITY PATCH OK"


      # ============================================================
      # 10. R18 boot logic
      #
      # U-Boot:
      #   mmc 1 = TF
      #   mmc 0 = eMMC
      #
      # Linux aliases:
      #   mmcblk0 = TF
      #   mmcblk1 = eMMC
      # ============================================================

      - name: Configure R18 TF first boot
        run: |
          set -e

          cat > target/linux/rockchip/image/doornet2.bootscript <<'EOF'
          #
          # DoorNet2 r18 stable TF/eMMC boot
          #
          # U-Boot:
          #   mmc 1 = TF
          #   mmc 0 = eMMC
          #
          # Linux DT aliases:
          #   mmc0 = &sdmmc
          #   mmc1 = &sdhci
          #
          # Linux:
          #   TF   = /dev/mmcblk0
          #   eMMC = /dev/mmcblk1
          #

          if test "${stdout}" = "serial@fe660000"; then
              setenv serial_addr ",0xfe660000";
          elif test "${stdout}" = "serial@feb50000"; then
              setenv serial_addr ",0xfeb50000";
          elif test "${stdout}" = "serial@ff130000"; then
              setenv serial_addr ",0xff130000";
          elif test "${stdout}" = "serial@ff1a0000"; then
              setenv serial_addr ",0xff1a0000";
          else
              setenv serial_addr "";
          fi;

          echo "========================================";
          echo "DoorNet2 r18 smart boot";
          echo "Priority: TF -> eMMC";
          echo "Linux: TF=mmcblk0 eMMC=mmcblk1";
          echo "========================================";

          echo "Trying TF via U-Boot mmc 1:1";

          if load mmc 1:1 ${kernel_addr_r} kernel.img; then

              echo "TF kernel found";
              echo "Linux root=/dev/mmcblk0p2";

              setenv rootdev "/dev/mmcblk0p2";

              setenv bootargs "coherent_pool=2M console=ttyS2,1500000 earlycon=uart8250,mmio32${serial_addr} root=${rootdev} rw rootwait";

              bootm ${kernel_addr_r};

              echo "WARNING: TF boot returned unexpectedly";
              echo "Trying eMMC";

          else

              echo "TF kernel not found";
              echo "Fallback to eMMC";

          fi;


          echo "Trying eMMC via U-Boot mmc 0:1";

          if load mmc 0:1 ${kernel_addr_r} kernel.img; then

              echo "eMMC kernel found";
              echo "Linux root=/dev/mmcblk1p2";

              setenv rootdev "/dev/mmcblk1p2";

              setenv bootargs "coherent_pool=2M console=ttyS2,1500000 earlycon=uart8250,mmio32${serial_addr} root=${rootdev} rw rootwait";

              bootm ${kernel_addr_r};

          else

              echo "FATAL: eMMC kernel not found";

          fi;


          echo "========================================";
          echo "FATAL: No bootable DoorNet2 system";
          echo "========================================";
          EOF


          python3 <<'PY'
          from pathlib import Path

          p = Path(
              "target/linux/rockchip/image/armv8.mk"
          )

          s = p.read_text()

          marker = "define Device/embedfire_doornet2"

          start = s.find(marker)

          if start == -1:
              raise SystemExit(
                  "ERROR: DoorNet2 block not found"
              )

          end = s.find("endef", start)

          if end == -1:
              raise SystemExit(
                  "ERROR: DoorNet2 block incomplete"
              )

          block = s[start:end]

          if "BOOT_SCRIPT := doornet2" not in block:

              if "BOOT_FLOW := pine64-bin" not in block:
                  raise SystemExit(
                      "ERROR: BOOT_FLOW not found"
                  )

              block = block.replace(
                  "  BOOT_FLOW := pine64-bin\n",
                  "  BOOT_FLOW := pine64-bin\n"
                  "  BOOT_SCRIPT := doornet2\n"
              )

              s = s[:start] + block + s[end:]

              p.write_text(s)

          print(
              p.read_text()[
                  start:
                  p.read_text().find(
                      "endef",
                      start
                  ) + 5
              ]
          )
          PY


          echo
          echo "===== R18 BOOT SCRIPT ====="

          cat target/linux/rockchip/image/doornet2.bootscript


          echo
          echo "===== BOOT VERIFY ====="

          grep -q \
            'rootdev "/dev/mmcblk0p2"' \
            target/linux/rockchip/image/doornet2.bootscript

          grep -q \
            'rootdev "/dev/mmcblk1p2"' \
            target/linux/rockchip/image/doornet2.bootscript

          if grep -Eq \
            '^[[:space:]]*(mmc dev|mmc rescan|part uuid)' \
            target/linux/rockchip/image/doornet2.bootscript
          then
              echo "ERROR: unsupported boot command found"
              exit 1
          fi


      # ============================================================
      # 11. taskd compatibility
      # ============================================================

      - name: Add taskd compatibility fix
        run: |
          set -e

          mkdir -p files/etc/uci-defaults

          cat > files/etc/uci-defaults/99-taskd-compat <<'EOF'
          #!/bin/sh

          TASKS="/etc/init.d/tasks"

          if [ -f "$TASKS" ] && \
             grep -q 'extra_command ' "$TASKS" && \
             ! grep -q 'TASKD_EXTRA_COMMAND_COMPAT' "$TASKS"
          then

              TMP="/tmp/tasks.compat.$$"

              awk '
              NR == 1 {
                  print
                  print ""
                  print "# TASKD_EXTRA_COMMAND_COMPAT"
                  print "type extra_command >/dev/null 2>&1 || extra_command() { :; }"
                  next
              }
              {
                  print
              }
              ' "$TASKS" > "$TMP"

              cat "$TMP" > "$TASKS"
              rm -f "$TMP"

              chmod 755 "$TASKS"
          fi

          exit 0
          EOF

          chmod 755 files/etc/uci-defaults/99-taskd-compat


      # ============================================================
      # 12. R18 updater
      #
      # Four-level protection:
      #
      # 1. root device
      # 2. MMC host controller
      # 3. physical SD/MMC type
      # 4. OpenWrt sysupgrade diskdev
      # ============================================================

      - name: Add DoorNet2 R18 online updater
        run: |
          set -e

          mkdir -p \
            files/usr/bin \
            files/usr/lib/lua/luci/controller \
            files/usr/lib/lua/luci/view/doornet2


          cat > files/usr/bin/doornet2-updater <<'EOF'
          #!/bin/sh

          export PATH=/usr/sbin:/usr/bin:/sbin:/bin

          REPO="Taipeione/lede-rockchip"

          BASE_URL="https://github.com/${REPO}/releases/latest/download"

          WORKDIR="/tmp/doornet2-update"

          META="${WORKDIR}/version.json"

          FIRMWARE="${WORKDIR}/DoorNet2-ext4-sysupgrade.img.gz"

          TESTLOG="/tmp/doornet2-sysupgrade-test.log"

          UPGRADELOG="/tmp/doornet2-upgrade.log"

          RELEASE_INFO="/etc/doornet2_release"

          EXPECTED_BOARD="embedfire,doornet2"

          EXPECTED_ASSET="DoorNet2-ext4-sysupgrade.img.gz"


          get_current_version()
          {
              CURRENT_VERSION="unknown"
              CURRENT_TAG="unknown"

              if [ -f "$RELEASE_INFO" ]; then

                  . "$RELEASE_INFO"

                  CURRENT_VERSION="${DOORNET2_VERSION:-unknown}"
                  CURRENT_TAG="${DOORNET2_TAG:-unknown}"

              fi
          }


          get_board()
          {
              BOARD="unknown"

              if [ -r /tmp/sysinfo/board_name ]; then

                  IFS= read -r BOARD \
                      < /tmp/sysinfo/board_name

                  [ -n "$BOARD" ] || \
                      BOARD="unknown"

              fi
          }


          #
          # Check Linux MMC host numbering.
          #
          # Host mmc0 must be fe320000.mmc (TF controller)
          # Host mmc1 must be fe330000.mmc (eMMC controller)
          #
          # mmc_host exists even when no TF card is inserted.
          #
          verify_mmc_host_layout()
          {
              HOST0=""
              HOST1=""

              HOST0="$(
                  readlink -f \
                    /sys/class/mmc_host/mmc0/device \
                    2>/dev/null
              )"

              HOST1="$(
                  readlink -f \
                    /sys/class/mmc_host/mmc1/device \
                    2>/dev/null
              )"

              case "$HOST0" in
                  *fe320000.mmc*)
                      ;;
                  *)
                      return 1
                      ;;
              esac

              case "$HOST1" in
                  *fe330000.mmc*)
                      ;;
                  *)
                      return 2
                      ;;
              esac

              return 0
          }


          #
          # Determine current root and physical media.
          #
          get_root_info()
          {
              ROOT_DEVICE=""
              ROOT_DISK=""
              UPGRADE_DISK="unknown"
              BOOT_MEDIA="unknown"
              MEDIA_TYPE="unknown"
              CONTROLLER="unknown"

              CMDLINE=""

              if [ -r /proc/cmdline ]; then

                  IFS= read -r CMDLINE \
                      < /proc/cmdline

                  for ARG in $CMDLINE; do

                      case "$ARG" in

                          root=/dev/mmcblk0p2|root=/dev/mmcblk1p2)

                              ROOT_DEVICE="${ARG#root=}"
                              break
                              ;;

                      esac

                  done

              fi


              if [ -z "$ROOT_DEVICE" ]; then

                  ROOT_DEVICE="$(
                      /bin/mount 2>/dev/null |
                      awk '
                          $3 == "/" {
                              print $1
                              exit
                          }
                      '
                  )"

              fi


              case "$ROOT_DEVICE" in

                  /dev/mmcblk0p2)

                      ROOT_DISK="/dev/mmcblk0"
                      ;;

                  /dev/mmcblk1p2)

                      ROOT_DISK="/dev/mmcblk1"
                      ;;

                  *)

                      return 1
                      ;;

              esac


              SYSNAME="${ROOT_DISK#/dev/}"


              if [ -r "/sys/block/${SYSNAME}/device/type" ]; then

                  IFS= read -r MEDIA_TYPE \
                      < "/sys/block/${SYSNAME}/device/type"

              fi


              CONTROLLER="$(
                  readlink -f \
                    "/sys/block/${SYSNAME}/device" \
                    2>/dev/null
              )"


              case "$ROOT_DEVICE:$MEDIA_TYPE:$CONTROLLER" in

                  /dev/mmcblk0p2:SD:*fe320000.mmc*)

                      BOOT_MEDIA="TF"
                      UPGRADE_DISK="/dev/mmcblk0"
                      ;;

                  /dev/mmcblk1p2:MMC:*fe330000.mmc*)

                      BOOT_MEDIA="eMMC"
                      UPGRADE_DISK="/dev/mmcblk1"
                      ;;

                  *)

                      BOOT_MEDIA="unknown"
                      UPGRADE_DISK="unknown"
                      return 2
                      ;;

              esac


              return 0
          }


          #
          # Full upgrade safety guard.
          #
          verify_sysupgrade_target()
          {
              SYSUPGRADE_DISK="unknown"
              TARGET_GUARD_MESSAGE="unknown"


              if ! verify_mmc_host_layout; then

                  TARGET_GUARD_MESSAGE="mmc_host_layout_mismatch"
                  return 20

              fi


              if ! get_root_info; then

                  TARGET_GUARD_MESSAGE="root_media_mismatch"
                  return 21

              fi


              EXPECTED_DISKDEV="${UPGRADE_DISK#/dev/}"


              if [ ! -r /lib/functions.sh ]; then

                  TARGET_GUARD_MESSAGE="functions_missing"
                  return 22

              fi


              if [ ! -r /lib/upgrade/common.sh ]; then

                  TARGET_GUARD_MESSAGE="upgrade_common_missing"
                  return 23

              fi


              . /lib/functions.sh
              . /lib/upgrade/common.sh


              unset diskdev


              if ! export_bootdevice \
                  >/dev/null 2>&1
              then

                  TARGET_GUARD_MESSAGE="export_bootdevice_failed"
                  return 24

              fi


              if ! export_partdevice \
                  diskdev \
                  0 \
                  >/dev/null 2>&1
              then

                  TARGET_GUARD_MESSAGE="export_partdevice_failed"
                  return 25

              fi


              SYSUPGRADE_DISK="/dev/${diskdev}"


              if [ "$diskdev" != "$EXPECTED_DISKDEV" ]; then

                  TARGET_GUARD_MESSAGE="target_mismatch"
                  return 26

              fi


              TARGET_GUARD_MESSAGE="ok"

              return 0
          }


          fetch_metadata()
          {
              mkdir -p "$WORKDIR"

              rm -f "${META}.part"

              if ! curl \
                  -LfsS \
                  --connect-timeout 15 \
                  --retry 3 \
                  -o "${META}.part" \
                  "${BASE_URL}/version.json"
              then
                  return 1
              fi

              mv "${META}.part" "$META"


              LATEST_VERSION="$(
                  jsonfilter \
                      -i "$META" \
                      -e '@.version' \
                      2>/dev/null
              )"

              LATEST_TAG="$(
                  jsonfilter \
                      -i "$META" \
                      -e '@.tag' \
                      2>/dev/null
              )"

              LATEST_BOARD="$(
                  jsonfilter \
                      -i "$META" \
                      -e '@.board' \
                      2>/dev/null
              )"

              LATEST_ASSET="$(
                  jsonfilter \
                      -i "$META" \
                      -e '@.asset' \
                      2>/dev/null
              )"

              LATEST_SHA="$(
                  jsonfilter \
                      -i "$META" \
                      -e '@.sha256' \
                      2>/dev/null
              )"


              [ "$LATEST_BOARD" = "$EXPECTED_BOARD" ] \
                  || return 2

              [ "$LATEST_ASSET" = "$EXPECTED_ASSET" ] \
                  || return 3

              [ -n "$LATEST_VERSION" ] \
                  || return 4

              echo "$LATEST_SHA" |
                  grep -Eq \
                    '^[0-9a-fA-F]{64}$' \
                  || return 5


              return 0
          }


          command_status()
          {
              get_current_version
              get_board

              HOST_LAYOUT="bad"

              if verify_mmc_host_layout; then
                  HOST_LAYOUT="ok"
              fi


              get_root_info || true


              printf '{'
              printf '"ok":true,'
              printf '"current_version":"%s",' "$CURRENT_VERSION"
              printf '"current_tag":"%s",' "$CURRENT_TAG"
              printf '"board":"%s",' "$BOARD"
              printf '"root_device":"%s",' "$ROOT_DEVICE"
              printf '"upgrade_disk":"%s",' "$UPGRADE_DISK"
              printf '"boot_media":"%s",' "$BOOT_MEDIA"
              printf '"media_type":"%s",' "$MEDIA_TYPE"
              printf '"mmc_layout":"%s"' "$HOST_LAYOUT"
              printf '}\n'
          }


          command_check()
          {
              get_current_version
              get_board


              if [ "$BOARD" != "$EXPECTED_BOARD" ]; then

                  printf \
                    '{"ok":false,"message":"board_mismatch"}\n'

                  exit 1
              fi


              if ! verify_mmc_host_layout; then

                  printf \
                    '{"ok":false,"message":"mmc_host_layout_mismatch"}\n'

                  exit 1
              fi


              if ! get_root_info; then

                  printf \
                    '{"ok":false,"message":"root_media_mismatch"}\n'

                  exit 1
              fi


              if ! fetch_metadata; then

                  printf \
                    '{"ok":false,"message":"metadata_download_failed"}\n'

                  exit 1
              fi


              if [ "$CURRENT_VERSION" = "$LATEST_VERSION" ]; then
                  AVAILABLE="false"
              else
                  AVAILABLE="true"
              fi


              printf '{'
              printf '"ok":true,'
              printf '"current_version":"%s",' "$CURRENT_VERSION"
              printf '"latest_version":"%s",' "$LATEST_VERSION"
              printf '"latest_tag":"%s",' "$LATEST_TAG"
              printf '"update_available":%s,' "$AVAILABLE"
              printf '"boot_media":"%s",' "$BOOT_MEDIA"
              printf '"media_type":"%s",' "$MEDIA_TYPE"
              printf '"upgrade_disk":"%s",' "$UPGRADE_DISK"
              printf '"mmc_layout":"ok"'
              printf '}\n'
          }


          command_prepare()
          {
              get_board


              if [ "$BOARD" != "$EXPECTED_BOARD" ]; then

                  printf \
                    '{"ok":false,"message":"board_mismatch"}\n'

                  exit 1
              fi


              if ! verify_sysupgrade_target; then

                  printf '{'
                  printf '"ok":false,'
                  printf '"message":"target_guard_failed",'
                  printf '"guard_message":"%s",' "$TARGET_GUARD_MESSAGE"
                  printf '"boot_media":"%s",' "$BOOT_MEDIA"
                  printf '"upgrade_disk":"%s",' "$UPGRADE_DISK"
                  printf '"sysupgrade_disk":"%s"' "$SYSUPGRADE_DISK"
                  printf '}\n'

                  exit 1
              fi


              if ! fetch_metadata; then

                  printf \
                    '{"ok":false,"message":"metadata_download_failed"}\n'

                  exit 1
              fi


              rm -f "${FIRMWARE}.part"


              if ! curl \
                  -LfsS \
                  --connect-timeout 15 \
                  --retry 3 \
                  -o "${FIRMWARE}.part" \
                  "${BASE_URL}/${EXPECTED_ASSET}"
              then

                  rm -f "${FIRMWARE}.part"

                  printf \
                    '{"ok":false,"message":"firmware_download_failed"}\n'

                  exit 1
              fi


              mv "${FIRMWARE}.part" "$FIRMWARE"


              ACTUAL_SHA="$(
                  sha256sum "$FIRMWARE" |
                  awk '{print $1}'
              )"


              if [ "$ACTUAL_SHA" != "$LATEST_SHA" ]; then

                  rm -f "$FIRMWARE"

                  printf \
                    '{"ok":false,"message":"sha256_failed"}\n'

                  exit 1
              fi


              rm -f "$TESTLOG"


              if ! /sbin/sysupgrade \
                  -T \
                  "$FIRMWARE" \
                  >"$TESTLOG" 2>&1
              then

                  printf \
                    '{"ok":false,"message":"sysupgrade_test_failed"}\n'

                  exit 1
              fi


              if ! verify_sysupgrade_target; then

                  printf '{'
                  printf '"ok":false,'
                  printf '"message":"target_guard_failed_after_test",'
                  printf '"guard_message":"%s",' "$TARGET_GUARD_MESSAGE"
                  printf '"boot_media":"%s",' "$BOOT_MEDIA"
                  printf '"upgrade_disk":"%s",' "$UPGRADE_DISK"
                  printf '"sysupgrade_disk":"%s"' "$SYSUPGRADE_DISK"
                  printf '}\n'

                  exit 1
              fi


              SIZE="$(
                  du -h "$FIRMWARE" |
                  awk '{print $1}'
              )"


              printf '{'
              printf '"ok":true,'
              printf '"ready":true,'
              printf '"latest_version":"%s",' "$LATEST_VERSION"
              printf '"sha256":"%s",' "$ACTUAL_SHA"
              printf '"size":"%s",' "$SIZE"
              printf '"boot_media":"%s",' "$BOOT_MEDIA"
              printf '"media_type":"%s",' "$MEDIA_TYPE"
              printf '"upgrade_disk":"%s",' "$UPGRADE_DISK"
              printf '"sysupgrade_disk":"%s",' "$SYSUPGRADE_DISK"
              printf '"mmc_layout":"ok",'
              printf '"target_guard":"ok"'
              printf '}\n'
          }


          command_upgrade()
          {
              get_board


              if [ "$BOARD" != "$EXPECTED_BOARD" ]; then

                  printf \
                    '{"ok":false,"message":"board_mismatch"}\n'

                  exit 1
              fi


              if [ ! -f "$META" ] || \
                 [ ! -f "$FIRMWARE" ]
              then

                  printf \
                    '{"ok":false,"message":"firmware_not_prepared"}\n'

                  exit 1
              fi


              LATEST_SHA="$(
                  jsonfilter \
                      -i "$META" \
                      -e '@.sha256' \
                      2>/dev/null
              )"


              ACTUAL_SHA="$(
                  sha256sum "$FIRMWARE" |
                  awk '{print $1}'
              )"


              if [ -z "$LATEST_SHA" ] || \
                 [ "$LATEST_SHA" != "$ACTUAL_SHA" ]
              then

                  printf \
                    '{"ok":false,"message":"sha256_failed"}\n'

                  exit 1
              fi


              if ! /sbin/sysupgrade \
                  -T \
                  "$FIRMWARE" \
                  >"$TESTLOG" 2>&1
              then

                  printf \
                    '{"ok":false,"message":"sysupgrade_test_failed"}\n'

                  exit 1
              fi


              #
              # FINAL safety check immediately before writing disk.
              #
              if ! verify_sysupgrade_target; then

                  printf '{'
                  printf '"ok":false,'
                  printf '"message":"final_target_guard_failed",'
                  printf '"guard_message":"%s",' "$TARGET_GUARD_MESSAGE"
                  printf '"boot_media":"%s",' "$BOOT_MEDIA"
                  printf '"upgrade_disk":"%s",' "$UPGRADE_DISK"
                  printf '"sysupgrade_disk":"%s"' "$SYSUPGRADE_DISK"
                  printf '}\n'

                  exit 1
              fi


              sync


              (
                  sleep 3

                  /sbin/sysupgrade \
                    -v \
                    "$FIRMWARE"

              ) >"$UPGRADELOG" \
                2>&1 \
                </dev/null &


              printf '{'
              printf '"ok":true,'
              printf '"started":true,'
              printf '"boot_media":"%s",' "$BOOT_MEDIA"
              printf '"upgrade_disk":"%s",' "$UPGRADE_DISK"
              printf '"sysupgrade_disk":"%s",' "$SYSUPGRADE_DISK"
              printf '"target_guard":"ok"'
              printf '}\n'
          }


          case "$1" in

              status)
                  command_status
                  ;;

              check)
                  command_check
                  ;;

              prepare)
                  command_prepare
                  ;;

              upgrade)
                  command_upgrade
                  ;;

              *)
                  echo "Usage:"
                  echo "  doornet2-updater status"
                  echo "  doornet2-updater check"
                  echo "  doornet2-updater prepare"
                  echo "  doornet2-updater upgrade"
                  exit 1
                  ;;

          esac
          EOF


          chmod 755 files/usr/bin/doornet2-updater

          sh -n files/usr/bin/doornet2-updater


          # ----------------------------------------------------------
          # LuCI controller
          # ----------------------------------------------------------

          cat > files/usr/lib/lua/luci/controller/doornet2_update.lua <<'EOF'
          module("luci.controller.doornet2_update", package.seeall)

          function index()

              if not nixio.fs.access(
                  "/usr/bin/doornet2-updater"
              ) then
                  return
              end

              local page = entry(
                  {
                      "admin",
                      "system",
                      "doornet2_update"
                  },
                  template("doornet2/update"),
                  _("OpenWrt 在线升级"),
                  90
              )

              page.dependent = false

              entry(
                  {
                      "admin",
                      "system",
                      "doornet2_update",
                      "status"
                  },
                  call("action_status")
              ).leaf = true

              entry(
                  {
                      "admin",
                      "system",
                      "doornet2_update",
                      "check"
                  },
                  call("action_check")
              ).leaf = true

              entry(
                  {
                      "admin",
                      "system",
                      "doornet2_update",
                      "prepare"
                  },
                  call("action_prepare")
              ).leaf = true

              entry(
                  {
                      "admin",
                      "system",
                      "doornet2_update",
                      "upgrade"
                  },
                  call("action_upgrade")
              ).leaf = true
          end


          local function output_json(command)

              local http = require "luci.http"
              local sys = require "luci.sys"

              local result = sys.exec(
                  "/usr/bin/doornet2-updater " ..
                  command ..
                  " 2>/dev/null"
              )

              http.prepare_content(
                  "application/json"
              )

              http.write(result)
          end


          local function require_post()

              local http = require "luci.http"

              if http.getenv(
                  "REQUEST_METHOD"
              ) ~= "POST" then

                  http.status(
                      405,
                      "Method Not Allowed"
                  )

                  http.prepare_content(
                      "application/json"
                  )

                  http.write(
                      '{"ok":false,"message":"POST required"}'
                  )

                  return false
              end

              return true
          end


          function action_status()
              output_json("status")
          end

          function action_check()
              output_json("check")
          end

          function action_prepare()

              if not require_post() then
                  return
              end

              output_json("prepare")
          end

          function action_upgrade()

              if not require_post() then
                  return
              end

              output_json("upgrade")
          end
          EOF


          # ----------------------------------------------------------
          # LuCI page
          # ----------------------------------------------------------

          cat > files/usr/lib/lua/luci/view/doornet2/update.htm <<'EOF'
          <%+header%>

          <h2><%:OpenWrt 在线升级%></h2>

          <div class="cbi-map">

              <div class="cbi-section">

                  <h3><%:固件信息%></h3>

                  <table class="table">

                      <tr class="tr">
                          <td class="td">
                              <strong>当前版本</strong>
                          </td>
                          <td class="td" id="current_version">
                              正在读取...
                          </td>
                      </tr>

                      <tr class="tr">
                          <td class="td">
                              <strong>最新版本</strong>
                          </td>
                          <td class="td" id="latest_version">
                              尚未检查
                          </td>
                      </tr>

                      <tr class="tr">
                          <td class="td">
                              <strong>当前启动介质</strong>
                          </td>
                          <td class="td" id="boot_media">
                              -
                          </td>
                      </tr>

                      <tr class="tr">
                          <td class="td">
                              <strong>物理类型</strong>
                          </td>
                          <td class="td" id="media_type">
                              -
                          </td>
                      </tr>

                      <tr class="tr">
                          <td class="td">
                              <strong>升级目标磁盘</strong>
                          </td>
                          <td class="td" id="upgrade_disk">
                              -
                          </td>
                      </tr>

                      <tr class="tr">
                          <td class="td">
                              <strong>MMC 固定编号</strong>
                          </td>
                          <td class="td" id="mmc_layout">
                              -
                          </td>
                      </tr>

                  </table>

              </div>


              <div class="cbi-section">

                  <h3><%:在线升级%></h3>

                  <p>
                      TF：Linux /dev/mmcblk0<br />
                      eMMC：Linux /dev/mmcblk1
                  </p>

                  <p>
                      正式升级前会同时检查：
                      MMC 控制器、SD/MMC 物理类型、
                      当前根设备以及 sysupgrade 实际目标盘。
                  </p>


                  <div style="margin-top:20px">

                      <input
                          type="button"
                          class="btn cbi-button cbi-button-action"
                          id="btn_check"
                          value="检查更新"
                          onclick="checkUpdate()"
                      />

                      &nbsp;

                      <input
                          type="button"
                          class="btn cbi-button cbi-button-apply"
                          id="btn_prepare"
                          value="下载并校验"
                          onclick="prepareUpdate()"
                          disabled="disabled"
                      />

                      &nbsp;

                      <input
                          type="button"
                          class="btn cbi-button cbi-button-negative"
                          id="btn_upgrade"
                          value="立即升级"
                          onclick="startUpgrade()"
                          disabled="disabled"
                      />

                  </div>


                  <div
                      id="status_box"
                      style="
                          margin-top:20px;
                          padding:15px;
                          border:1px solid #ccc;
                          border-radius:4px;
                          min-height:24px;
                      "
                  >
                      正在读取设备状态...
                  </div>

              </div>

          </div>


          <script type="text/javascript">

          var BASE =
              '<%=luci.dispatcher.build_url(
                  "admin",
                  "system",
                  "doornet2_update"
              )%>';


          function setStatus(text)
          {
              document.getElementById(
                  "status_box"
              ).innerHTML = text;
          }


          function request(path, method, callback)
          {
              var xhr = new XMLHttpRequest();

              xhr.open(
                  method,
                  BASE + "/" + path,
                  true
              );

              if (method == "POST")
              {
                  xhr.setRequestHeader(
                      "Content-Type",
                      "application/x-www-form-urlencoded"
                  );
              }

              xhr.onreadystatechange =
                  function()
                  {
                      if (xhr.readyState != 4)
                          return;

                      var data;

                      try
                      {
                          data =
                              JSON.parse(
                                  xhr.responseText
                              );
                      }
                      catch (e)
                      {
                          callback(
                              {
                                  ok: false,
                                  message:
                                      "返回数据解析失败"
                              }
                          );

                          return;
                      }

                      callback(data);
                  };

              xhr.send(
                  method == "POST"
                      ? "confirm=1"
                      : null
              );
          }


          function showDevice(data)
          {
              if (data.current_version)
                  document.getElementById(
                      "current_version"
                  ).innerHTML =
                      data.current_version;

              if (data.boot_media)
                  document.getElementById(
                      "boot_media"
                  ).innerHTML =
                      data.boot_media;

              if (data.media_type)
                  document.getElementById(
                      "media_type"
                  ).innerHTML =
                      data.media_type;

              if (data.upgrade_disk)
                  document.getElementById(
                      "upgrade_disk"
                  ).innerHTML =
                      data.upgrade_disk;

              if (data.mmc_layout)
                  document.getElementById(
                      "mmc_layout"
                  ).innerHTML =
                      data.mmc_layout;
          }


          function loadStatus()
          {
              request(
                  "status",
                  "GET",
                  function(data)
                  {
                      if (!data.ok)
                      {
                          setStatus(
                              "读取状态失败"
                          );

                          return;
                      }

                      showDevice(data);

                      setStatus(
                          "设备状态已读取。"
                      );
                  }
              );
          }


          function checkUpdate()
          {
              setStatus(
                  "正在检查更新..."
              );

              request(
                  "check",
                  "GET",
                  function(data)
                  {
                      if (!data.ok)
                      {
                          setStatus(
                              "<strong>检查失败：</strong> "
                              +
                              (
                                  data.message ||
                                  "未知错误"
                              )
                          );

                          return;
                      }

                      showDevice(data);

                      document.getElementById(
                          "latest_version"
                      ).innerHTML =
                          data.latest_version;

                      if (data.update_available)
                      {
                          document.getElementById(
                              "btn_prepare"
                          ).disabled = false;

                          setStatus(
                              "<strong>发现新版本。</strong>"
                              +
                              "<br />MMC 固定编号：通过"
                          );
                      }
                      else
                      {
                          setStatus(
                              "<strong>当前已经是最新版本。</strong>"
                          );
                      }
                  }
              );
          }


          function prepareUpdate()
          {
              if (!confirm(
                  "下载固件并执行全部安全校验？"
              ))
                  return;

              document.getElementById(
                  "btn_prepare"
              ).disabled = true;

              setStatus(
                  "正在下载、校验 SHA256、sysupgrade 和物理目标盘..."
              );

              request(
                  "prepare",
                  "POST",
                  function(data)
                  {
                      if (!data.ok)
                      {
                          setStatus(
                              "<strong>准备失败：</strong> "
                              +
                              (
                                  data.message ||
                                  "未知错误"
                              )
                              +
                              (
                                  data.guard_message
                                  ? "<br />保险锁：" +
                                    data.guard_message
                                  : ""
                              )
                          );

                          return;
                      }

                      showDevice(data);

                      document.getElementById(
                          "btn_upgrade"
                      ).disabled = false;

                      setStatus(
                          "<strong>固件准备完成。</strong>"
                          +
                          "<br />SHA256：通过"
                          +
                          "<br />sysupgrade：通过"
                          +
                          "<br />MMC 固定编号：通过"
                          +
                          "<br />物理介质：" +
                          data.media_type
                          +
                          "<br />DoorNet2 目标：" +
                          data.upgrade_disk
                          +
                          "<br />sysupgrade 目标：" +
                          data.sysupgrade_disk
                          +
                          "<br />目标保险锁：通过"
                      );
                  }
              );
          }


          function startUpgrade()
          {
              if (!confirm(
                  "正式开始升级？\n\n" +
                  "系统会在写盘前再次执行最终目标盘保护检查。\n\n" +
                  "升级期间不要断电。"
              ))
                  return;

              setStatus(
                  "正在执行最终保险检查..."
              );

              request(
                  "upgrade",
                  "POST",
                  function(data)
                  {
                      if (!data.ok)
                      {
                          setStatus(
                              "<strong>拒绝升级：</strong> "
                              +
                              (
                                  data.message ||
                                  "未知错误"
                              )
                              +
                              (
                                  data.guard_message
                                  ? "<br />保险锁：" +
                                    data.guard_message
                                  : ""
                              )
                          );

                          return;
                      }

                      setStatus(
                          "<strong>升级已启动。</strong>"
                          +
                          "<br />目标：" +
                          data.upgrade_disk
                          +
                          "<br />sysupgrade：" +
                          data.sysupgrade_disk
                          +
                          "<br />保险锁：通过"
                          +
                          "<br /><br />设备即将自动重启。"
                      );
                  }
              );
          }


          window.onload = loadStatus;

          </script>

          <%+footer%>
          EOF


      # ============================================================
      # 12A. PassWall safe online updater
      #
      # PassWall itself and its userspace cores are published into the same
      # DoorNet2 GitHub OPKG feed as the firmware build. This means they can
      # be updated without flashing the whole firmware, while avoiding
      # third-party kernel-module ABI mismatches.
      # ============================================================

      - name: Add PassWall online updater
        run: |
          set -e

          mkdir -p \
            files/usr/bin \
            files/usr/lib/lua/luci/controller \
            files/usr/lib/lua/luci/view/doornet2

          cat > files/usr/bin/doornet2-passwall-updater <<'EOF'
          #!/bin/sh

          export PATH=/usr/sbin:/usr/bin:/sbin:/bin

          FILTER='^(luci-app-passwall|luci-i18n-passwall-|chinadns-ng|dns2socks|ipt2socks|microsocks|tcping|xray-core)$'

          json_escape()
          {
              printf '%s' "$1" \
                | sed \
                    -e 's/\\/\\\\/g' \
                    -e 's/"/\\"/g' \
                    -e ':a;N;$!ba;s/\n/\\n/g'
          }

          installed_version()
          {
              opkg status luci-app-passwall 2>/dev/null \
                | awk -F': ' '$1 == "Version" { print $2; exit }'
          }

          available_version()
          {
              opkg list luci-app-passwall 2>/dev/null \
                | awk '$1 == "luci-app-passwall" { print $3; exit }'
          }

          upgradable_packages()
          {
              opkg list-upgradable 2>/dev/null \
                | awk '{ print $1 }' \
                | grep -E "$FILTER" \
                || true
          }

          status_json()
          {
              local installed available packages count

              installed="$(installed_version)"
              available="$(available_version)"
              packages="$(upgradable_packages)"
              count="$(printf '%s\n' "$packages" | sed '/^$/d' | wc -l)"

              printf '{'
              printf '"installed":"%s",' "$(json_escape "${installed:-not-installed}")"
              printf '"available":"%s",' "$(json_escape "${available:-unknown}")"
              printf '"count":%s,' "${count:-0}"
              printf '"packages":"%s"' "$(json_escape "$packages")"
              printf '}\n'
          }

          do_check()
          {
              opkg update >/tmp/passwall-opkg-update.log 2>&1 || {
                  printf '{"ok":false,"message":"OPKG 更新失败，请查看 /tmp/passwall-opkg-update.log"}\n'
                  return 1
              }

              printf '{"ok":true,"status":'
              status_json | tr -d '\n'
              printf '}\n'
          }

          do_upgrade()
          {
              local packages

              opkg update >/tmp/passwall-opkg-update.log 2>&1 || {
                  printf '{"ok":false,"message":"OPKG 更新失败"}\n'
                  return 1
              }

              packages="$(upgradable_packages)"

              if [ -z "$packages" ]; then
                  printf '{"ok":true,"message":"PassWall 已经是最新版本，没有需要更新的组件。"}\n'
                  return 0
              fi

              echo "$packages" > /tmp/passwall-upgrade-packages.txt

              # shellcheck disable=SC2086
              if opkg upgrade $packages >/tmp/passwall-upgrade.log 2>&1; then
                  rm -rf /tmp/luci-indexcache /tmp/luci-modulecache
                  /etc/init.d/uhttpd restart >/dev/null 2>&1 || true
                  printf '{"ok":true,"message":"PassWall 在线更新完成。建议刷新浏览器；如核心正在运行，可重启 PassWall 服务。"}\n'
              else
                  printf '{"ok":false,"message":"PassWall 更新失败，请查看 /tmp/passwall-upgrade.log"}\n'
                  return 1
              fi
          }

          case "$1" in
              status)
                  status_json
                  ;;
              check)
                  do_check
                  ;;
              upgrade)
                  do_upgrade
                  ;;
              *)
                  echo "Usage: doornet2-passwall-updater {status|check|upgrade}" >&2
                  exit 1
                  ;;
          esac
          EOF

          chmod 755 files/usr/bin/doornet2-passwall-updater
          sh -n files/usr/bin/doornet2-passwall-updater

          cat > files/usr/lib/lua/luci/controller/doornet2_passwall_update.lua <<'EOF'
          module("luci.controller.doornet2_passwall_update", package.seeall)

          function index()
              if not nixio.fs.access("/usr/bin/doornet2-passwall-updater") then
                  return
              end

              local page = entry(
                  {"admin", "services", "doornet2_passwall_update"},
                  template("doornet2/passwall_update"),
                  _("PassWall 在线升级"),
                  99
              )
              page.dependent = false

              entry(
                  {"admin", "services", "doornet2_passwall_update", "status"},
                  call("action_status")
              ).leaf = true

              entry(
                  {"admin", "services", "doornet2_passwall_update", "check"},
                  call("action_check")
              ).leaf = true

              entry(
                  {"admin", "services", "doornet2_passwall_update", "upgrade"},
                  call("action_upgrade")
              ).leaf = true
          end

          local function output(command)
              local http = require "luci.http"
              local sys = require "luci.sys"
              http.prepare_content("application/json")
              http.write(sys.exec("/usr/bin/doornet2-passwall-updater " .. command .. " 2>/dev/null"))
          end

          function action_status()
              output("status")
          end

          function action_check()
              output("check")
          end

          function action_upgrade()
              output("upgrade")
          end
          EOF

          cat > files/usr/lib/lua/luci/view/doornet2/passwall_update.htm <<'EOF'
          <%+header%>

          <h2><%:PassWall 在线升级%></h2>

          <div class="cbi-map-descr">
            <%:只更新 PassWall、中文包以及 PassWall 使用的用户态核心组件。不会更新内核、kmod，也不会刷写 DoorNet2 固件。更新包来自 DoorNet2 自己的 GitHub OPKG feed，与当前固件使用同一套源码和编译环境。%>
          </div>

          <div class="cbi-section">
            <div class="cbi-section-node">
              <p><strong><%:已安装版本%>：</strong><span id="pw-installed">读取中...</span></p>
              <p><strong><%:Feed 版本%>：</strong><span id="pw-available">读取中...</span></p>
              <p><strong><%:可更新组件%>：</strong><span id="pw-count">-</span></p>
              <pre id="pw-packages" style="white-space:pre-wrap;min-height:40px"></pre>

              <p>
                <button class="cbi-button cbi-button-action" type="button" onclick="pwCheck()"><%:检查更新%></button>
                <button class="cbi-button cbi-button-apply" type="button" onclick="pwUpgrade()"><%:立即更新%></button>
              </p>

              <div id="pw-message"></div>
            </div>
          </div>

          <script type="text/javascript">
          function setMsg(s) {
              document.getElementById('pw-message').innerHTML = s || '';
          }

          function renderStatus(s) {
              if (!s) return;
              document.getElementById('pw-installed').textContent = s.installed || 'unknown';
              document.getElementById('pw-available').textContent = s.available || 'unknown';
              document.getElementById('pw-count').textContent = s.count || 0;
              document.getElementById('pw-packages').textContent = s.packages || '没有可更新组件';
          }

          function req(path, cb) {
              XHR.get('<%=luci.dispatcher.build_url("admin/services/doornet2_passwall_update")%>/' + path, null, function(x, data) {
                  cb(data || {});
              });
          }

          function pwStatus() {
              req('status', function(data) { renderStatus(data); });
          }

          function pwCheck() {
              setMsg('正在更新软件列表并检查 PassWall...');
              req('check', function(data) {
                  if (data.ok && data.status) {
                      renderStatus(data.status);
                      setMsg('<strong>检查完成。</strong>');
                  } else {
                      setMsg('<strong>检查失败：</strong>' + (data.message || 'unknown'));
                  }
              });
          }

          function pwUpgrade() {
              if (!confirm('确认在线更新 PassWall 及其用户态核心组件？')) return;
              setMsg('正在更新，请不要关闭页面或断电...');
              req('upgrade', function(data) {
                  setMsg('<strong>' + (data.message || (data.ok ? '完成' : '失败')) + '</strong>');
                  setTimeout(pwStatus, 2500);
              });
          }

          window.onload = pwStatus;
          </script>

          <%+footer%>
          EOF

          echo "===== PASSWALL ONLINE UPDATER ====="
          sh -n files/usr/bin/doornet2-passwall-updater
          grep -nE \
            'PassWall 在线升级|doornet2-passwall-updater' \
            files/usr/lib/lua/luci/controller/doornet2_passwall_update.lua


      # ============================================================
      # 12B. DoorNet2 network application online updater
      #
      # Online-updatable userspace components:
      #   - PassWall proxy routing
      #   - SmartDNS DNS acceleration
      # AdGuard Home is firmware-pinned and intentionally excluded from OPKG app updates.
      #
      # No kmod/kernel package is ever selected by this updater.
      # Packages come from DoorNet2's own GitHub OPKG feed built by the
      # same workflow as the firmware.
      # ============================================================

      - name: Add network apps online updater
        run: |
          set -e

          mkdir -p \
            files/usr/bin \
            files/usr/lib/lua/luci/controller \
            files/usr/lib/lua/luci/view/doornet2

          cat > files/usr/bin/doornet2-app-updater <<'EOF'
          #!/bin/sh

          export PATH=/usr/sbin:/usr/bin:/sbin:/bin

          json_escape()
          {
              printf '%s' "$1" \
                | sed \
                    -e 's/\\/\\\\/g' \
                    -e 's/"/\\"/g' \
                    -e ':a;N;$!ba;s/\n/\\n/g'
          }

          component_meta()
          {
              case "$1" in
                  passwall)
                      LABEL='PassWall 代理分流'
                      MAIN='luci-app-passwall'
                      SERVICE='passwall'
                      FILTER='^(luci-app-passwall|luci-i18n-passwall-|chinadns-ng|dns2socks|ipt2socks|microsocks|tcping|xray-core)$'
                      ;;
                  smartdns)
                      LABEL='SmartDNS DNS 加速'
                      MAIN='smartdns'
                      SERVICE='smartdns'
                      FILTER='^(smartdns|smartdns-ui|luci-app-smartdns|luci-i18n-smartdns-.*)$'
                      ;;
                  *)
                      return 1
                      ;;
              esac

              return 0
          }

          installed_version()
          {
              opkg status "$MAIN" 2>/dev/null \
                | awk -F': ' '$1 == "Version" { print $2; exit }'
          }

          available_version()
          {
              opkg list "$MAIN" 2>/dev/null \
                | awk -v p="$MAIN" '$1 == p { print $3; exit }'
          }

          upgradable_packages()
          {
              opkg list-upgradable 2>/dev/null \
                | awk '{ print $1 }' \
                | grep -E "$FILTER" \
                || true
          }

          status_json()
          {
              local component installed available packages count

              component="$1"

              component_meta "$component" || {
                  printf '{"ok":false,"message":"unknown component"}\n'
                  return 1
              }

              installed="$(installed_version)"
              available="$(available_version)"
              packages="$(upgradable_packages)"
              count="$(printf '%s\n' "$packages" | sed '/^$/d' | wc -l)"

              printf '{'
              printf '"ok":true,'
              printf '"component":"%s",' "$(json_escape "$component")"
              printf '"label":"%s",' "$(json_escape "$LABEL")"
              printf '"installed":"%s",' "$(json_escape "${installed:-not-installed}")"
              printf '"available":"%s",' "$(json_escape "${available:-unknown}")"
              printf '"count":%s,' "${count:-0}"
              printf '"packages":"%s"' "$(json_escape "$packages")"
              printf '}\n'
          }

          do_refresh()
          {
              if opkg update >/tmp/doornet2-app-opkg-update.log 2>&1; then
                  printf '{"ok":true,"message":"软件列表更新完成"}\n'
              else
                  printf '{"ok":false,"message":"OPKG 更新失败，请查看 /tmp/doornet2-app-opkg-update.log"}\n'
                  return 1
              fi
          }

          do_upgrade()
          {
              local component packages was_enabled

              component="$1"

              component_meta "$component" || {
                  printf '{"ok":false,"message":"unknown component"}\n'
                  return 1
              }

              opkg update >/tmp/doornet2-app-opkg-update.log 2>&1 || {
                  printf '{"ok":false,"message":"OPKG 更新失败"}\n'
                  return 1
              }

              packages="$(upgradable_packages)"

              if [ -z "$packages" ]; then
                  printf '{"ok":true,"message":"%s 已经是最新版本，没有需要更新的组件。"}\n' \
                    "$(json_escape "$LABEL")"
                  return 0
              fi

              # The filters above intentionally exclude all kmod/kernel packages.
              echo "$packages" > "/tmp/doornet2-${component}-upgrade-packages.txt"

              was_enabled=0
              if [ -n "$SERVICE" ] && [ -x "/etc/init.d/$SERVICE" ]; then
                  "/etc/init.d/$SERVICE" enabled >/dev/null 2>&1 && was_enabled=1 || true
              fi

              # shellcheck disable=SC2086
              if opkg upgrade $packages >"/tmp/doornet2-${component}-upgrade.log" 2>&1; then
                  rm -rf /tmp/luci-indexcache /tmp/luci-modulecache

                  if [ "$was_enabled" = "1" ] && [ -x "/etc/init.d/$SERVICE" ]; then
                      "/etc/init.d/$SERVICE" restart >/dev/null 2>&1 || true
                  fi

                  /etc/init.d/uhttpd restart >/dev/null 2>&1 || true

                  printf '{"ok":true,"message":"%s 在线更新完成。"}\n' \
                    "$(json_escape "$LABEL")"
              else
                  printf '{"ok":false,"message":"%s 更新失败，请查看 %s"}\n' \
                    "$(json_escape "$LABEL")" \
                    "$(json_escape "/tmp/doornet2-${component}-upgrade.log")"
                  return 1
              fi
          }

          case "$1" in
              refresh)
                  do_refresh
                  ;;
              status)
                  status_json "$2"
                  ;;
              upgrade)
                  do_upgrade "$2"
                  ;;
              *)
                  echo "Usage: doornet2-app-updater {refresh|status COMPONENT|upgrade COMPONENT}" >&2
                  exit 1
                  ;;
          esac
          EOF

          chmod 755 files/usr/bin/doornet2-app-updater
          sh -n files/usr/bin/doornet2-app-updater

          cat > files/usr/lib/lua/luci/controller/doornet2_app_update.lua <<'EOF'
          module("luci.controller.doornet2_app_update", package.seeall)

          local allowed = {
              passwall = true,
              smartdns = true
          }

          function index()
              if not nixio.fs.access("/usr/bin/doornet2-app-updater") then
                  return
              end

              local page = entry(
                  {"admin", "services", "doornet2_app_update"},
                  template("doornet2/app_update"),
                  _("OpenWrt 组件在线升级"),
                  98
              )
              page.dependent = false

              entry(
                  {"admin", "services", "doornet2_app_update", "refresh"},
                  call("action_refresh")
              ).leaf = true

              entry(
                  {"admin", "services", "doornet2_app_update", "status"},
                  call("action_status")
              ).leaf = true

              entry(
                  {"admin", "services", "doornet2_app_update", "upgrade"},
                  call("action_upgrade")
              ).leaf = true
          end

          local function output(command, component)
              local http = require "luci.http"
              local sys = require "luci.sys"

              http.prepare_content("application/json")

              if component and not allowed[component] then
                  http.write('{"ok":false,"message":"invalid component"}')
                  return
              end

              local cmd = "/usr/bin/doornet2-app-updater " .. command

              if component then
                  cmd = cmd .. " " .. component
              end

              http.write(sys.exec(cmd .. " 2>/dev/null"))
          end

          function action_refresh()
              output("refresh", nil)
          end

          function action_status()
              local http = require "luci.http"
              output("status", http.formvalue("component"))
          end

          function action_upgrade()
              local http = require "luci.http"
              output("upgrade", http.formvalue("component"))
          end
          EOF

          cat > files/usr/lib/lua/luci/view/doornet2/app_update.htm <<'EOF'
          <%+header%>

          <h2><%:OpenWrt 组件在线升级%></h2>

          <div class="cbi-map-descr">
            <%:这里仅更新 PassWall 与 SmartDNS 用户态应用包，不更新内核/kmod，也不会刷写固件。AdGuard Home 由固件固定为兼容版本，避免 OPKG 降级造成 DNS 故障。%>
          </div>

          <p>
            <button class="cbi-button cbi-button-action" type="button" onclick="refreshAll()"><%:更新软件列表并检查全部%></button>
          </p>

          <div id="dn-app-message"></div>

          <div class="cbi-section">
            <div class="cbi-section-node">
              <table class="table">
                <tr class="tr table-titles">
                  <th class="th"><%:组件%></th>
                  <th class="th"><%:当前版本%></th>
                  <th class="th"><%:Feed版本%></th>
                  <th class="th"><%:可更新包%></th>
                  <th class="th"><%:操作%></th>
                </tr>
                <tbody id="dn-app-body"></tbody>
              </table>
            </div>
          </div>

          <script type="text/javascript">
          var components = [
              ['passwall', 'PassWall 代理分流'],
              ['smartdns', 'SmartDNS DNS 加速']
          ];

          function esc(s) {
              return String(s == null ? '' : s)
                  .replace(/&/g, '&amp;')
                  .replace(/</g, '&lt;')
                  .replace(/>/g, '&gt;')
                  .replace(/"/g, '&quot;');
          }

          function rowHtml(c, label) {
              return '<tr class="tr" id="row-' + c + '">' +
                  '<td class="td"><strong>' + esc(label) + '</strong></td>' +
                  '<td class="td" id="installed-' + c + '">读取中...</td>' +
                  '<td class="td" id="available-' + c + '">读取中...</td>' +
                  '<td class="td"><span id="count-' + c + '">-</span><pre id="packages-' + c + '" style="white-space:pre-wrap;margin:6px 0 0"></pre></td>' +
                  '<td class="td"><button class="cbi-button cbi-button-apply" type="button" onclick="upgradeOne(\'' + c + '\',\'' + esc(label) + '\')">在线更新</button></td>' +
                  '</tr>';
          }

          function initRows() {
              var html = '';
              for (var i = 0; i < components.length; i++) {
                  html += rowHtml(components[i][0], components[i][1]);
              }
              document.getElementById('dn-app-body').innerHTML = html;
          }

          function setMsg(s) {
              document.getElementById('dn-app-message').innerHTML = s || '';
          }

          function statusOne(c) {
              XHR.get(
                  '<%=luci.dispatcher.build_url("admin/services/doornet2_app_update/status")%>',
                  { component: c },
                  function(x, data) {
                      data = data || {};
                      document.getElementById('installed-' + c).textContent = data.installed || 'unknown';
                      document.getElementById('available-' + c).textContent = data.available || 'unknown';
                      document.getElementById('count-' + c).textContent = data.count || 0;
                      document.getElementById('packages-' + c).textContent = data.packages || '';
                  }
              );
          }

          function statusAll() {
              for (var i = 0; i < components.length; i++) {
                  statusOne(components[i][0]);
              }
          }

          function refreshAll() {
              setMsg('<strong>正在更新软件列表...</strong>');
              XHR.get(
                  '<%=luci.dispatcher.build_url("admin/services/doornet2_app_update/refresh")%>',
                  null,
                  function(x, data) {
                      data = data || {};
                      setMsg('<strong>' + esc(data.message || (data.ok ? '检查完成' : '检查失败')) + '</strong>');
                      statusAll();
                  }
              );
          }

          function upgradeOne(c, label) {
              if (!confirm('确认在线更新 ' + label + '？')) return;

              setMsg('<strong>正在更新 ' + esc(label) + '，请不要断电...</strong>');

              XHR.get(
                  '<%=luci.dispatcher.build_url("admin/services/doornet2_app_update/upgrade")%>',
                  { component: c },
                  function(x, data) {
                      data = data || {};
                      setMsg('<strong>' + esc(data.message || (data.ok ? '完成' : '失败')) + '</strong>');
                      setTimeout(function() { statusOne(c); }, 2500);
                  }
              );
          }

          initRows();
          statusAll();
          </script>

          <%+footer%>
          EOF

          echo "===== NETWORK APPS ONLINE UPDATER ====="
          sh -n files/usr/bin/doornet2-app-updater
          grep -nE \
            'OpenWrt 组件在线升级|doornet2-app-updater' \
            files/usr/lib/lua/luci/controller/doornet2_app_update.lua


      # ============================================================
      # 13. Packages
      # ============================================================

      - name: Configure DoorNet2 and packages
        run: |
          set -e

          cat >> .config <<'EOF'

          CONFIG_TARGET_rockchip=y
          CONFIG_TARGET_rockchip_armv8=y
          CONFIG_TARGET_MULTI_PROFILE=y

          CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_embedfire_doornet2=y

          CONFIG_TARGET_KERNEL_PARTSIZE=64
          CONFIG_TARGET_ROOTFS_PARTSIZE=7168

          CONFIG_TARGET_ROOTFS_TARGZ=y
          CONFIG_TARGET_ROOTFS_EXT4FS=y
          CONFIG_TARGET_ROOTFS_SQUASHFS=y

          CONFIG_PACKAGE_luci-app-store=y
          CONFIG_PACKAGE_luci-compat=y

          # PassWall (official Openwrt-Passwall feeds)
          # DoorNet2 stable tree uses firewall3 + legacy iptables.
          # R4 keeps only the Xray core and explicitly includes the IPv4/IPv6
          # legacy xtables dependencies needed by PassWall.
          # CONFIG_PACKAGE_dnsmasq is not set
          CONFIG_PACKAGE_dnsmasq-full=y
          CONFIG_PACKAGE_luci-app-passwall=y
          CONFIG_PACKAGE_luci-i18n-passwall-zh-cn=y

          # DoorNet2/RK3399 stable tree uses firewall3 + legacy iptables.
          # R34 accidentally selected the nftables option even though fw4/nft
          # were absent. R4 explicitly selects the matching iptables backend.
          CONFIG_PACKAGE_luci-app-passwall_Iptables_Transparent_Proxy=y
          # CONFIG_PACKAGE_luci-app-passwall_Nftables_Transparent_Proxy is not set

          # Explicit IPv4/IPv6 legacy xtables userspace + kernel support.
          # In this LEDE tree the normal `iptables` and `ip6tables` packages
          # install the legacy xtables binaries. There are no *-zz-legacy
          # package symbols here.
          CONFIG_PACKAGE_iptables=y
          CONFIG_PACKAGE_ip6tables=y
          CONFIG_PACKAGE_kmod-ip6tables=y

          # R4 keeps PassWall intentionally lean: Xray only.
          # This avoids optional cores/plugins that either need newer Go/Rust
          # toolchains or previously failed on this legacy LEDE/RK3399 tree.
          # CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Geoview is not set
          # CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Haproxy is not set
          # CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Hysteria is not set
          # CONFIG_PACKAGE_luci-app-passwall_INCLUDE_NaiveProxy is not set

          # CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Shadowsocks_Libev_Client is not set
          # CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Shadowsocks_Libev_Server is not set
          # CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Shadowsocks_Rust_Client is not set
          # CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Shadowsocks_Rust_Server is not set
          # CONFIG_PACKAGE_luci-app-passwall_INCLUDE_ShadowsocksR_Libev_Client is not set
          # CONFIG_PACKAGE_luci-app-passwall_INCLUDE_ShadowsocksR_Libev_Server is not set

          # CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Simple_Obfs is not set
          # CONFIG_PACKAGE_luci-app-passwall_INCLUDE_SingBox is not set
          # CONFIG_PACKAGE_sing-box is not set
          # CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Trojan_Plus is not set
          # CONFIG_PACKAGE_luci-app-passwall_INCLUDE_tuic_client is not set
          # CONFIG_PACKAGE_luci-app-passwall_INCLUDE_V2ray_Geodata is not set
          # CONFIG_PACKAGE_luci-app-passwall_INCLUDE_V2ray_Plugin is not set
          # CONFIG_PACKAGE_v2ray-plugin is not set
          # CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Xray_Plugin is not set

          # Xray 25.1.30 is the sole proxy core in R4.
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Xray=y

          # DNS acceleration / game acceleration / DNS filtering
          # R4 prepares SmartDNS on :6053 without taking over dnsmasq.
          # AdGuard remains user-initialized; the DNS-chain helper only
          # switches dnsmasq after AdGuard is actually listening on :3053.
          CONFIG_PACKAGE_smartdns=y
          CONFIG_PACKAGE_adguardhome=y
          CONFIG_PACKAGE_luci-app-smartdns=y
          CONFIG_PACKAGE_luci-i18n-smartdns-zh-cn=y
          # NetEase UU Game Booster is retained as a user-managed app.
          # Firmware does not change its settings; selecting the packages prevents
          # a retained online upgrade from dropping the installed app.

          # iStoreOS-style QuickStart dashboard
          CONFIG_PACKAGE_quickstart=y
          CONFIG_PACKAGE_luci-app-quickstart=y
          CONFIG_PACKAGE_luci-i18n-quickstart-zh-cn=y

          # V5.3.3 UI:
          # Lua-compatible Argon is default; Bootstrap stays as fallback.
          # QuickStart is installed above as an optional app, not as homepage.
          CONFIG_PACKAGE_luci-theme-bootstrap=y
          CONFIG_PACKAGE_luci-theme-argon=y
          # CONFIG_PACKAGE_luci-theme-design is not set
          # CONFIG_PACKAGE_luci-app-argon-config is not set

          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_ca-bundle=y
          CONFIG_PACKAGE_ca-certificates=y
          CONFIG_PACKAGE_jsonfilter=y

          CONFIG_PACKAGE_lsblk=y
          CONFIG_PACKAGE_fdisk=y
          CONFIG_PACKAGE_sfdisk=y
          CONFIG_PACKAGE_blkid=y
          CONFIG_PACKAGE_blockdev=y
          CONFIG_PACKAGE_partx-utils=y
          CONFIG_PACKAGE_mount-utils=y

          CONFIG_PACKAGE_e2fsprogs=y
          CONFIG_PACKAGE_resize2fs=y
          CONFIG_PACKAGE_tune2fs=y

          CONFIG_PACKAGE_block-mount=y
          CONFIG_PACKAGE_kmod-fs-ext4=y

          EOF


      # ============================================================
      # 14. Config
      # ============================================================

      - name: Generate configuration file
        run: |
          set -e

          make defconfig

          echo "===== TARGET ====="

          grep -E \
            'CONFIG_TARGET.*embedfire_doornet2' \
            .config || true

          echo
          echo "===== VERSION ====="

          cat files/etc/doornet2_release

          echo
          echo "===== UPDATER ====="

          sh -n files/usr/bin/doornet2-updater

          grep -nE \
            'fe320000|fe330000|verify_mmc_host_layout|verify_sysupgrade_target' \
            files/usr/bin/doornet2-updater

          grep -q 'OpenWrt 在线升级' files/usr/lib/lua/luci/controller/doornet2_update.lua
          grep -q 'OpenWrt 在线升级' files/usr/lib/lua/luci/view/doornet2/update.htm
          ! grep -q 'DoorNet2 在线升级' files/usr/lib/lua/luci/controller/doornet2_update.lua
          ! grep -q 'DoorNet2 在线升级' files/usr/lib/lua/luci/view/doornet2/update.htm

          echo
          echo "===== PASSWALL PACKAGES ====="

          grep -E \
            '^CONFIG_PACKAGE_(luci-app-passwall|luci-i18n-passwall-zh-cn|dnsmasq-full)=y$' \
            .config || true

          echo "===== PASSWALL BACKEND / CORE SYMBOLS ====="
          grep -E \
            '^(CONFIG_PACKAGE_(luci-app-passwall(_.*)?|iptables|ip6tables|kmod-ip6tables|firewall4)=|# CONFIG_PACKAGE_(luci-app-passwall_.*|firewall4) is not set)' \
            .config || true

          grep -q '^CONFIG_PACKAGE_luci-app-passwall=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-i18n-passwall-zh-cn=y$' .config
          grep -q '^CONFIG_PACKAGE_dnsmasq-full=y$' .config

          if ! grep -q '^CONFIG_PACKAGE_luci-app-passwall_Iptables_Transparent_Proxy=y$' .config; then
              echo "ERROR: PassWall iptables backend was not selected."
              grep -E 'luci-app-passwall_.*Transparent_Proxy|CONFIG_PACKAGE_firewall4' .config || true
              exit 1
          fi

          if grep -q '^CONFIG_PACKAGE_luci-app-passwall_Nftables_Transparent_Proxy=y$' .config; then
              echo "ERROR: PassWall nftables backend was unexpectedly selected."
              exit 1
          fi

          grep -q '^CONFIG_PACKAGE_iptables=y$' .config
          grep -q '^CONFIG_PACKAGE_ip6tables=y$' .config
          grep -q '^CONFIG_PACKAGE_kmod-ip6tables=y$' .config

          grep -q '^CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Xray=y$' .config

          # Optional cores only need to be absent; Kconfig may either emit an
          # explicit '# ... is not set' line or omit a hidden symbol entirely.
          for sym in \
            SingBox \
            V2ray_Plugin \
            Geoview \
            Haproxy \
            Shadowsocks_Libev_Client \
            Shadowsocks_Libev_Server \
            Shadowsocks_Rust_Client \
            ShadowsocksR_Libev_Client \
            Simple_Obfs \
            Trojan_Plus
          do
              if grep -q "^CONFIG_PACKAGE_luci-app-passwall_INCLUDE_${sym}=y$" .config; then
                  echo "ERROR: unwanted PassWall optional core selected: ${sym}"
                  exit 1
              fi
          done

          if grep -q '^CONFIG_PACKAGE_sing-box=y$' .config; then
              echo 'ERROR: sing-box unexpectedly selected; current 1.14.0 requires Go >= 1.25.5.'
              exit 1
          fi

          if grep -q '^CONFIG_PACKAGE_v2ray-plugin=y$' .config; then
              echo 'ERROR: v2ray-plugin unexpectedly selected; current 5.49.0 requires Go >= 1.25.5.'
              exit 1
          fi

          XRAY_MK="feeds/passwall_packages/xray-core/Makefile"
          grep -q '^PKG_VERSION:=25\.1\.30$' "$XRAY_MK"
          grep -q '^PKG_HASH:=983ee395f085ed1b7fbe0152cb56a5b605a6f70a5645d427c7186c476f14894e$' "$XRAY_MK"

          if grep -Eq '^CONFIG_PACKAGE_shadowsocks-rust-.*=y$' .config; then
              echo 'ERROR: shadowsocks-rust unexpectedly selected; refusing to start a Rust host build.'
              grep -E '^CONFIG_PACKAGE_shadowsocks-rust-.*=y$' .config || true
              exit 1
          fi

          if grep -Eq '^CONFIG_PACKAGE_shadowsocksr-libev.*=y$' .config; then
              echo 'ERROR: shadowsocksr-libev unexpectedly selected; refusing to start the known-broken legacy SSR build.'
              grep -E '^CONFIG_PACKAGE_shadowsocksr-libev.*=y$' .config || true
              exit 1
          fi

          test -x files/usr/bin/doornet2-passwall-updater

          echo
          echo "===== NETWORK APPS ====="

          grep -E \
            '^CONFIG_PACKAGE_(smartdns|luci-app-smartdns|adguardhome)=y$' \
            .config || true

          grep -q '^CONFIG_PACKAGE_smartdns=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-app-smartdns=y$' .config
          grep -q '^CONFIG_PACKAGE_adguardhome=y$' .config

                    
          echo 'UU packages: absent/not selected (OK)'

          test -x files/usr/bin/doornet2-app-updater
          sh -n files/usr/bin/doornet2-app-updater
          ! grep -Eq '^[[:space:]]*adguard\)' files/usr/bin/doornet2-app-updater
          test -x files/etc/uci-defaults/97-doornet2-network-apps
          sh -n files/etc/uci-defaults/97-doornet2-network-apps
          test -x files/etc/init.d/doornet2-dns-chain
          sh -n files/etc/init.d/doornet2-dns-chain
          test -x files/etc/uci-defaults/96-doornet2-passwall-shunt
          sh -n files/etc/uci-defaults/96-doornet2-passwall-shunt
          test -x files/etc/init.d/passwall-delay
          sh -n files/etc/init.d/passwall-delay

          test -x files/usr/bin/doornet2-dns-postpasswall
          sh -n files/usr/bin/doornet2-dns-postpasswall
          test -x files/usr/bin/doornet2-heal
          sh -n files/usr/bin/doornet2-heal
          test -x files/etc/uci-defaults/94-doornet2-final-helpers
          sh -n files/etc/uci-defaults/94-doornet2-final-helpers
          test -x files/usr/bin/doornet2-health
          sh -n files/usr/bin/doornet2-health
          test -x files/usr/bin/doornet2-readiness
          sh -n files/usr/bin/doornet2-readiness
          test -x files/etc/init.d/doornet2-readiness
          sh -n files/etc/init.d/doornet2-readiness

          grep -q "R4Shunt.remarks='分流总节点'" \
            files/etc/uci-defaults/96-doornet2-passwall-shunt

          PASSWALL_DEFAULT_CFG="feeds/passwall_luci/luci-app-passwall/root/usr/share/passwall/0_default_config"
          test -f "$PASSWALL_DEFAULT_CFG"
          if grep -q "^config nodes 'myshunt'$" "$PASSWALL_DEFAULT_CFG"; then
              echo "ERROR: legacy stock PassWall myshunt is still present."
              exit 1
          fi
          grep -q "DN_WeChat" \
            files/etc/uci-defaults/96-doornet2-passwall-shunt
          grep -q "DN_LINE" \
            files/etc/uci-defaults/96-doornet2-passwall-shunt
          grep -q "DN_OpenAI" \
            files/etc/uci-defaults/96-doornet2-passwall-shunt
          grep -q "DN_Streaming" \
            files/etc/uci-defaults/96-doornet2-passwall-shunt

          echo
          echo "===== V5.3.5 DUALSTACK + PROXY IPv4 + ARGON PACKAGES ====="

          grep -E \
            '^CONFIG_PACKAGE_(quickstart|luci-app-quickstart|luci-i18n-quickstart-zh-cn|luci-theme-bootstrap)=y$' \
            .config || true

          grep -q '^CONFIG_PACKAGE_quickstart=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-app-quickstart=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-theme-bootstrap=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-theme-argon=y$' .config

          ! grep -q '^CONFIG_PACKAGE_luci-theme-design=y$' .config
          ! grep -q '^CONFIG_PACKAGE_luci-app-argon-config=y$' .config

          test -x files/etc/uci-defaults/95-doornet2-ui
          grep -q "mediaurlbase='/luci-static/argon'" \
            files/etc/uci-defaults/95-doornet2-ui
          grep -q "system.@system\[0\].hostname='OpenWrt'" \
            files/etc/uci-defaults/95-doornet2-ui
          test ! -e files/etc/config/design


      - name: V5.3.5 solidified precompile source guards
        shell: bash
        run: |
          set -euo pipefail

          echo "===== V5.3.5 SOURCE GUARDS ====="

          for f in \
            files/etc/init.d/doornet2-dns-chain \
            files/etc/init.d/passwall-delay \
            files/etc/init.d/doornet2-selfheal \
            files/usr/bin/doornet2-dns-postpasswall \
            files/usr/bin/doornet2-heal \
            files/usr/bin/doornet2-selfheal-loop
          do
              test -x "$f"
              sh -n "$f"
          done

          test -f files/etc/smartdns/custom.conf
          grep -Fxq 'server-tcp 1.1.1.1:53 -group proxy-test' files/etc/smartdns/custom.conf
          grep -Fxq 'server-tcp 8.8.8.8:53 -group proxy-test' files/etc/smartdns/custom.conf
          grep -Fxq 'nameserver /openai.com/proxy-test' files/etc/smartdns/custom.conf
          grep -Fxq 'address /openai.com/#6' files/etc/smartdns/custom.conf
          grep -Fxq 'nameserver /openai.com.cdn.cloudflare.net/proxy-test' files/etc/smartdns/custom.conf
          grep -Fxq 'address /openai.com.cdn.cloudflare.net/#6' files/etc/smartdns/custom.conf
          grep -Fxq 'nameserver /x.com/proxy-test' files/etc/smartdns/custom.conf
          grep -Fxq 'address /x.com/#6' files/etc/smartdns/custom.conf
          grep -Fxq 'nameserver /twitter.com/proxy-test' files/etc/smartdns/custom.conf
          grep -Fxq 'address /twitter.com/#6' files/etc/smartdns/custom.conf
          grep -Fxq 'nameserver /twimg.com/proxy-test' files/etc/smartdns/custom.conf
          grep -Fxq 'address /twimg.com/#6' files/etc/smartdns/custom.conf
          grep -Fxq 'nameserver /t.co/proxy-test' files/etc/smartdns/custom.conf
          grep -Fxq 'address /t.co/#6' files/etc/smartdns/custom.conf

          echo "===== UU REMOVED SOURCE GUARD ====="
          test ! -e files/usr/bin/doornet2-uu
          test ! -e files/etc/init.d/uu-delay
          test ! -e files/etc/uci-defaults/92-doornet2-remove-uu

          ! grep -q '网易 UU 游戏加速器' files/usr/bin/doornet2-app-updater
          ! grep -q '网易 UU 游戏加速器' files/usr/lib/lua/luci/view/doornet2/app_update.htm
          ! grep -q 'uu = true' files/usr/lib/lua/luci/controller/doornet2_app_update.lua

          guard_require()
          {
              desc="$1"
              shift
              if "$@"; then
                  echo "PASS: $desc"
              else
                  echo "ERROR: $desc"
                  exit 1
              fi
          }

          # V5.3.5 DNS failover guard:
          # validate the new dynamic 3053/6053 switching logic instead of the
          # old V5.3.4 hard-coded dnsmasq->3053 line.
          guard_require "DNS chain has dynamic upstream setter" \
            grep -q 'set_dnsmasq_upstream()' files/etc/init.d/doornet2-dns-chain
          guard_require "DNS chain can activate AdGuard primary" \
            grep -q "set_dnsmasq_upstream '127.0.0.1#3053'" files/etc/init.d/doornet2-dns-chain
          guard_require "DNS chain can activate SmartDNS fallback" \
            grep -q "set_dnsmasq_upstream '127.0.0.1#6053'" files/etc/init.d/doornet2-dns-chain
          guard_require "DNS chain performs real DNS query" \
            grep -q 'dns_query_port_ok()' files/etc/init.d/doornet2-dns-chain
          guard_require "DNS chain records primary health" \
            grep -q 'DNS primary healthy: dnsmasq:53 -> AdGuard:3053 -> SmartDNS:6053' files/etc/init.d/doornet2-dns-chain
          guard_require "DNS chain records fallback health" \
            grep -q 'DNS fallback healthy: dnsmasq:53 -> SmartDNS:6053' files/etc/init.d/doornet2-dns-chain

          guard_require "post-PassWall can use AdGuard primary" \
            grep -q "set_upstream '127.0.0.1#3053'" files/usr/bin/doornet2-dns-postpasswall
          guard_require "post-PassWall can retain SmartDNS fallback" \
            grep -q "set_upstream '127.0.0.1#6053'" files/usr/bin/doornet2-dns-postpasswall
          grep -q 'china-dns 127.0.0.1#6053' files/usr/bin/doornet2-dns-postpasswall
          grep -q 'group-upstream 127.0.0.1#6053' files/usr/bin/doornet2-dns-postpasswall
          grep -q 'dns_query_port_ok 15353' files/usr/bin/doornet2-dns-postpasswall
          guard_require "post-PassWall checks AdGuard process health" \
            grep -q 'pidof AdGuardHome' files/usr/bin/doornet2-dns-postpasswall
          guard_require "post-PassWall performs direct port DNS query" \
            grep -q 'dns_query_port_ok()' files/usr/bin/doornet2-dns-postpasswall
          guard_require "post-PassWall repairs ChinaDNS 3053 to SmartDNS 6053" \
            grep -q 'ChinaDNS domestic/direct/vps upstream corrected: 3053 -> 6053' files/usr/bin/doornet2-dns-postpasswall
          guard_require "post-PassWall validates ChinaDNS 15353" \
            grep -q 'dns_query_port_ok 15353' files/usr/bin/doornet2-dns-postpasswall

          guard_require "self-heal keeps two-strike PassWall guard" \
            grep -q 'PassWall proxy core miss 1/2' files/usr/bin/doornet2-heal
          guard_require "self-heal recognizes Xray or sing-box" \
            grep -q "grep -Eq '\\[x\\]ray|\\[s\\]ing-box'" files/usr/bin/doornet2-heal


          if grep -R -nF 'root@DoorNet2:' \
               files/etc/init.d files/etc/uci-defaults files/usr/bin 2>/dev/null; then
              echo "ERROR: copied shell prompt found in firmware source"
              exit 1
          fi

          if grep -R -nF -- '-ash:' \
               files/etc/init.d files/etc/uci-defaults files/usr/bin 2>/dev/null; then
              echo "ERROR: copied shell diagnostic found in firmware source"
              exit 1
          fi

          if grep -R -nE '\\[https?://' \
               files/etc/init.d files/etc/uci-defaults files/usr/bin 2>/dev/null; then
              echo "ERROR: Markdown-wrapped URL found in shell source"
              exit 1
          fi

          if [ -d files/tmp/dnsmasq.d ] && \
             find files/tmp/dnsmasq.d -type f -print -quit | grep -q .; then
              echo "ERROR: firmware overlay must not contain /tmp/dnsmasq.d backup/test files"
              find files/tmp/dnsmasq.d -type f -print
              exit 1
          fi

          echo "V5.3.5 solidified source guards: PASS"


      # ============================================================
      # 15. Download
      # ============================================================

      - name: Download packages
        run: |
          set -e

          make download -j16

          find dl \
            -size -1024c \
            -exec rm -f {} \;

          # V5.3.5 NO-UU guard: keep both feed-provided UU packages in the
          # download/build plan so retained online upgrades do not remove the app.
                    

      - name: Preflight package selection sanity checks
        run: |
          set -e

          echo "===== PREFLIGHT UU PRESERVE PROFILE ====="
                              echo "UU packages not selected (OK)"

          echo "===== PREFLIGHT PASSWALL GO COMPATIBILITY ====="
          echo "===== PREFLIGHT PASSWALL GO COMPATIBILITY ====="

          grep -q '^CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Xray=y$' .config
          grep -q '^# CONFIG_PACKAGE_luci-app-passwall_INCLUDE_SingBox is not set$' .config
          grep -q '^# CONFIG_PACKAGE_luci-app-passwall_INCLUDE_V2ray_Plugin is not set$' .config

          if grep -q '^CONFIG_PACKAGE_sing-box=y$' .config; then
              echo "ERROR: sing-box was re-selected before compile."
              exit 1
          fi

          if grep -q '^CONFIG_PACKAGE_v2ray-plugin=y$' .config; then
              echo "ERROR: v2ray-plugin was re-selected before compile."
              exit 1
          fi

          XRAY_MK="feeds/passwall_packages/xray-core/Makefile"
          test -f "$XRAY_MK"
          grep -q '^PKG_VERSION:=25\.1\.30$' "$XRAY_MK"
          grep -q '^PKG_HASH:=983ee395f085ed1b7fbe0152cb56a5b605a6f70a5645d427c7186c476f14894e$' "$XRAY_MK"
          grep -q '\$(GO_PKG)/core.build=OpenWrt' "$XRAY_MK"

          if grep -q 'core.version=\$(PKG_VERSION)' "$XRAY_MK"; then
              echo "ERROR: incompatible Xray core.version ldflag returned."
              exit 1
          fi

          echo "Xray 25.1.30 pinned for Go 1.23.1; Sing-box/v2ray-plugin disabled (OK)"


      # ============================================================
      # 16. Compile
      # ============================================================

      - name: Pin PassWall boot order
        run: |
          set -e

          PASSWALL_INIT_SRC="$(
            find feeds package               -type f               -path '*/luci-app-passwall/root/etc/init.d/passwall'               -print             | head -n 1
          )"

          if [ -z "$PASSWALL_INIT_SRC" ]; then
              echo "ERROR: PassWall init source not found"
              exit 1
          fi

          echo "PassWall init source: $PASSWALL_INIT_SRC"
          echo "Before:"
          grep -n '^START=' "$PASSWALL_INIT_SRC" || true

          sed -i -E             's/^START=[0-9]+$/START=19/'             "$PASSWALL_INIT_SRC"

          echo "After:"
          grep -n '^START=' "$PASSWALL_INIT_SRC"

          grep -Eq '^START=19$' "$PASSWALL_INIT_SRC"

          echo "===== INSTALL DOORNET2 POST-PASSWALL DNS HOOK ====="
          python3 - "$PASSWALL_INIT_SRC" <<'PY_PASSWALL_HOOK'
          from pathlib import Path
          import re, sys

          p = Path(sys.argv[1])
          text = p.read_text()

          # Remove an older copy first so rerunning a job remains idempotent.
          text = re.sub(
              r'(?m)^[ \t]*# DOORNET2_DNS_POSTPASSWALL\n'
              r'[ \t]*\[ -x /usr/bin/doornet2-dns-postpasswall \] && '
              r'/usr/bin/doornet2-dns-postpasswall\n?',
              '',
              text,
          )

          pattern = re.compile(r'(?m)^(?P<i>[ \t]*)\$APP_FILE start[ \t]*$')
          matches = list(pattern.finditer(text))
          if len(matches) != 2:
              raise SystemExit(
                  f"ERROR: expected exactly two '$APP_FILE start' lines, found {len(matches)}"
              )

          def repl(m):
              i = m.group("i")
              return (
                  f"{i}$APP_FILE start\n"
                  f"{i}# DOORNET2_DNS_POSTPASSWALL\n"
                  f"{i}[ -x /usr/bin/doornet2-dns-postpasswall ] && "
                  f"/usr/bin/doornet2-dns-postpasswall"
              )

          text = pattern.sub(repl, text)
          p.write_text(text)
          PY_PASSWALL_HOOK

          sh -n "$PASSWALL_INIT_SRC"
          test "$(grep -c 'DOORNET2_DNS_POSTPASSWALL' "$PASSWALL_INIT_SRC")" -eq 2
          test -x files/usr/bin/doornet2-dns-postpasswall


      - name: Compile firmware
        run: |
          make -j$(nproc) || \
            make -j1 V=s

          df -h

          find ./bin/targets/ \
            -type f \
            | sort


      - name: Verify built rootfs safety invariants
        shell: bash
        run: |
          set -e

          WAN_FILE="$(
            find build_dir \
              -type f \
              -path '*/root-*/etc/uci-defaults/96-doornet2-wan' \
              -print \
            | head -n 1
          )"

          if [ -z "$WAN_FILE" ]; then
              echo "ERROR: built rootfs WAN policy file not found"
              exit 1
          fi

          ROOTFS_DIR="${WAN_FILE%/etc/uci-defaults/96-doornet2-wan}"
          echo "Built rootfs: $ROOTFS_DIR"

          grep -q 'preserving existing proto=' "$WAN_FILE"
          grep -q 'retained credentials were found' "$WAN_FILE"

          if grep -Rqs --fixed-strings 'V4UetPzk' "$ROOTFS_DIR/etc" 2>/dev/null; then
              echo "ERROR: built rootfs still contains known default root-password hash"
              exit 1
          fi

          echo "===== BUILT ROOTFS NO UU GUARD ====="
          if find "$ROOTFS_DIR" \
              \( -iname '*uugamebooster*' -o -iname '*luci-app-uugamebooster*' -o -iname '*uuplugin*' -o -iname '*doornet2-uu*' -o -iname '*uu-delay*' \) \
              -print -quit 2>/dev/null | grep -q .; then
              echo "ERROR: built rootfs still contains removed UU components"
              exit 1
          fi

          SMARTDNS_CUSTOM_FILE="$ROOTFS_DIR/etc/smartdns/custom.conf"
          test -f "$SMARTDNS_CUSTOM_FILE"
          grep -Fxq 'nameserver /x.com/proxy-test' "$SMARTDNS_CUSTOM_FILE"
          grep -Fxq 'address /x.com/#6' "$SMARTDNS_CUSTOM_FILE"
          grep -Fxq 'nameserver /twitter.com/proxy-test' "$SMARTDNS_CUSTOM_FILE"
          grep -Fxq 'address /twitter.com/#6' "$SMARTDNS_CUSTOM_FILE"
          grep -Fxq 'nameserver /twimg.com/proxy-test' "$SMARTDNS_CUSTOM_FILE"
          grep -Fxq 'address /twimg.com/#6' "$SMARTDNS_CUSTOM_FILE"
          grep -Fxq 'nameserver /t.co/proxy-test' "$SMARTDNS_CUSTOM_FILE"
          grep -Fxq 'address /t.co/#6' "$SMARTDNS_CUSTOM_FILE"


          test -s "$ROOTFS_DIR/etc/adguardhome.yaml"
          grep -q 'port: 3053' "$ROOTFS_DIR/etc/adguardhome.yaml"
          grep -q '127.0.0.1:6053' "$ROOTFS_DIR/etc/adguardhome.yaml"
          grep -q 'name: AdGuard DNS filter' "$ROOTFS_DIR/etc/adguardhome.yaml"
          grep -q 'name: anti-AD' "$ROOTFS_DIR/etc/adguardhome.yaml"
          grep -q 'aaaa_disabled: false' "$ROOTFS_DIR/etc/adguardhome.yaml"

          # AdGuard must be coordinated by doornet2-dns-chain at boot.
          DNS_CHAIN_FILE="$ROOTFS_DIR/etc/init.d/doornet2-dns-chain"
          test -x "$DNS_CHAIN_FILE"
          grep -q 'SmartDNS :6053 ready' "$DNS_CHAIN_FILE"
          grep -q 'AdGuard :3053 ready' "$DNS_CHAIN_FILE"
          grep -q '/etc/init.d/adguardhome disable' "$ROOTFS_DIR/etc/uci-defaults/97-doornet2-network-apps"
          test -x "$ROOTFS_DIR/etc/init.d/adguardhome"
          grep -q 'DNS-chain helper owns WAN/boot ordering' "$ROOTFS_DIR/etc/init.d/adguardhome"
          grep -q 'procd_add_reload_trigger "adguardhome"' "$ROOTFS_DIR/etc/init.d/adguardhome"

          PASSWALL_INIT_FILE="$ROOTFS_DIR/etc/init.d/passwall"
          PASSWALL_DELAY_FILE="$ROOTFS_DIR/etc/init.d/passwall-delay"
          RC_CLEANUP_FILE="$ROOTFS_DIR/etc/uci-defaults/98-doornet2-rc-cleanup"
          test -x "$PASSWALL_INIT_FILE"
          test -x "$PASSWALL_DELAY_FILE"
          test -x "$RC_CLEANUP_FILE"
          echo "Rootfs service START values:"
          grep -n '^START=' "$PASSWALL_INIT_FILE" || true
          grep -n '^START=' "$PASSWALL_DELAY_FILE" || true
          grep -n '^START=' "$DNS_CHAIN_FILE" || true

          grep -Eq '^START=19$' "$PASSWALL_INIT_FILE"
          grep -Eq '^START=99$' "$PASSWALL_DELAY_FILE"
          grep -Eq '^START=98$' "$DNS_CHAIN_FILE"
          grep -q 'PassWall proxy already running; skip restart' "$PASSWALL_DELAY_FILE"
          grep -q "grep -Eq '\[x\]ray|\[s\]ing-box'" "$PASSWALL_DELAY_FILE"
          grep -q 'rm -f /etc/rc.d/S99passwall' "$RC_CLEANUP_FILE"
          grep -q 'rm -f /etc/rc.d/S19passwall-delay' "$RC_CLEANUP_FILE"

          DNS_POST="$ROOTFS_DIR/usr/bin/doornet2-dns-postpasswall"
          test -x "$DNS_POST"
          sh -n "$DNS_POST"
          test "$(grep -c 'DOORNET2_DNS_POSTPASSWALL' "$PASSWALL_INIT_FILE")" -eq 2
          grep -q '/usr/bin/doornet2-dns-postpasswall' "$PASSWALL_INIT_FILE"

          SMARTDNS_CUSTOM="$ROOTFS_DIR/etc/smartdns/custom.conf"
          test -f "$SMARTDNS_CUSTOM"
          grep -Fxq 'nameserver /openai.com/proxy-test' "$SMARTDNS_CUSTOM"
          grep -Fxq 'address /openai.com/#6' "$SMARTDNS_CUSTOM"
          grep -Fxq 'nameserver /openai.com.cdn.cloudflare.net/proxy-test' "$SMARTDNS_CUSTOM"

          HEAL_FILE="$ROOTFS_DIR/usr/bin/doornet2-heal"
          test -x "$HEAL_FILE"
          grep -q 'PassWall proxy core miss 1/2' "$HEAL_FILE"

          READINESS_FILE="$ROOTFS_DIR/usr/bin/doornet2-readiness"
          test -x "$READINESS_FILE"
          sh -n "$READINESS_FILE"
          test -x "$ROOTFS_DIR/etc/init.d/doornet2-readiness"

          SHUNT_FILE="$ROOTFS_DIR/etc/uci-defaults/96-doornet2-passwall-shunt"
          test -f "$SHUNT_FILE"
          grep -q 'DN_TencentDirect' "$SHUNT_FILE"
          grep -q 'domain:qpic.cn' "$SHUNT_FILE"
          grep -q 'domain:gtimg.com' "$SHUNT_FILE"
          grep -q 'domain:qlogo.cn' "$SHUNT_FILE"
          grep -q "R4Shunt.DN_TencentDirect='_direct'" "$SHUNT_FILE"
          UI95="$ROOTFS_DIR/etc/uci-defaults/95-doornet2-ui"
          UI95="$ROOTFS_DIR/etc/uci-defaults/95-doornet2-ui"
          UI99="$ROOTFS_DIR/etc/uci-defaults/99-doornet2-argon-ui"
          test -f "$UI95"
          test -f "$UI99"
          grep -q "mediaurlbase='/luci-static/argon'" "$UI95"
          grep -q "mediaurlbase='/luci-static/argon'" "$UI99"
          grep -q "system.@system\[0\].hostname='OpenWrt'" "$UI95"

          test -d "$ROOTFS_DIR/www/luci-static/bootstrap"
          test -d "$ROOTFS_DIR/www/luci-static/argon"

          ARGON_HEADER="$ROOTFS_DIR/usr/lib/lua/luci/view/themes/argon/header.htm"
          test -f "$ARGON_HEADER"
          grep -q 'OpenWrt</a>' "$ARGON_HEADER"

          if [ -e "$ROOTFS_DIR/www/luci-static/design" ] || \
             [ -e "$ROOTFS_DIR/etc/config/design" ]; then
              echo "ERROR: built rootfs still contains legacy Design UI"
              exit 1
          fi

          echo "Built rootfs WAN/root-auth/NO-UU/AdGuard/Tencent-direct/Argon safety checks passed"


      # ============================================================
      # 17. Prepare artifacts
      # ============================================================

      - name: Prepare artifact
        run: |
          set -e

          mkdir -p \
            ./artifact/package \
            ./artifact/buildinfo \
            ./artifact/firmware \
            ./artifact/release


          find ./bin/packages/ \
            -type f \
            -name "*.ipk" \
            -exec cp -f {} ./artifact/package/ \;


          find ./bin/targets/ \
            -type f \
            \( \
              -name "*.buildinfo" \
              -o -name "*.manifest" \
              -o -name "*.config" \
            \) \
            -exec cp -f {} ./artifact/buildinfo/ \;


          find ./bin/targets/ \
            -type f \
            \( \
              -name "*.img" \
              -o -name "*.img.gz" \
              -o -name "*.bin" \
              -o -name "*.itb" \
              -o -name "*.gz" \
            \) \
            ! -path "*/packages/*" \
            -exec cp -f {} ./artifact/firmware/ \;


          SOURCE_FW="$(
            find ./bin/targets/rockchip/armv8 \
              -maxdepth 1 \
              -type f \
              -name '*embedfire_doornet2-ext4-sysupgrade.img.gz' \
              | head -n 1
          )"


          if [ -z "$SOURCE_FW" ]; then

              echo "ERROR: DoorNet2 firmware not found"
              exit 1

          fi


          cp -f \
            "$SOURCE_FW" \
            ./artifact/release/DoorNet2-ext4-sysupgrade.img.gz


          cd ./artifact/release


          SHA256="$(
            sha256sum \
              DoorNet2-ext4-sysupgrade.img.gz \
            | awk '{print $1}'
          )"


          echo \
            "${SHA256}  DoorNet2-ext4-sysupgrade.img.gz" \
            > sha256sums.txt


          cat > version.json <<EOF
          {
            "board": "embedfire,doornet2",
            "version": "${DOORNET2_VERSION}",
            "tag": "${DOORNET2_TAG}",
            "build_date": "${DOORNET2_BUILD_DATE}",
            "commit": "${GITHUB_SHA}",
            "repository": "${GITHUB_REPOSITORY}",
            "asset": "DoorNet2-ext4-sysupgrade.img.gz",
            "sha256": "${SHA256}",
            "boot_policy": "tf-first-emmc-fallback",
            "mmc_layout": "mmcblk0-tf-mmcblk1-emmc",
            "tf_controller": "fe320000.mmc",
            "emmc_controller": "fe330000.mmc",
            "extroot": false,
            "updater": "physical-target-guard-v2",
            "tf_capacity": "preserve-expanded-root-v1",
            "network_apps": "passwall-smartdns-adguard-persist-online-v6",
            "ui": "slim-source-argon-1.8.1-extracted-with-bootstrap-fallback-v1",
            "runtime_monitor": "cpu-temp-status-only-v1",
            "ip_policy": "domestic-dualstack-proxy-ipv4only-v1",
            "persistence": "sysupgrade-explicit-adguard-v2",
            "wan_policy": "preserve-existing-proto-and-pppoe-creds-v2",
            "self_heal": "service-aware-two-strike-v2",
            "root_auth": "preserve-user-password-no-known-default-v1",
            "shunt_presets": "preset-rules-tencent-direct-login-safe-v5",
            "dns_chain": "adguard-smartdns-postpasswall-v5",
            "adguard_runtime": "official-v0.107.79-arm64-sha256-v1",
            "passwall_delay": "route-aware-proxy-aware-v2",
            "health_check": "selfcheck-selfheal-v3",
            "dns_postpasswall": "chinadns-smartdns-guard-v2",
            "smartdns_openai": "proxytest-ipv4only-reboot-validated-v1",
            "profile": "stable-final-v5.3.5-solidified-no-uu-dnsfailover-adguard10779-dualstack-proxyv4-slim-argon181",
            "release": "R4"
          }
          EOF


          cat > release-notes.md <<EOF
          # DoorNet2 OpenWrt R4 (${DOORNET2_VERSION})

          R18 storage layout:

          - U-Boot mmc1 = TF
          - U-Boot mmc0 = eMMC
          - Linux mmcblk0 = TF
          - Linux mmcblk1 = eMMC
          - TF controller = fe320000.mmc
          - eMMC controller = fe330000.mmc
          - TF physical type = SD
          - eMMC physical type = MMC

          Boot:

          - TF inserted -> TF kernel + TF rootfs
          - TF removed -> automatic eMMC fallback

          Upgrade protection:

          - Check MMC host aliases
          - Check physical SD/MMC type
          - Check controller path
          - Check current root disk
          - Check OpenWrt sysupgrade diskdev
          - Reject upgrade if any result differs

          TF capacity preservation:

          - Firmware image remains 7 GiB for eMMC compatibility
          - Expanded TF p2 partition table is preserved during sysupgrade
          - ext4 is automatically grown back to the existing TF p2 size
          - eMMC keeps the original Rockchip upgrade behaviour

          R4 stable interface:

          - Lua-compatible Argon from the matching LuCI feed is the default shell; Bootstrap is retained as fallback
          - Normal LuCI Status / Overview is the homepage
          - QuickStart remains installed only as an optional application page
          - System hostname and Argon top-left brand are both standardized to "OpenWrt"; DoorNet2 updater/service/release identifiers remain internal project names
          - PassWall visible R4Shunt label is "分流总节点"; retained V5.3.3 "R4 分流总节点" is migrated in place without changing the internal R4Shunt section
          - Legacy Design is not included; Argon is selected from the matching Lua LuCI feed for compatibility
          - No top-right floating CPU/date/time badge is injected
          - CPU temperature remains available in the normal system/CPU status line when supported
          - Timezone/NTP remain configured for Asia/Shanghai

          R4 PassWall compatibility:

          - PassWall is pinned to 25.1.15-1
          - Xray is pinned to 25.1.30 for the Go 1.23 buildroot
          - firewall3/iptables transparent proxy backend is selected
          - Native LEDE ip6tables userspace and kmod-ip6tables support are included
          - Xray is the only built-in proxy core; optional legacy/newer cores remain disabled

          V5.3.5 Final Solidified online-upgrade stability profile:

          - LAN management IP remains 192.168.100.1
          - Lua-compatible Argon + normal Status/Overview are the default experience
          - The old top-right CPU/date/time floating badge stays removed
          - TF-first / eMMC-fallback boot and physical upgrade guards are retained
          - OpenWrt firmware updater, PassWall updater and network-app updater are retained; AdGuard is firmware-managed and excluded from OPKG component updates
          - The separately integrated NetEase UU Game Booster package/runtime/guards are removed
          - PassWall has a route-aware, proxy-aware delayed recovery guard; it skips redundant restart when Xray/sing-box is already running
          - X/Twitter parent domains (x.com/twitter.com/twimg.com/t.co) use proxy-test IPv4-only DNS while domestic/direct DNS remains dual-stack
          - AdGuard Home runtime is pinned to official v0.107.79 arm64 with SHA256 verification; retained schema-29 YAML is preserved across online sysupgrade
          - DNS-chain helper establishes SmartDNS :6053 fail-safe first, then enables AdGuard :3053 only after a successful end-to-end DNS query
          - PassWall start/restart removes the global :15353 bypass but never forces :3053 unless AdGuard is healthy; otherwise dnsmasq stays on SmartDNS :6053
          - SmartDNS keeps the reboot-validated OpenAI/ChatGPT proxy-test rules and proxy-domain AAAA suppression; domestic/direct DNS remains dual-stack
          - WeChat / QQ / Tencent media domains remain forced direct; no global TCP/10001, MTU/MSS or IPv6 workaround is added
          - /usr/bin/doornet2-health provides a read-only whole-system self-check
          - /usr/bin/doornet2-readiness records boot readiness in /tmp/doornet2-boot.log without changing network policy
          - /usr/bin/doornet2-heal + doornet2-selfheal provide conservative two-strike service recovery
          - Domestic/direct traffic uses native IPv4 + IPv6; PassWall proxy targets filter AAAA and use IPv4 only
          - PassWall forced-direct rule includes api.example.com and speedtest.net + subdomains
          - High-priority Tencent direct rule covers WeChat, QQ, qpic/gtimg/idqqimg/qlogo and weixinbridge media traffic
          - /etc/sysupgrade.conf explicitly retains network/PassWall/SmartDNS/AdGuard user configuration
          - Existing WAN protocol is preserved; DHCP/static WAN keeps standalone wan6 enabled while PPPoE avoids a duplicate eth0 DHCPv6 client
          - If retained PPPoE credentials exist but proto is missing, PPPoE is reconstructed instead of falling back to DHCP
          - The upstream known root password "password" hook is removed; retained root credentials are never reset by the image
          - No personal PPPoE credentials, proxy node IDs or AdGuard password are baked into firmware

          R4 built-in PassWall shunt presets (v4 login-safe):

          - PassWall's stock \`myshunt\` / "Xray 分流：分流总节点" is removed on
            clean installs so LuCI shows only the DoorNet2 R4 shunt framework
          - On retained upgrades, an untouched stock myshunt is removed, while
            a user-customized legacy myshunt is preserved

          - Preloaded "分流总节点" framework (internal UCI id remains R4Shunt); ordinary preset rows start unused
          - Rules include WeChat, QQ, LINE, WhatsApp, Signal, Telegram,
            Discord, Facebook, Instagram, X/Twitter, Reddit, Google,
            YouTube, Google AI/Gemini, Gmail/Drive, OpenAI/ChatGPT,
            Claude, Perplexity, Copilot, Grok, Netflix, Disney+, Max/HBO,
            Prime Video, Spotify, TikTok, Apple, Microsoft, GitHub, Slack,
            Zoom, Notion, Dropbox, PlayStation, Nintendo, Xbox, local media,
            AIGC, Streaming, ProxyGame and DirectGame
          - Personal/imported proxy node IDs are never baked into firmware
          - Every ordinary preset starts unused; select the desired proxy node in LuCI
          - Existing global PassWall state is preserved during retained upgrades
          - Retained upgrades remove stale duplicate S99passwall / S19passwall-delay rc links; the PassWall guard restarts only when the proxy core is actually missing

          R4 DNS preset:

          - SmartDNS clean-install default: port 6053
          - Tested upstreams: 223.5.5.5 and 119.29.29.29
          - SmartDNS does not auto-edit dnsmasq
          - Clean installs ship a working AdGuard Home baseline on :3053; retained upgrades preserve the existing YAML and credentials
          - AdGuard DNS filter is enabled in the clean-install baseline
          - anti-AD remains preloaded but disabled by default
          - Existing retained filters and user rules are preserved by sysupgrade; the baseline does not overwrite them
          - When AdGuard is actually listening on 3053, R4 automatically wires:
            dnsmasq :53 -> AdGuard Home :3053 -> SmartDNS :6053
          - PassWall DNS redirect is disabled when this validated chain activates
          - ChinaDNS-NG :15353 remains PassWall-internal and is never a generic main dnsmasq upstream
          - iPhone ChatGPT login was validated after rebooting both DoorNet2 and the iPhone

          Online-updatable network applications:

          - PassWall proxy routing
          - SmartDNS DNS acceleration
          - AdGuard Home
          - Updates come from the DoorNet2 OPKG feed built by this workflow
          - Kernel/kmod packages are never selected by the component updater

          SHA256:

          ${SHA256}
          EOF


          ls -lah

          cat version.json


      # ============================================================
      # 18. Prepare OPKG feed
      # ============================================================

      - name: Prepare OPKG feed
        run: |
          set -e

          rm -rf ./artifact/opkg-feed

          mkdir -p \
            ./artifact/opkg-feed/packages \
            ./artifact/opkg-feed/targets/rockchip/armv8

          cp -a \
            ./bin/packages/. \
            ./artifact/opkg-feed/packages/


          if [ -d "./bin/targets/rockchip/armv8/packages" ]; then

              cp -a \
                ./bin/targets/rockchip/armv8/packages \
                ./artifact/opkg-feed/targets/rockchip/armv8/

          else

              echo "ERROR: target package directory missing"
              exit 1

          fi


          cat > ./artifact/opkg-feed/README.md <<EOF
          # DoorNet2 OPKG Feed

          Version:
          ${DOORNET2_VERSION}

          Target:
          rockchip/armv8

          Architecture:
          aarch64_generic
          EOF


          COUNT="$(
            find ./artifact/opkg-feed \
              -type f \
              -name "Packages.gz" \
            | wc -l
          )"


          if [ "$COUNT" -lt 2 ]; then

              echo "ERROR: OPKG indexes missing"
              exit 1

          fi


      # ============================================================
      # 19. Upload artifacts
      # ============================================================

      - name: Upload buildinfo
        uses: actions/upload-artifact@v4
        with:
          name: DoorNet2_buildinfo
          path: ./artifact/buildinfo/
          retention-days: 30


      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: DoorNet2_packages
          path: ./artifact/package/
          retention-days: 30


      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: DoorNet2_firmware
          path: ./artifact/firmware/
          retention-days: 30


      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: DoorNet2_release
          path: ./artifact/release/
          retention-days: 30


      - name: Upload OPKG feed backup
        uses: actions/upload-artifact@v4
        with:
          name: DoorNet2_opkg_feed
          path: ./artifact/opkg-feed/
          retention-days: 30


      # ============================================================
      # 20. Publish OPKG
      # ============================================================

      - name: Publish OPKG feed
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -e

          rm -rf /tmp/doornet2-opkg-feed

          git clone \
            --depth 1 \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            /tmp/doornet2-opkg-feed

          cd /tmp/doornet2-opkg-feed

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout \
            --orphan \
            opkg-feed-new

          git rm -rf . \
            >/dev/null 2>&1 || true

          cp -a \
            "${GITHUB_WORKSPACE}/artifact/opkg-feed/." \
            .

          git add -A

          git commit \
            -m "Update DoorNet2 OPKG feed ${DOORNET2_VERSION}"

          git branch -M opkg-feed

          git push \
            --force \
            origin \
            opkg-feed


      # ============================================================
      # 21. Publish firmware release
      # ============================================================

      - name: Publish firmware release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          publish_release()
          {
              if gh release view \
                "${DOORNET2_TAG}" \
                --repo "${GITHUB_REPOSITORY}" \
                >/dev/null 2>&1
              then
                  gh release upload \
                    "${DOORNET2_TAG}" \
                    "${GITHUB_WORKSPACE}/artifact/release/DoorNet2-ext4-sysupgrade.img.gz" \
                    "${GITHUB_WORKSPACE}/artifact/release/sha256sums.txt" \
                    "${GITHUB_WORKSPACE}/artifact/release/version.json" \
                    "${GITHUB_WORKSPACE}/artifact/release/release-notes.md" \
                    --repo "${GITHUB_REPOSITORY}" \
                    --clobber

                  gh release edit \
                    "${DOORNET2_TAG}" \
                    --repo "${GITHUB_REPOSITORY}" \
                    --title "DoorNet2 ${DOORNET2_VERSION}" \
                    --notes-file \
                    "${GITHUB_WORKSPACE}/artifact/release/release-notes.md"
              else
                  gh release create \
                    "${DOORNET2_TAG}" \
                    "${GITHUB_WORKSPACE}/artifact/release/DoorNet2-ext4-sysupgrade.img.gz" \
                    "${GITHUB_WORKSPACE}/artifact/release/sha256sums.txt" \
                    "${GITHUB_WORKSPACE}/artifact/release/version.json" \
                    "${GITHUB_WORKSPACE}/artifact/release/release-notes.md" \
                    --repo "${GITHUB_REPOSITORY}" \
                    --target "${GITHUB_SHA}" \
                    --title "DoorNet2 ${DOORNET2_VERSION}" \
                    --notes-file \
                    "${GITHUB_WORKSPACE}/artifact/release/release-notes.md"
              fi
          }

          attempt=1
          while [ "$attempt" -le 3 ]; do
              if publish_release; then
                  echo "Firmware release published on attempt $attempt"
                  exit 0
              fi
              echo "WARN: firmware release publish attempt $attempt failed"
              attempt=$((attempt + 1))
              sleep 20
          done

          echo "WARN: firmware image/artifacts are valid, but GitHub Release publication failed after retries."
          exit 1


      # ============================================================
      # 22. Final verification
      # ============================================================

      - name: Final build verification
        if: always()
        run: |
          set -e

          # This diagnostic step runs even when an earlier required step fails.
          # The release marker is created before the world build, so it cannot
          # prove that compilation/artifact preparation succeeded. Gate on the
          # actual release firmware instead to avoid secondary red failures.
          if [ ! -s ./artifact/release/DoorNet2-ext4-sysupgrade.img.gz ]; then
              echo "INFO: final verification skipped because the release firmware artifact was not prepared."
              exit 0
          fi

          echo "========================================"
          echo "DoorNet2 R4 V5.3.5 Final Solidified NO-UU build finished"
          echo "========================================"

          echo
          echo "VERSION:"
          echo "${DOORNET2_VERSION}"

          echo
          echo "===== RELEASE ====="
          cat files/etc/doornet2_release


          echo
          echo "===== BOOT SCRIPT ====="

          grep -nE \
            'Trying TF|Trying eMMC|mmcblk0p2|mmcblk1p2' \
            target/linux/rockchip/image/doornet2.bootscript


          echo
          echo "===== DTS MMC ALIASES ====="

          DTS_FILE="$(
            find target/linux/rockchip \
              -type f \
              -name '*.dts' \
              -print \
            | grep -Ei 'doornet2|door-net2' \
            | head -n 1
          )"

          if [ -z "$DTS_FILE" ]; then

              DTS_FILE="$(
                grep -RIl \
                  --include='*.dts' \
                  'DOORNET2_R18_FIXED_MMC_ALIASES' \
                  target/linux/rockchip \
                  | head -n 1
              )"

          fi


          test -n "$DTS_FILE"

          grep -nE \
            'DOORNET2_R18_FIXED_MMC_ALIASES|mmc0.*sdmmc|mmc1.*sdhci' \
            "$DTS_FILE"


          grep -qE \
            'mmc0[[:space:]]*=[[:space:]]*&sdmmc' \
            "$DTS_FILE"

          grep -qE \
            'mmc1[[:space:]]*=[[:space:]]*&sdhci' \
            "$DTS_FILE"


          echo
          echo "===== UPDATER ====="

          sh -n files/usr/bin/doornet2-updater

          grep -nE \
            'fe320000.mmc|fe330000.mmc|verify_mmc_host_layout|verify_sysupgrade_target' \
            files/usr/bin/doornet2-updater


          echo
          echo "===== TF CAPACITY PRESERVE ====="

          PLATFORM="target/linux/rockchip/armv8/base-files/lib/upgrade/platform.sh"

          sh -n "$PLATFORM"

          grep -nE \
            'DOORNET2_R21_TF_CAPACITY_PRESERVE_V1|RAMFS_COPY_BIN|doornet2_tf_can_preserve_partitions|doornet2_tf_grow_ext4|fe320000.mmc|e2fsck|resize2fs' \
            "$PLATFORM"

          grep -q \
            'DOORNET2_R21_TF_CAPACITY_PRESERVE_V1' \
            "$PLATFORM"

          grep -q \
            "DOORNET2_TF_CAPACITY='preserve-expanded-root-v1'" \
            files/etc/doornet2_release


          echo
          echo "===== PASSWALL ====="

